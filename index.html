];

function requirementsCard(){
  const tabs = ADMIN.parsed?.tabs;
  if (tabs){
    const tag = t => t.status === "empty" ? `<span class="tag none">empty — ignored</span>`
      : t.status === "primary" ? `<span class="tag good">✓ ${esc(t.roleLabel)}</span>`
      : t.roleLabel && tabs.some(x => x.role === t.role && x.status === "primary") ? `<span class="tag warn">${esc(t.roleLabel)} · other window</span>`
      : `<span class="tag warn">${t.roleLabel ? esc(t.roleLabel) + " · " : ""}shown as a table</span>`;
    return `<div class="card" style="margin-top:14px">
      <h3>What was found in this workbook</h3>
      <p class="cs">Every non-empty tab is read. Where several tabs hold the same report for different date windows,
        the one closest to a full month drives the section; the others appear under "More from the workbook".</p>
      <div class="spec">${tabs.map(t => `<div class="spec-row"><div class="spec-head">${tag(t)}<b>${esc(t.name)}</b>
        <span class="muted">${t.window ? esc(t.window) + " · " : ""}${fmtNum(t.rows)} row${t.rows===1?"":"s"}${t.campaignSource && t.role !== "campaigns" ? " · campaign totals" : ""}</span></div></div>`).join("")}</div>
    </div>`;
  }
  return `<div class="card" style="margin-top:14px">
    <h3>What the parser recognises</h3>
    <p class="cs">Tab names don't matter and can change from one workbook to the next. Each tab's header row is
      found automatically (title and "Period covered" lines above it are fine), its columns are matched loosely —
      "Impr." and "Impressions" both work — and the columns decide which section it feeds. Completely empty tabs
      are ignored; tabs that don't match anything below are still shown as tables.</p>
    <div class="spec">
      ${WORKBOOK_SPEC.map(r => `<div class="spec-row">
        <div class="spec-head"><b>${esc(ROLE_LABEL[r.role] || r.role)}</b><span class="muted">→ ${esc(r.gives)}</span></div>
        <div class="spec-cols">${esc(r.cols)}</div>
      </div>`).join("")}
    </div>
    <div class="note" style="margin-top:14px">${SVG.info}<div>
      Campaign names are how a campaign finds its location: the part before " - " is taken as the place
      (<b>Alpharetta - Pmax</b> → Alpharetta), and <b>Joint Replacement - Paulding</b> is understood too.
      The reporting month comes from the account performance date; when the sheet only says when it was
      pulled, the month before that is reported.</div></div>
  </div>`;
}

/* The words on the dashboard: the reporting period, the summary and each section's
   plan. Every field starts filled with what the figures generate, so editing is
   always a revision rather than a blank page, and "Use the generated text" puts it
   back. Nothing here is saved until you publish. */
const SECTION_LABELS = [
  ["overview","Account overview"], ["locations","Location performance"], ["campaigns","Campaign performance"], ["budget","Budget use"], ["timing","Days & hours"],
  ["share","Impression share"], ["pmax","Performance Max"], ["audience","Audience"],
  ["terms","Keywords & search terms"], ["geo","Geography"], ["placements","Placements"]
];

function contentSection(){
  const S0 = ADMIN.draft || STATE.settings;
  const key = dataKey(ADMIN.parsed || STATE.data);
  const staleSummary = S0.summary && S0.summary.forData !== key;
  const staleActions = Object.keys(S0.actions || {}).some(k => k !== "__forData") && (S0.actions || {}).__forData !== key;
  /* Wording written for older figures is set aside, not offered back for editing. */
  const S = { ...S0, summary: staleSummary ? null : S0.summary, actions: staleActions ? {} : (S0.actions || {}) };
  const sum = ADMIN.summary !== null && ADMIN.summary !== undefined
    ? ADMIN.summary
    : (S.summary && (S.summary.text || (S.summary.bullets||[]).length)
        ? { text:S.summary.text || "", bullets:(S.summary.bullets||[]).join("\n") }
        : { text:summaryPlainText(), bullets:summaryPlainBullets().join("\n") });
  const acts = ADMIN.actions || {};
  const actValue = id => {
    if (typeof acts[id] === "string") return acts[id];
    const saved = (S.actions||{})[id];
    if (typeof saved === "string" && saved.trim()) return saved;
    return generatedActions(id).map(l => l.replace(/<[^>]+>/g, "")).join("\n");
  };
  const isEdited = id => {
    if (id === "__forData") return false;
    const saved = (S.actions||{})[id];
    return (typeof acts[id] === "string" && acts[id].trim()) || (typeof saved === "string" && saved.trim());
  };
  const open = ADMIN.openAction;

  return `<section>
    <div class="sechead"><h2>Report wording</h2>
      <span class="sub">Period, summary and the action plan under each section — all optional, all saved on publish</span></div>
    ${staleSummary || staleActions ? `<div class="note" style="margin-bottom:14px;border-color:var(--warn);background:var(--warnBg)">${SVG.info}<div><b>Earlier wording has been set aside.</b> A ${staleSummary ? "summary" : ""}${staleSummary && staleActions ? " and " : ""}${staleActions ? "set of next actions" : ""} was typed for older figures, so the dashboard now shows text generated from the current data. Write new wording below if you want to override it again.</div></div>` : ""}

    <div class="card" style="margin-bottom:14px">
      <h3>Reporting month</h3>
      <p class="cs">Shown at the top of the dashboard. Leave it blank and it comes from the account performance
        date in the sheet — currently <b>${esc((ADMIN.parsed?.reporting?.label) || derivedPeriod() || "nothing, since no workbook is loaded")}</b>${(ADMIN.parsed || STATE.data)?.reporting?.basis ? `, taken from ${esc((ADMIN.parsed || STATE.data).reporting.basis)}` : ""}.
        Type here only to override it.</p>
      <input id="f-period" data-set="period" value="${esc(S.period || "")}"
        placeholder="${esc((ADMIN.parsed?.reporting?.label) || derivedPeriod() || "e.g. September 2026")}"
        style="width:100%;max-width:420px;padding:9px 11px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:13.5px;font-family:inherit">
    </div>

    <div class="card" style="margin-bottom:14px">
      <div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap">
        <h3>Performance summary</h3>
        <button class="linkbtn" style="color:var(--s1)" id="regenSummary">Use the generated text</button>
      </div>
      <p class="cs">The opening block of the dashboard. Blank lines start a new paragraph.</p>
      <textarea id="s-text" data-summary="text" rows="5" placeholder="Two or three sentences on how the period went."
        style="width:100%;box-sizing:border-box;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:13.5px;font-family:inherit;line-height:1.6;resize:vertical">${esc(sum.text)}</textarea>
      <label class="flabel" style="margin-top:14px">Bullet points — one per line</label>
      <textarea id="s-bul" data-summary="bullets" rows="6" placeholder="One point per line."
        style="width:100%;box-sizing:border-box;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:13.5px;font-family:inherit;line-height:1.6;resize:vertical">${esc(sum.bullets)}</textarea>
      <p class="cs" style="margin-top:10px">Clear both boxes to go back to the generated summary.</p>
    </div>

    <div class="card">
      <h3>Next actions, by section</h3>
      <p class="cs">Each box is pre-filled with what the figures suggest. Edit any of them and that
        section shows your wording instead, labelled as written by the account manager. One action per line.</p>
      <div style="display:grid;gap:8px;margin-top:12px">
        ${SECTION_LABELS.map(([id,label]) => `
          <div style="border:1px solid var(--line);border-radius:10px;overflow:hidden">
            <button class="acc-head" data-action-open="${id}" aria-expanded="${open===id}">
              <span>${esc(label)}</span>
              <span style="display:flex;align-items:center;gap:9px">
                ${isEdited(id) ? `<span class="pill" style="background:var(--accentBg);color:var(--accent)">edited</span>` : ``}
                <span style="opacity:.5">${open===id?"▲":"▼"}</span>
              </span>
            </button>
            ${open===id ? `<div style="padding:0 14px 14px">
              <textarea data-action="${id}" rows="5"
                style="width:100%;box-sizing:border-box;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:13.2px;font-family:inherit;line-height:1.6;resize:vertical">${esc(actValue(id))}</textarea>
              <button class="linkbtn" style="color:var(--s1);margin-top:8px" data-action-reset="${id}">Use the generated actions</button>
            </div>` : ``}
          </div>`).join("")}
      </div>
    </div>
  </section>`;
}

/* Uploading a workbook already replaces everything, so this is not the way to swap
   one dataset for another. It is here for the cases upload doesn't cover: retiring a
   bad publish when the replacement isn't ready, resetting a comparison baseline that
   has stopped being meaningful, or handing the page on without its figures. */
function clearSection(){
  const c = ADMIN.confirm;
  const snaps = STATE.history.length;
  const armed = (kind, label, detail) => c === kind
    ? `<div style="display:flex;gap:9px;align-items:center;flex-wrap:wrap">
         <button class="btn" style="background:var(--crit);color:#fff" data-clear-go="${kind}" ${ADMIN.busy?"disabled":""}>
           ${ADMIN.busy?"Clearing…":`Yes, ${label.toLowerCase()}`}</button>
         <button class="btn sec" data-clear="">Cancel</button>
         <span style="font-size:12px;color:var(--crit);font-weight:600">${esc(detail)}</span>
       </div>`
    : `<button class="btn sec" data-clear="${kind}" ${ADMIN.busy?"disabled":""}>${esc(label)}</button>`;

  return `<section>
    <div class="sechead"><h2>Clear published data</h2>
      <span class="sub">Accounts, thresholds and branding are never touched by either action</span></div>
    <div class="card danger">
      <div style="display:grid;gap:18px">
        <div>
          <h3>Remove the figures</h3>
          <p class="cs">Takes the dashboard back to "no workbook published yet" for everyone, and drops the
            ${snaps} trend snapshot${snaps===1?"":"s"} along with them. Publishes straight away.
            ${hasData() ? `Currently holding <b>${esc(STATE.data.sourceFile || "a workbook")}</b>.` : `Nothing is published right now.`}</p>
          ${hasData()
            ? armed("data", "Clear the data", "This publishes immediately — everyone loses the figures.")
            : `<span class="muted" style="font-size:12.5px">Nothing to clear.</span>`}
        </div>
        <div style="border-top:1px solid var(--line);padding-top:18px">
          <h3>Reset the comparison baseline</h3>
          <p class="cs">Keeps the current figures and deletes the ${snaps} snapshot${snaps===1?"":"s"} behind the trend
            charts and the "vs last upload" deltas. Worth doing when the next workbook covers a different
            client or a different window, so the comparison would be meaningless.</p>
          ${snaps
            ? armed("history", "Reset trend history", "The trend charts start again from your next upload.")
            : `<span class="muted" style="font-size:12.5px">No snapshots recorded yet.</span>`}
        </div>
      </div>
      <div class="note" style="margin-top:18px">${SVG.info}<div>Neither of these is needed just to load a new
        workbook — uploading one already replaces every section. Your .xlsx stays the source of truth, so
        anything cleared here comes back by uploading again.</div></div>
    </div>
  </section>`;
}

const app = document.getElementById("app");
let NOTICE = null;
let AUTH = { email:"", pw1:"", pw2:"", err:null, busy:false, mode:"signin",
             reqName:"", reqEmail:"", reqOrg:"", sent:false, sentBody:"", sentName:"", sentEmail:"" };
let ACCESS = { newEmail:"", newPw:"", newRole:"client", chg1:"", chg2:"", busy:false,
               addMsg:null, addOk:false, chgMsg:null, chgOk:false,
               chkEmail:"", chkPw:"", chkMsg:null, chkOk:false, checking:false };

function render(){
  app.setAttribute("data-skin", SKIN);
  document.documentElement.style.background = getComputedStyle(app).getPropertyValue("--page");
  app.innerHTML =
      VIEW === "nocrypto"    ? noCryptoView()
    : VIEW === "unreachable" ? unreachableView()
    : VIEW === "setup"    ? setupView()
    : VIEW === "signin"   ? (AUTH.mode === "request" ? requestView() : signInView()) + (AUTH.sent ? requestSentDialog() : "")
    : VIEW === "admin"    ? admin()
    : dashboard() + (EXPORT.open ? exportDialog() : "") + (ASK.open ? askPanel() : "");
  initTooltip();
  if (EXPORT.open){ document.getElementById("printNow")?.focus(); }
  else if (VIEW === "signin" && AUTH.sent){ document.getElementById("closeSent")?.focus(); }
  else if (VIEW === "signin" && AUTH.mode === "request"){ document.getElementById(AUTH.reqName ? "r-email" : "r-name")?.focus(); }
  else if (VIEW === "signin" || VIEW === "setup"){
    const f = document.getElementById(AUTH.email ? (VIEW === "setup" ? "pw1" : "pw") : "email");
    f?.focus();
    if (f && f.type === "password") f.value = VIEW === "setup" ? AUTH.pw1 : "";
  }
  if (VIEW === "dashboard" && hasData()){ wireScrollSpy(); initMaps(); }
}

function wireScrollSpy(){
  const links = [...app.querySelectorAll("[data-nav]")];
  const secs = links.map(l => document.getElementById(l.dataset.nav)).filter(Boolean);
  const io = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (e.isIntersecting) links.forEach(l => l.classList.toggle("on", l.dataset.nav === e.target.id));
    });
  }, { rootMargin:"-15% 0px -70% 0px" });
  secs.forEach(s => io.observe(s));
}

app.addEventListener("click", async (e) => {
  const t = e.target;
  if (NOTICE && t.closest("a,button")) NOTICE = null;
  const skinBtn = t.closest("[data-skin-set]");
  if (skinBtn){ SKIN = skinBtn.dataset.skinSet; try{localStorage.setItem("ortho-skin",SKIN);}catch(_){} render(); return; }
  if (t.closest("#retryLoad")){ location.reload(); return; }
  const lt = t.closest("[data-launch]");
  if (lt){ AUTH.mode = lt.dataset.launch; AUTH.err = null; render(); return; }
  if (t.closest("#doRequest")){ doRequest(); return; }
  if (t.closest("#closeSent")){ AUTH.sent = false; AUTH.mode = "signin"; ADMIN.copied = false; render(); return; }
  if (t.closest("#copyReq")){
    navigator.clipboard?.writeText(AUTH.sentBody).then(() => { ADMIN.copied = true; render(); }).catch(()=>{});
    return;
  }
  if (t.closest("#doPrint")){ EXPORT = { open:true, busy:false, msg:null, ok:false, printed:false }; render(); return; }
  if (t.closest("#toggleClient")){ UI.asClient = !UI.asClient; const y = window.scrollY; render(); window.scrollTo(0,y); return; }
  if (t.closest("#askAiOpen")){ ASK.open = true; render(); document.getElementById("askInput")?.focus(); return; }

/* Same column twice flips direction; a new column starts descending for numbers
   and ascending for text, which is what each reads best as. */
function toggleSort(token){
  const [id, key] = token.split(":");
  const cur = UI.sorts[id];
  UI.sorts[id] = (cur && cur.k === key)
    ? { k:key, d: cur.d === "desc" ? "asc" : "desc" }
    : { k:key, d: TEXT_COLS.has(key) ? "asc" : "desc" };
  const y = window.scrollY; render(); window.scrollTo(0, y);
  document.querySelector(`[data-tsort="${CSS.escape(token)}"]`)?.focus({ preventScroll:true });
}

/* A full re-render on every keystroke used to drive the strength meter. That
   rebuilds the DOM under the caret, and a character typed during the rebuild
   lands on the detached input and is lost — which silently stores a password
   different from the one on screen. The meter is now updated in place. */
function updateMeter(el){
  const box = el.parentElement?.querySelector("[data-meter]");
  if (!box) return;
  const st = passwordStrength(el.value);
  box.hidden = !el.value;
  const bar = box.querySelector("[data-meter-bar]"), lab = box.querySelector("[data-meter-label]");
  if (bar){ bar.style.width = (st.score*25) + "%"; bar.style.background = st.color; }
  if (lab){ lab.textContent = st.label; lab.style.color = st.color; }
}

/* The markup the meter updates, rendered once and then mutated in place. */
function meterHTML(value){
  const st = passwordStrength(value);
  return `<div data-meter ${value ? "" : "hidden"} style="display:flex;align-items:center;gap:8px;margin-top:7px">
    <div style="flex:1;height:4px;border-radius:2px;background:var(--grid);overflow:hidden">
      <div data-meter-bar style="width:${st.score*25}%;height:100%;background:${st.color};transition:width .15s"></div></div>
    <span data-meter-label style="font-size:11px;font-weight:700;color:${st.color}">${esc(st.label)}</span></div>`;
}

async function openVault(dek){
  if (!PUB.vault) return { settings:{ ...DEFAULT_SETTINGS }, data:null, history:[] };
  const v = await openJSON(PUB.vault, dek);
  return { settings:{ ...DEFAULT_SETTINGS, ...(v.settings||{}) }, data:v.data || null, history:v.history || [] };

async function doSignIn(){
  if (AUTH.busy || lockoutRemaining()) return;
  const email = document.getElementById("email")?.value || AUTH.email;
  const pw = document.getElementById("pw")?.value || "";
  AUTH.email = email;
  if (!email || !pw){ AUTH.err = "Enter your email and password."; render(); return; }
  AUTH.busy = true; AUTH.err = null; render();
  const res = await unlock(email, pw, PUB.auth);
  if (!res){
    noteFailure();
    AUTH.busy = false; AUTH.err = "That email and password don't match an account.";
    render(); return;
  }
  try {
    SESSION = { email: res.user.email, role: res.user.role, dek: res.dek };
    STATE = await openVault(res.dek);
  } catch(err){
    AUTH.busy = false; AUTH.err = "Signed in, but the data on this page couldn't be decrypted.";
    SESSION = null; render(); return;
  }
  clearFailures();
  await saveSession(SESSION.email, SESSION.role, SESSION.dek);
  AUTH = { email:"", pw1:"", pw2:"", err:null, busy:false };
  VIEW = "dashboard"; render();
  startAutoSync();
}

async function doSetup(){
  if (AUTH.busy) return;
  const email = document.getElementById("email")?.value || AUTH.email;
  const pw1 = document.getElementById("pw1")?.value || AUTH.pw1;
  const pw2 = document.getElementById("pw2")?.value || AUTH.pw2;
  AUTH.email = email; AUTH.pw1 = pw1; AUTH.pw2 = pw2;
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email.trim())){ AUTH.err = "That doesn't look like an email address."; render(); return; }
  const problem = passwordProblem(pw1);
  if (problem){ AUTH.err = problem; render(); return; }
  if (pw1 !== pw2){ AUTH.err = "The two passwords don't match."; render(); return; }

  AUTH.busy = true; AUTH.err = null; render();
  try {
    const dek = await newDEK();
    const user = await makeUser(email, pw1, "admin", dek);
    SESSION = { email:user.email, role:"admin", dek };
    STATE = { settings:{ ...DEFAULT_SETTINGS }, data:null, history:[] };
    const pub = await buildPublic(STATE.settings, null, [], { users:[user] }, PUB.brand, PUB.contact || '');
    const res = await persist(pub);
    if (!res.ok){
      SESSION = null; STATE = null;
      AUTH.busy = false;
      AUTH.err = res.code === "not_writer"
        ? "The save request wasn't authorized — check that the write token in the page matches STATE_WRITE_TOKEN on the server."
        : `The account couldn't be saved to the server${res.code?` (${res.code})`:""}, so it wasn't created.`;
      render(); return;
    }
    await saveSession(SESSION.email, SESSION.role, SESSION.dek);
    clearFailures();
    AUTH = { email:"", pw1:"", pw2:"", err:null, busy:false };
    NOTICE = { kind:"ok", text:`<b>Account created.</b> You're signed in as ${esc(SESSION.email)}. Upload the tracker workbook to fill the dashboard.` };
    VIEW = "dashboard"; render();
  } catch(err){
    AUTH.busy = false; AUTH.err = err?.message || "Something went wrong creating the account.";
    render();
  }
}

/* ---------------------------------------------------------------------
   Export.

   This page runs inside a sandboxed frame, and a sandboxed frame is often not
   allowed to open the print dialog itself — window.print() then does nothing at
   all, with no error to catch. So printing is attempted, its success is detected
   by whether the browser fires beforeprint, and a file download is offered
   alongside it: an HTML report opens locally and prints perfectly, and Markdown
   is there because the sandbox always permits that extension even when it
   refuses HTML.
   ------------------------------------------------------------------ */
let EXPORT = { open:false, busy:false, msg:null, ok:false, printed:false };
let ASK = { open:false, busy:false, input:"", error:null, messages:[] };

/* Switch the on-screen page into the report layout, run fn, then switch back. */
async function inReportLayout(fn){
  const was = SKIN;
  if (SKIN !== "classic"){ SKIN = "classic"; render(); }
  document.body.classList.add("printing");
  try { return await fn(); }
  finally {
    document.body.classList.remove("printing");
    if (was !== SKIN){ SKIN = was; render(); }
  }
}

function doPrint(){
  EXPORT.msg = null;
  let fired = false;
  const mark = () => { fired = true; };
  window.addEventListener("beforeprint", mark, { once:true });
  inReportLayout(() => new Promise(done => {
    setTimeout(() => {
      try { window.print(); } catch(_){ /* blocked; handled below */ }
      setTimeout(() => {
        window.removeEventListener("beforeprint", mark);
        if (!fired){
          EXPORT.printed = false;
          EXPORT.ok = false;
          const mod = navigator.platform && /mac|iphone|ipad/i.test(navigator.platform) ? "⌘" : "Ctrl";
          EXPORT.msg = `This browser wouldn't let the page open the print dialog. Press <b>${mod} + P</b> now — `+
            `the report layout is already applied — or download the file below and print that.`;
        } else {
          EXPORT.printed = true;
        }
        render();
        done();
      }, 900);
    }, 150);
  }));
}

      r => [r.zip, r.topLoc, fmtNum(r.clicks), fmtMoney(r.cost), fmtNum(r.conv)], 40],
    ["Placements", D.placements, ["Placement","Impr.","Clicks","Cost"],
      r => [r.placement, fmtNum(r.impressions), fmtNum(r.clicks), fmtMoney(r.cost)], 40]
  ];
  secs.forEach(([name, rows, head, map, limit]) => {
    if (!rows || !rows.length) return;
    L.push(`\n## ${name}`);
    if (rows.length > limit) L.push(`\nTop ${limit} of ${fmtNum(rows.length)} rows.`);
    table(head, rows.slice(0, limit).map(map));
  });

  if (!clientView()) L.push(`\n## Next actions`);
  if (!clientView()) SECTION_LABELS.forEach(([id, label]) => {
    const { lines, edited } = actionsFor(id);
    if (!lines.length) return;
    L.push(`\n### ${label}${edited ? "" : " *(suggested from the figures)*"}`);
    lines.forEach(l => L.push(`- ${l.replace(/<[^>]+>/g, "")}`));
  });
  return L.join("\n") + "\n";
}

const safeName = () => (STATE.settings.client || "report").replace(/[^A-Za-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0,48).toLowerCase();

async function doDownloadReport(){
  if (EXPORT.busy) return;
  EXPORT.busy = true; EXPORT.msg = null; render();
  /* Plain browser download -- works in a normal tab (unlike the sandboxed
     Claude-artifact iframe this code originally targeted, a real page is
     always allowed to trigger its own file download). */
  try {
    const base = `${safeName()}-${(reportPeriod() || "report").replace(/[^A-Za-z0-9]+/g,"-").toLowerCase()}`;
    const html = await inReportLayout(() => reportHTML());
    const blob = new Blob([html], { type: "text/html" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `${base}.html`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    EXPORT.busy = false; EXPORT.ok = true;
    EXPORT.msg = `Saved <b>${esc(base)}.html</b>. Open it in a browser and print from there for a clean PDF.`;
    render();
  } catch(e){
    EXPORT.busy = false; EXPORT.ok = false;
    EXPORT.msg = `Couldn't save the file${e?.message ? ` (${esc(e.message)})` : ""}. Use the print dialog above.`;
    render();
  }
}

/* ---------------------------------------------------------------------
   Ask AI -- a chat panel grounded in the account's own current figures.
   The full account context is rebuilt fresh on every question (cheap --
   it's just text assembled from data already in memory), so the model is
   always answering from what's actually on screen right now, not a stale
   snapshot taken when the panel opened.
   ------------------------------------------------------------------ */
function buildAiContext(){
  if (!hasData()) return "No data has been published to this dashboard yet.";
  if (STATE.data.kind === "generic") return buildGenericAiContext();
  const { S, cur } = derive();
  const parts = [];
  parts.push(`Client: ${S.client || "—"}. Reporting period: ${reportPeriod()}.`);
  parts.push(`Account totals for the period: ${fmtNum(cur.impressions)} impressions, ${fmtNum(cur.clicks)} clicks, `+
    `${fmtPctRaw(cur.ctr,2)} CTR, ${fmtMoney2(cur.cpc)} avg. cost per click, ${fmtNum(cur.conv)} conversions, `+
    `${fmtPctRaw(cur.cvr,1)} conversion rate, ${fmtMoney(cur.cost)} cost, ${fmtMoney2(cur.cpl)} cost per conversion.`);
  parts.push(`Thresholds this account uses: strong cost/conversion at or below ${fmtMoney2(S.strongCPL)}, high at or above ${fmtMoney2(S.highCPL)}.`);
  for (const [id, label] of NAV){
    if (id === "sources") continue;
    let acts = [];
    try { acts = generatedActions(id); } catch(_){ acts = []; }
    if (acts.length) parts.push(`${label} — observations:\n- ${acts.join("\n- ")}`);
  }
  return parts.join("\n\n");
}

/* Context for a generic (auto-detected) workbook -- no fixed metric names to
   lean on, so this just hands over each tab's shape and totals plainly. */
function buildGenericAiContext(){
  const D = STATE.data, S = STATE.settings;
  const sheets = D.generic?.sheets || [];
  const parts = [`Client: ${S.client || "—"}. This dashboard was built from an uploaded spreadsheet that `+
    `isn't the usual Google Ads tracker export, so it was parsed generically: one section per tab.`];
  sheets.forEach(sh => {
    const bits = [`Tab "${sh.name}": ${fmtNum(sh.rowCount)} rows. Columns: ${sh.headers.join(", ")}.`];
    if (sh.kpis.length) bits.push(`Column totals — ${sh.kpis.map(k=>`${k.label}: ${fmtNum1(k.value)}`).join(", ")}.`);
    parts.push(bits.join(" "));
  });
  return parts.join("\n\n");
}

async function doAsk(){
  const q = (ASK.input || "").trim();
  if (!q || ASK.busy) return;
  ASK.messages.push({ role:"user", content:q });
  ASK.input = ""; ASK.busy = true; ASK.error = null;
  render();
  try {
    const res = await fetch("/.netlify/functions/ask", {
      method: "POST",
      headers: { "Content-Type":"application/json", "Authorization": "Bearer " + WRITE_TOKEN },
      body: JSON.stringify({
        question: q,
        context: buildAiContext(),
        history: ASK.messages.slice(-8, -1),
      }),
    });
    if (!res.ok){
      const msg = await res.text().catch(() => "");
      throw new Error(msg || `Couldn't reach the assistant (${res.status}).`);
    }
    const data = await res.json();
    ASK.messages.push({ role:"assistant", content: data.answer || "(no answer returned)" });
  } catch(err){
    ASK.error = err?.message || String(err);
  }
  ASK.busy = false;
  render();
}

/* ---------------- access management ---------------- */
/* Why a failure here has to be loud: a successful publish reloads this view, so
   any success message is wiped a moment after it appears. That means a quiet
   failure and a success look almost identical — you press the button, the page
   moves, and only later does someone discover the account never propagated. So
   success is carried across the reload in sessionStorage, and failure keeps you
   on the panel with an explanation of what to do about it. */
function publishFailureText(code){
  if (code === "conflict") return "Someone else published a new version while this page was open, so this change was refused to avoid overwriting theirs. Reload the dashboard and make the change again.";
  if (code === "not_writer") return "The save request wasn't authorized — check the write token. Nothing was saved, only the local copy in this browser reflects the change.";
  if (code === "too_large") return "The page has grown past what can be published. Clear the data, publish, then upload the workbook again.";
  if (code === "rate_limited") return "Too many publishes in a short time. Wait a minute and try again.";
  return `The server couldn't be reached${code ? ` (${code})` : ""}, so the change exists only in this browser. Check your connection and try again.`;
}

async function republishAuth(users, msgKey, okMsg, notice){
  const pub = await buildPublic(STATE.settings, STATE.data, STATE.history, { users }, ADMIN.brand || PUB.brand, contactFromDraft());
  const okKey = msgKey === "addMsg" ? "addOk" : "chgOk";
  if (notice){ try { sessionStorage.setItem("ortho-notice", JSON.stringify(notice)); } catch(_){} }
  const res = await persist(pub);
  ACCESS.busy = false;
  if (!res.ok){
    try { sessionStorage.removeItem("ortho-notice"); } catch(_){}
    ACCESS[msgKey] = "Not saved. " + publishFailureText(res.code);
    ACCESS[okKey] = false;
  } else {
    ACCESS[msgKey] = okMsg;
    ACCESS[okKey] = true;
  }
  render();
  return res.ok;
}

async function doAddUser(){
  if (ACCESS.busy) return;
  const email = normalizeEmail(ACCESS.newEmail);
  ACCESS.addOk = false;
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ ACCESS.addMsg = "That doesn't look like an email address."; render(); return; }
  if ((PUB.auth.users||[]).some(u => u.email === email)){ ACCESS.addMsg = "There's already an account with that address."; render(); return; }
  const problem = passwordProblem(ACCESS.newPw);
  if (problem){ ACCESS.addMsg = problem; render(); return; }
  ACCESS.busy = true; ACCESS.addMsg = null; render();
  const pw = ACCESS.newPw;
  const user = await makeUser(email, pw, ["admin","viewer","client"].includes(ACCESS.newRole) ? ACCESS.newRole : "client", SESSION.dek);

  /* Prove the record opens with exactly the password typed, before anything is
     published. A record that can't be unlocked is worse than a refusal: the
     person is handed credentials that will never work and nobody knows why. */
  const proof = await unlock(email, pw, { users:[user] });
  if (!proof){
    ACCESS.busy = false; ACCESS.addOk = false;
    ACCESS.addMsg = "Couldn't verify that password against the account it just made, so nothing was saved. Try again — and if it keeps happening, tell your developer.";
    render(); return;
  }

  const users = [...(PUB.auth.users||[]), user];
  const ok = await republishAuth(users, "addMsg",
    `Added ${email}. Send them the password separately from the link.`,
    { kind:"ok", text:`<b>${esc(email)} can now sign in.</b> Their password is <code>${esc(pw)}</code> — send it to them separately from the link, and ask them to change it once they're in.` });
  if (ok){ ACCESS.newEmail = ""; ACCESS.newPw = ""; ACCESS.newRole = "client"; render(); }
}

async function doRemoveUser(email){
  if (ACCESS.busy) return;
  const users = (PUB.auth.users||[]).filter(u => u.email !== normalizeEmail(email));
  if (!users.some(u => u.role === "admin")){
    ACCESS.addMsg = "That's the last administrator — add another before removing this one.";
    ACCESS.addOk = false; render(); return;
  }
  ACCESS.busy = true; render();
  await republishAuth(users, "addMsg", `Removed ${email}.`,
    { kind:"ok", text:`<b>${esc(email)} can no longer sign in.</b> The data was re-sealed and republished.` });
}

/* Answers "why can't they sign in?" without needing the other person. It checks
   the credential against the account list this page is running, and separately
   against the vault, so a working password on a stale page is distinguishable
   from a wrong password. */
async function doCheckAccount(){
  if (ACCESS.checking) return;
  const email = normalizeEmail(ACCESS.chkEmail), pw = ACCESS.chkPw;
  ACCESS.chkMsg = null; ACCESS.chkOk = false;
  if (!email || !pw){ ACCESS.chkMsg = "Enter both an email and a password."; render(); return; }
  ACCESS.checking = true; render();

  const known = (PUB.auth.users || []).find(u => u.email === email);
  if (!known){
    ACCESS.checking = false; ACCESS.chkOk = false;
    ACCESS.chkMsg = `No account for <b>${esc(email)}</b> on this version of the dashboard. `+
      `If you added it and then saw a "not saved" message, the change never reached the shared copy — add it again.`;
    render(); return;
  }
  const res = await unlock(email, pw, PUB.auth);
  ACCESS.checking = false;
  if (!res){
    ACCESS.chkOk = false;
    ACCESS.chkMsg = `The account for <b>${esc(email)}</b> exists, but that password doesn't open it. `+
      `Passwords are case-sensitive and keep any spaces. Set a new one by removing the account and adding it again.`;
    render(); return;
  }
  let vaultOk = true;
  try { if (PUB.vault) await openJSON(PUB.vault, res.dek); } catch(_){ vaultOk = false; }
  ACCESS.chkOk = vaultOk;
  ACCESS.chkMsg = vaultOk
    ? `<b>Works.</b> ${esc(email)} signs in as ${res.user.role === "admin" ? "an administrator" : res.user.role === "client" ? "a client (client version)" : "staff (full dashboard, view only)"} and can read the current figures.`
    : `The password opens the account but not the data, which means the account was made against an older copy. Remove it and add it again.`;
  render();
}

async function doChangePw(){
  if (ACCESS.busy) return;
  ACCESS.chgOk = false;
  const problem = passwordProblem(ACCESS.chg1);
  if (problem){ ACCESS.chgMsg = problem; render(); return; }
  if (ACCESS.chg1 !== ACCESS.chg2){ ACCESS.chgMsg = "The two passwords don't match."; render(); return; }
  ACCESS.busy = true; ACCESS.chgMsg = null; render();
  const me = (PUB.auth.users||[]).find(u => u.email === SESSION.email);
  const fresh = await makeUser(SESSION.email, ACCESS.chg1, me?.role || "admin", SESSION.dek);
  fresh.addedAt = me?.addedAt || fresh.addedAt;
  const users = (PUB.auth.users||[]).map(u => u.email === SESSION.email ? fresh : u);
  const ok = await republishAuth(users, "chgMsg", "Password changed. Use the new one next time you sign in.",
    { kind:"ok", text:`<b>Your password is changed.</b> Use the new one next time you sign in.` });
  if (ok){ ACCESS.chg1 = ""; ACCESS.chg2 = ""; render(); }
}

/* ---------------- workbook ---------------- */
/* Shared by both ingestion paths -- an uploaded file and a fetched Google
   Sheet both end up as an ArrayBuffer by the time this runs, and from here
   the parsing/step-tracking is identical. */
async function ingestWorkbookBuffer(buf, label){
  ADMIN.steps = [{n:1,state:"ok",text:`Fetched <b>${esc(label)}</b> (${(buf.byteLength/1024/1024).toFixed(1)} MB)`},
                 {n:2,state:"run",text:"Reading the workbook…"}];
  render();
  const book = await readWorkbook(buf);
  const nonEmpty = [...book.values()].filter(r => r && r.some(x => x && x.some(c => c !== null && c !== undefined && String(c).trim() !== ""))).length;
  ADMIN.steps[1] = { n:2, state:"ok", text:`Read <b>${book.size} tab${book.size===1?"":"s"}</b>${book.size > nonEmpty ? ` — ${book.size - nonEmpty} empty, ignored` : ""}` };
  ADMIN.steps.push({ n:3, state:"run", text:"Recognising each tab from its columns…" });
  render();
  /* One parser for every workbook: tabs are matched by content, never by name. */
  const data = buildDataset(book, label);
  ADMIN.parsed = data;
  if (data.kind === "generic"){
    const n = data.generic.sheets.length;
    ADMIN.steps[2] = { n:3, state:"ok", text:`No Google Ads report columns found — built a table for each of the <b>${n} tab${n===1?"":"s"}</b>` };
  } else {
    const used = (data.tabs||[]).filter(t => t.status === "primary").length;
    ADMIN.steps[2] = { n:3, state:"ok", text:`Recognised <b>${used} report${used===1?"":"s"}</b> · matched <b>${data.campaigns.length} campaigns</b> to <b>${data.locations.length} locations</b>` };
    if (data.reporting) ADMIN.steps.push({ n:4, state:"ok", text:`Reporting month: <b>${esc(data.reporting.label)}</b>${data.reporting.range ? ` (${esc(data.reporting.range)})` : ""}` });
  }
  ADMIN.steps.push({ n:ADMIN.steps.length + 1, state:"ok", text:"Ready to publish." });
}

async function handleFile(file){
  ADMIN.file = file.name; ADMIN.error = null; ADMIN.parsed = null;
  ADMIN.steps = [{n:1,state:"run",text:"Reading the workbook…"}];
  render();
  try {
    if (!/\.xlsx$/i.test(file.name)) throw new Error("That's not an .xlsx file. Export the tracker as Microsoft Excel (.xlsx) and try again.");
    const buf = await file.arrayBuffer();
    await ingestWorkbookBuffer(buf, file.name);
  } catch(err){
    ADMIN.error = err?.message || String(err);
    ADMIN.steps = ADMIN.steps.map(s => s.state === "run" ? {...s, state:"bad"} : s);
  }
  render();
}

/* Server-side fetch avoids the browser's CORS block on docs.google.com --
   the function proxies the sheet's XLSX export, then this reuses the exact
   same parser as a manual upload. */
async function handleImportUrl(urlArg){
  const raw = String(typeof urlArg === "string" ? urlArg : (ADMIN.importUrl || "")).trim();
  if (!raw || ADMIN.busy) return;
  ADMIN.file = null; ADMIN.error = null; ADMIN.parsed = null;
  ADMIN.steps = [{n:1,state:"run",text:"Fetching the sheet…"}];
  render();
  try {
    const buf = await fetchSheetBuffer(raw);
    ADMIN.file = "Google Sheet";
    await ingestWorkbookBuffer(buf, "Linked Google Sheet");
    ADMIN.parsed.syncedAt = new Date().toISOString();
    /* Publishing saves the link with the settings, which turns on auto-sync. */
    ADMIN.draft = { ...(ADMIN.draft || STATE.settings), sheetUrl: raw };
    ADMIN.importUrl = "";
    ADMIN.steps.splice(ADMIN.steps.length - 1, 0, { n:ADMIN.steps.length, state:"ok",
      text: raw === linkedSheet() ? "Linked sheet re-read." : "Sheet linked — once published, the dashboard keeps itself in step with it." });
    ADMIN.steps.forEach((st,i) => st.n = i + 1);
  } catch(err){
    ADMIN.error = err?.message || String(err);
    ADMIN.steps = ADMIN.steps.map(s => s.state === "run" ? {...s, state:"bad"} : s);
  }
  render();
}

/* Merge the panel's editors into the settings object every publish path uses.
   An empty box means "go back to the generated text", which is stored as absence
   rather than an empty string, so the dashboard has one code path for both. */
const contactFromDraft = () => (ADMIN.contact !== null && ADMIN.contact !== undefined)
  ? String(ADMIN.contact).trim() : (PUB.contact || "");

function settingsFromDraft(){
  const base = { ...STATE.settings, ...(ADMIN.draft || {}) };
  if (ADMIN.summary){
    const text = String(ADMIN.summary.text || "").trim();
    const bullets = String(ADMIN.summary.bullets || "").split(/\n+/).map(s=>s.trim()).filter(Boolean);
    base.summary = (text || bullets.length) ? { text, bullets, forData: dataKey(ADMIN.parsed || STATE.data) } : null;
  }
  if (ADMIN.actions){
    const key = dataKey(ADMIN.parsed || STATE.data);
    const next = (base.actions || {}).__forData === key ? { ...base.actions } : {};
    next.__forData = key;
    Object.entries(ADMIN.actions).forEach(([k,v]) => {
      const t = String(v || "").trim();
      if (t) next[k] = t; else delete next[k];
    });
    base.actions = next;
  }
  if (!(base.highCPL > base.strongCPL)) base.highCPL = base.strongCPL * 2;
  return base;
}

async function doClear(kind){
  if (ADMIN.busy) return;
  ADMIN.busy = true; render();
  const settings = settingsFromDraft();
  const data = kind === "data" ? null : STATE.data;
  const history = [];
  const pub = await buildPublic(settings, data, history, PUB.auth, ADMIN.brand || PUB.brand, contactFromDraft());
  const res = await persist(pub);
  ADMIN.busy = false; ADMIN.confirm = null;
  if (res.ok) STATE = { settings, data, history };
  NOTICE = res.ok
    ? { kind:"ok", text: kind === "data"
        ? `<b>Data cleared.</b> The dashboard is empty for everyone until the next workbook is uploaded.`
        : `<b>Trend history reset.</b> The figures are unchanged; the trend charts start again from your next upload.` }
    : { kind:"warn", text:`<b>Nothing was cleared.</b> ${esc(publishFailureText(res.code))}` };
  try { sessionStorage.setItem("ortho-notice", JSON.stringify(NOTICE)); } catch(_){}
  VIEW = "dashboard"; resetAdmin(); render();
  window.scrollTo({ top:0, behavior:"instant" });
}

/* Push what this browser already holds. Needed after an upgrade, when the accounts
   exist here but the published page doesn't carry them yet. */
async function doRepublish(okText){
  if (ADMIN.busy) return;
  if (typeof okText !== "string") okText = null;
  ADMIN.busy = true; render();
  const settings = settingsFromDraft();
  const pub = await buildPublic(settings, STATE.data, STATE.history, PUB.auth, ADMIN.brand || PUB.brand, contactFromDraft());
  const res = await persist(pub);
  STATE = { ...STATE, settings };
  ADMIN.busy = false;
  const linkedNow = linkedSheet();
  if (res.ok && linkedNow) startAutoSync(); else if (!linkedNow) stopAutoSync();
  NOTICE = res.ok && okText ? { kind:"ok", text: okText } : res.ok
    ? { kind:"ok", text:`<b>Published.</b> The page now carries ${PUB.auth.users.length} account${PUB.auth.users.length===1?"":"s"}`+
        `${hasData()?" and the current figures":""}, so anyone opening the link gets the sign-in screen.` }
    : { kind:"warn", text:`<b>Not published.</b> ${esc(publishFailureText(res.code))}` };
  try { sessionStorage.setItem("ortho-notice", JSON.stringify(NOTICE)); } catch(_){}
  VIEW = "dashboard"; resetAdmin(); render();
  window.scrollTo({ top:0, behavior:"instant" });
}

async function doPublish(){
  if (!ADMIN.parsed || ADMIN.busy) return;
  ADMIN.busy = true; render();
  const at = new Date().toISOString();
  const settings = settingsFromDraft();
  const history = [...STATE.history, snapshotOf(ADMIN.parsed, at)].slice(-24);

  const pub = await buildPublic(settings, ADMIN.parsed, history, PUB.auth, ADMIN.brand || PUB.brand, contactFromDraft());
  const res = await persist(pub);
  STATE = { settings, data: ADMIN.parsed, history };

  ADMIN.busy = false;
  NOTICE = res.ok
    ? { kind:"ok", text:`<b>Published.</b> ${esc(STATE.data.sourceFile)} is now the live data for everyone with an account. `+
        `Snapshot ${history.length} recorded.` +
        `` }
    : { kind:"warn", text:`<b>Saved in this browser only.</b> ${esc(publishFailureText(res.code))}` };
  /* A successful publish reloads this view, so the banner has to survive the trip. */
  try { sessionStorage.setItem("ortho-notice", JSON.stringify(NOTICE)); } catch(_){}
  VIEW = "dashboard";
  resetAdmin();
  render();
  window.scrollTo({ top:0, behavior:"instant" });
  if (linkedSheet()){ stopAutoSync(); SYNC.timer = setInterval(() => {
    if (document.visibilityState === "visible" && VIEW === "dashboard" && syncDue()) syncFromSheet(false); }, SYNC_EVERY_MS); }
  else stopAutoSync();
}

/* ---------------------------------------------------------------------
   8b. Linked Google Sheet — kept in sync automatically

   The sheet link is stored with the settings, inside the encrypted vault. Every
   time someone signs in (and every few minutes while the dashboard stays open)
   the sheet is fetched through the site's fetch-sheet function, run through the
   same parser as an upload, and — if anything changed — saved for everyone.
   A snapshot for the trend charts is only added when the headline totals move.
   ------------------------------------------------------------------ */
/* A sheet to link on a brand-new dashboard. Once an admin links, replaces or
   removes a sheet in the update panel, their choice is what's used. */
const DEFAULT_SHEET_URL = "";
const SYNC_EVERY_MS = 10 * 60 * 1000;
let SYNC = { busy:false, at:null, error:null, timer:null };

function linkedSheet(){
  const v = STATE?.settings?.sheetUrl;
  return String(v === undefined || v === null ? DEFAULT_SHEET_URL : v).trim();
}
const shortSheet = url => { const m = String(url).match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/); return m ? `docs.google.com/…/${m[1].slice(0,10)}…` : url; };

async function fetchSheetBuffer(url){
  if (!/^https:\/\/docs\.google\.com\/spreadsheets\/d\//i.test(url))
    throw new Error("That doesn't look like a Google Sheets link. Copy it from the sheet's Share dialog.");
  const res = await fetch(`/.netlify/functions/fetch-sheet?url=${encodeURIComponent(url)}&t=${Date.now()}`, { cache:"no-store" });
  if (!res.ok){
    const msg = await res.text().catch(() => "");
    throw new Error(msg || `Couldn't fetch the sheet (${res.status}).`);
  }
  return res.arrayBuffer();
}
const fingerprint = d => { if (!d) return ""; const { syncedAt, sourceFile, ...rest } = d; return JSON.stringify(rest); };
const sameTotals = (a, b) => !!(a && b) &&
  ["impressions","clicks","conv","cost","mtdCost"].every(k => Math.abs((a[k]||0) - (b[k]||0)) < 0.005);

function rerender(){
  if (VIEW !== "dashboard" || EXPORT.open || ASK.open) return;
  const y = window.scrollY; render(); window.scrollTo(0, y);
}

async function syncFromSheet(manual){
  const url = linkedSheet();
  if (!url || SYNC.busy || !SESSION || !STATE) return;
  SYNC.busy = true; SYNC.error = null;
  if (manual) rerender();
  let notice = null;
  try {
    const buf = await fetchSheetBuffer(url);
    const book = await readWorkbook(buf);
    const data = buildDataset(book, "Linked Google Sheet");
    const now = new Date().toISOString();
    SYNC.at = now;
    if (fingerprint(data) === fingerprint(STATE.data)){
      if (manual) notice = { kind:"ok", text:`<b>Already up to date.</b> Nothing has changed in the linked Google Sheet since the last sync.` };
      /* Record the check, so a scheduled update isn't repeated until the next 1st / 16th. */
      if (syncMode() === "scheduled" && STATE.data && syncDue()){
        STATE = { ...STATE, data: { ...STATE.data, syncedAt: now } };
        persist(await buildPublic(STATE.settings, STATE.data, STATE.history, PUB.auth, PUB.brand, PUB.contact || "")).catch(() => {});
      }
    } else {
      data.syncedAt = now;
      const snap = snapshotOf(data, now);
      const last = STATE.history[STATE.history.length - 1];
      const history = sameTotals(snap, last) ? STATE.history : [...STATE.history, snap].slice(-24);
      STATE = { ...STATE, data, history };
      const pub = await buildPublic(STATE.settings, data, history, PUB.auth, PUB.brand, PUB.contact || "");
      const res = await persist(pub);
      notice = res.ok
        ? { kind:"ok", text:`<b>Updated from the linked Google Sheet.</b>${data.reporting ? ` Reporting month: ${esc(data.reporting.label)}.` : ""}` }
        : { kind:"warn", text:`<b>Showing the sheet's latest figures on this screen only.</b> They couldn't be saved for everyone: ${esc(publishFailureText(res.code))}` };
    }
  } catch(err){
    SYNC.error = err?.message || String(err);
    if (manual || !hasData()) notice = { kind:"warn", text:`<b>Couldn't sync the Google Sheet.</b> ${esc(SYNC.error)}` };
  }
  SYNC.busy = false;
  if (notice) NOTICE = notice;
  rerender();
}

/* Sync schedule. "scheduled" (the default) refreshes twice a month — at 00:00 US
   Eastern on the 1st and the 16th: the first time anyone opens the dashboard after
   one of those moments, it pulls the sheet and saves the new figures for everyone.
   "open" re-reads the sheet every time the dashboard is opened. Sync sheet always
   works on demand. The figures are encrypted with the users' passwords, so the
   refresh runs in the browser of whoever opens the page next. */
const SYNC_TZ = "America/New_York";
const syncMode = () => (STATE?.settings?.syncMode === "open" ? "open" : "scheduled");
const tzDate = d => { const p = new Intl.DateTimeFormat("en-CA",{ timeZone:SYNC_TZ, year:"numeric", month:"2-digit", day:"2-digit" }).format(d); return p; };
function lastBoundary(now){
  const [y,m,d] = tzDate(now || new Date()).split("-").map(Number);
  return `${y}-${String(m).padStart(2,"0")}-${d >= 16 ? "16" : "01"}`;
}
function nextBoundary(now){
  const [y,m,d] = tzDate(now || new Date()).split("-").map(Number);
  if (d < 16) return `${y}-${String(m).padStart(2,"0")}-16`;
  const n = new Date(Date.UTC(y, m, 1));
  return `${n.getUTCFullYear()}-${String(n.getUTCMonth()+1).padStart(2,"0")}-01`;
}
const fmtBoundary = key => { const d = new Date(key + "T12:00:00Z");
  return `${d.toLocaleDateString("en-US",{ month:"short", day:"numeric", year:"numeric", timeZone:"UTC" })}, 00:00 ET`; };
/* Due when the figures were last pulled before the most recent 1st / 16th. */
function syncDue(){
  if (syncMode() === "open") return true;
  const at = STATE?.data?.syncedAt;
  if (!at) return true;
  return tzDate(new Date(at)) < lastBoundary();
}
function startAutoSync(){
  stopAutoSync();
  if (!linkedSheet()) return;
  if (syncDue()) syncFromSheet(false);
  SYNC.timer = setInterval(() => {
    if (document.visibilityState === "visible" && VIEW === "dashboard" && syncDue()) syncFromSheet(false);
  }, SYNC_EVERY_MS);
}
function stopAutoSync(){ if (SYNC.timer){ clearInterval(SYNC.timer); SYNC.timer = null; } }

/* ---------------------------------------------------------------------
   8c. Change history

   An uploaded Google Ads change-history export (CSV, tab-separated or .xlsx).
   Each change is matched to the dashboard section it concerns — a budget edit
   under Budget pacing, a negative keyword under Keywords & terms, a location
   target under Geography — and shown as a table at the end of that section.
   ------------------------------------------------------------------ */
const CH_ROUTES = [
  ["budget",     /budget/],
  ["timing",     /ad schedul|dayparting|day ?part|hour of day|schedule/],
  ["geo",        /location|geo ?target|radius|proximity|\bzip\b|postal|\bcity\b|county/],
  ["placements", /placement|content exclusion|exclusion list|mobile app categor|website exclusion/],
  ["pmax",       /asset group|performance max|pmax|listing group|audience signal/],
  ["audience",   /\bage\b|gender|demographic|device|household income|parental|audience|bid adjust|bid modifier/],
  ["share",      /impression share/],
  ["terms",      /negative|keyword|search term|match type|responsive search ad|headline|description|final url|\bads?\b|ad text|sitelink|callout|extension|\bassets?\b/]
];
const CH_SECTIONS = [["auto","Each change's own section (automatic)"],["overview","Account overview"],["locations","Location performance"],
  ["campaigns","Campaign performance"],["budget","Budget use"],["share","Impression share"],["pmax","Performance Max"],["audience","Audience"],["timing","Days & hours"],
  ["terms","Keywords & search terms"],["geo","Geography"],["placements","Placements"]];

function routeChange(r){
  const t = [r.type, r.change, r.adGroup].join(" ").toLowerCase();
  for (const [sec, re] of CH_ROUTES) if (re.test(t)) return sec;
  if (/pmax|performance max/i.test(r.campaign)) return "pmax";
  return "overview";
}

/* RFC-4180-ish: quotes, doubled quotes, newlines inside quotes. */
function parseDelimited(text){
  const sample = text.split(/\r?\n/).slice(0, 15).join("\n");
  const count = ch => (sample.match(new RegExp(ch === "\t" ? "\\t" : "\\" + ch, "g")) || []).length;
  const delim = [["\t", count("\t")], [",", count(",")], [";", count(";")]].sort((a,b) => b[1]-a[1])[0][0];
  const rows = []; let row = [], cell = "", q = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (q){
      if (c === '"'){ if (text[i+1] === '"'){ cell += '"'; i++; } else q = false; }
      else cell += c;
    } else if (c === '"' && cell === "") q = true;
    else if (c === delim){ row.push(cell); cell = ""; }
    else if (c === "\n" || c === "\r"){
      if (c === "\r" && text[i+1] === "\n") i++;
      row.push(cell); rows.push(row); row = []; cell = "";
    } else cell += c;
  }
  if (cell !== "" || row.length){ row.push(cell); rows.push(row); }
  return rows;
}

const CH_COLS = [
  ["date",     /^(dateandtime|datetime|date|time|timestamp|changedatetime|changedate|dateandtimeutc|when)/],
  ["user",     /^(user|changedby|email|by|useremail|author)$/],
  ["campaign", /^campaign(name)?$/],
  ["adGroup",  /^adgroup(name)?$/],
  ["type",     /^(item|changetype|type|resource|resourcetype|changeresourcetype|level|operation|tool|clienttype)$/],
  ["change",   /^(changes?|changedescription|description|details|whatchanged|changedfields|newvalue)$/]
];

function buildChangeHistory(rows, fileName){
  rows = (rows || []).map(r => (r || []).map(c => c === null || c === undefined ? "" : c));
  let hi = -1, map = null;
  for (let i = 0; i < Math.min(rows.length, 25) && hi < 0; i++){
    const m = {};
    (rows[i] || []).forEach((c, j) => {
      const n = norm(c);
      for (const [k, re] of CH_COLS) if (m[k] === undefined && re.test(n)){ m[k] = j; break; }
    });
    if (Object.keys(m).length >= 2 && (m.change !== undefined || m.date !== undefined)){ hi = i; map = m; }
  }
  if (hi < 0) throw new Error("No change-history columns found. Export it from Google Ads → Change history → Download (CSV or Excel), with columns such as Date & time, User, Campaign and Changes.");
  const headers = (rows[hi] || []).map(sv);
  const other = headers.map((h,j) => j).filter(j => !Object.values(map).includes(j) && headers[j]);
  const out = [];
  for (const r of rows.slice(hi + 1)){
    if (!r || !r.some(c => sv(c) !== "")) continue;
    if (r.slice(0,3).some(c => /^total\b/i.test(sv(c)))) continue;
    const get = k => map[k] === undefined ? "" : r[map[k]];
    let date = get("date"), ts = 0;
    if (typeof date === "number" && date > 20000 && date < 80000){ const d = serialToDate(date); ts = d.getTime(); date = d.toISOString().slice(0,16).replace("T"," "); }
    else { date = sv(date); ts = Date.parse(date.replace(/\s+(AM|PM)\b/i, " $1")) || (parseDateCell(date)?.start?.getTime() || 0); }
    let change = sv(get("change"));
    if (!change) change = other.map(j => sv(r[j]) ? `${headers[j]}: ${sv(r[j])}` : "").filter(Boolean).join("\n");
    const row = { date, ts, user: sv(get("user")), campaign: cleanCampaign(get("campaign")), adGroup: sv(get("adGroup")),
                  type: sv(get("type")), change: change.slice(0, 1200) };
    if (!row.change && !row.type && !row.campaign) continue;
    row.section = routeChange(row);
    out.push(row);
  }
  if (!out.length) throw new Error("The change-history file has a header row but no changes under it.");
  out.sort((a,b) => (b.ts||0) - (a.ts||0));
  const dated = out.filter(r => r.ts);
  const fmtD = t => new Date(t).toLocaleDateString("en-US",{ month:"short", day:"numeric", year:"numeric" });
  return { fileName, uploadedAt: new Date().toISOString(), rows: out.slice(0, 3000), total: out.length,
           placement: "auto",
           range: dated.length ? `${fmtD(dated[dated.length-1].ts)} – ${fmtD(dated[0].ts)}` : "" };
}

async function readChangeFile(file){
  const buf = await file.arrayBuffer();
  let rows;
  if (/\.xlsx$/i.test(file.name)){
    const book = await readWorkbook(buf);
    rows = [...book.values()].find(r => r && r.some(x => x && x.some(c => sv(c) !== ""))) || [];
  } else {
    const u8 = new Uint8Array(buf);
    let text;
    if (u8[0] === 0xFF && u8[1] === 0xFE) text = new TextDecoder("utf-16le").decode(u8.subarray(2));
    else if (u8[0] === 0xFE && u8[1] === 0xFF) text = new TextDecoder("utf-16be").decode(u8.subarray(2));
    else text = new TextDecoder("utf-8").decode(u8).replace(/^﻿/, "");
    rows = parseDelimited(text);
  }
  return buildChangeHistory(rows, file.name);
}

async function handleChangeFile(file){
  ADMIN.chError = null;
  try {
    if (!/\.(csv|tsv|txt|xlsx)$/i.test(file.name)) throw new Error("Upload the change history as .csv, .tsv or .xlsx.");
    const ch = await readChangeFile(file);
    const prev = (ADMIN.draft || STATE.settings).changeHistory;
    if (prev?.placement) ch.placement = prev.placement;
    ADMIN.draft = { ...(ADMIN.draft || STATE.settings), changeHistory: ch };
    ADMIN.chPending = true;
  } catch(err){ ADMIN.chError = err?.message || String(err); }
  const y = window.scrollY; render(); window.scrollTo(0, y);
}

function changeHistorySection(){
  const ch = (ADMIN.draft || STATE.settings).changeHistory;
  const label = id => (CH_SECTIONS.find(s => s[0] === id) || [id, id])[1];
  let summary = "";
  if (ch?.rows?.length){

    ch.rows.forEach(r => { const s = ch.placement && ch.placement !== "auto" ? ch.placement : r.section; counts[s] = (counts[s]||0) + 1; });
    summary = `<div class="note" style="margin-top:14px;flex-wrap:wrap">${SVG.info}<div style="flex:1;min-width:240px">

        ${ADMIN.chPending ? `<b style="color:var(--accent)">Not published yet.</b>` : `Uploaded ${esc(fmtWhen(ch.uploadedAt))}.`}
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">${Object.entries(counts).sort((a,b)=>b[1]-a[1]).map(([s,n]) => `<span class="pill">${esc(label(s))} · ${n}</span>`).join("")}</div>
      </div></div>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px">
        <label class="flabel" for="chPlace" style="margin:0">Show changes under</label>
        <select id="chPlace" style="padding:8px 10px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:13px;font-family:inherit">
          ${CH_SECTIONS.map(([id,l]) => `<option value="${id}"${(ch.placement||"auto")===id?" selected":""}>${esc(l)}</option>`).join("")}
        </select>
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px">
        <button class="btn" id="chPublish" ${ADMIN.busy?"disabled":""}>${ADMIN.busy ? "Publishing…" : "Publish change history"}</button>
        <button class="btn sec" id="chRemove" style="color:var(--crit)" ${ADMIN.busy?"disabled":""}>Remove change history</button>
      </div>`;
  }
  return `<section>
    <div class="sechead"><h2>Change history</h2>
      <span class="sub">Shown on the dashboard at the end of the section each change relates to</span></div>
    <div class="card">
      <div class="drop" id="chDrop" role="button" tabindex="0" aria-label="Choose or drop the change history file" style="padding:24px 20px">
        ${SVG.up}
        <h3 style="margin-top:8px">${ch?.rows?.length ? "Replace the change history" : "Upload the change history"}</h3>
        <p>Google Ads → Tools → Change history → Download. CSV, tab-separated or .xlsx.</p>
      </div>
      <input type="file" id="chFile" accept=".csv,.tsv,.txt,.xlsx,text/csv" style="display:none">
      ${ADMIN.chError ? `<div class="note" style="margin-top:14px;border-color:var(--crit);color:var(--crit)">${SVG.info}<div>${esc(ADMIN.chError)}</div></div>` : ""}
      ${summary}
    </div>
  </section>`;
}

/* Dashboard side: a table at the end of each section that has changes. */
function changeCard(sec, rows, ch){
  const has = k => rows.some(r => r[k]);
  const cols = [
    { key:"date", label:"Date & time", sortVal:r => r.ts || 0,
      cell:r => `<span style="color:var(--ink2);font-weight:600;white-space:nowrap">${esc(r.date || "—")}</span>` },
    has("user") ? { key:"user", label:"User", cell:r => `<span style="color:var(--ink3);font-weight:400">${esc(r.user)}</span>` } : null,
    has("campaign") ? { key:"campaign", label:"Campaign", cell:r => `<span style="white-space:normal">${esc(r.campaign)}${r.adGroup ? `<br><span class="muted" style="font-weight:400">${esc(r.adGroup)}</span>` : ""}</span>` } : null,
    has("type") ? { key:"type", label:"Item" } : null,
    { key:"change", label:"Change", sort:false,
      cell:r => `<span style="display:block;white-space:pre-line;min-width:240px;max-width:520px;color:var(--ink2);font-weight:400;text-align:left">${esc(r.change.length > 400 ? r.change.slice(0,400) + "…" : r.change)}</span>` }
  ].filter(Boolean);
  return `<div class="card changes" style="margin-top:14px;border-left:3px solid var(--s1)">
    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap">
      <h3>Change history</h3>
      <span class="muted" style="font-size:11px">${fmtNum(rows.length)} change${rows.length===1?"":"s"}${ch.range ? ` · ${esc(ch.range)}` : ""}</span>
    </div>
    <p class="cs">What was changed in the account that bears on this section, newest first.</p>
    ${dataTable("ch-" + sec, cols, rows, { scroll:true, limit:100, defaultSort:{ k:"date", d:"desc" } })}
  </div>`;
}

function insertChangeCards(body){
  const ch = STATE?.settings?.changeHistory;
  if (!ch?.rows?.length) return body;
  const present = [...body.matchAll(/<section id="([^"]+)"/g)].map(m => m[1]).filter(id => id !== "sources");
  if (!present.length) return body;
  const fallback = present.includes("overview") ? "overview" : present[present.length - 1];
  const groups = new Map();
  ch.rows.forEach(r => {
    let sec = ch.placement && ch.placement !== "auto" ? ch.placement : r.section;
    if (!present.includes(sec)) sec = fallback;
    if (!groups.has(sec)) groups.set(sec, []);
    groups.get(sec).push(r);
  });
  for (const [sec, rows] of groups){
    const start = body.indexOf(`<section id="${sec}"`);
    if (start < 0) continue;
    const end = body.indexOf("</section>", start);
    if (end < 0) continue;
    body = body.slice(0, end) + changeCard(sec, rows, ch) + body.slice(end);
  }
  return body;
}

/* ---------------------------------------------------------------------
   9. Boot
   ------------------------------------------------------------------ */
(async () => {
  try { SKIN = localStorage.getItem("ortho-skin") || (matchMedia("(prefers-color-scheme: dark)").matches ? "analytics" : "classic"); }
  catch(_){ SKIN = matchMedia("(prefers-color-scheme: dark)").matches ? "analytics" : "classic"; }

  const loaded = await loadPublic();
  PUB = loaded.state;

  if (!cryptoReady()){ VIEW = "nocrypto"; render(); return; }
  if (!hasAccounts()){
    /* No accounts. Offer setup only when we're sure that's the truth rather than a
       failed read — otherwise a passer-by during a blip is invited to claim the page. */
    VIEW = loaded.certain ? "setup" : "unreachable";
    render(); return;
  }

  try {
    const pending = sessionStorage.getItem("ortho-notice");
    if (pending){ NOTICE = JSON.parse(pending); sessionStorage.removeItem("ortho-notice"); }
  } catch(_){}

  const s = await restoreSession();
  if (s){
    try {
      SESSION = s;
      STATE = await openVault(s.dek);
      VIEW = "dashboard"; render(); startAutoSync(); return;
    } catch(_){ dropSession(); SESSION = null; STATE = null; }
  }
  VIEW = "signin"; render();
})();
</script>
