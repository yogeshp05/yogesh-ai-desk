          : `<p class="cs">Highest first. Vertical rules mark the strong (${fmtMoney2(S.strongCPL)}) and high (${fmtMoney2(S.highCPL)}) thresholds. Locations with no conversions are excluded here and listed in the table below.</p>
        ${hbar(chartRows, { format: v => "$"+v.toFixed(2), labelWidth:132, rowH:23, valueWidth:86, clamp:true,
          aria:"Cost per conversion by clinic location",
          refs:[{at:S.strongCPL,color:"var(--good)",label:"Strong"},{at:S.highCPL,color:"var(--crit)",label:"High"}] })}
        <div class="legend">
          <div><i style="background:var(--good)"></i>${ICON.good} Strong <b>${counts[0].n}</b></div>
          <div><i style="background:var(--warn)"></i>${ICON.warn} On track <b>${counts[1].n}</b></div>
          <div><i style="background:var(--crit)"></i>${ICON.crit} High <b>${counts[2].n}</b></div>
          <div><i style="background:var(--neutral)"></i>${ICON.none} No conversions <b>${counts[3].n}</b></div>
        </div>`}
      </div>
      <div style="display:grid;gap:14px;align-content:start">
        ${client ? "" : `<div class="card"><h3>Budget signal mix</h3>
          <p class="cs">How the ${locs.length} markets split across the thresholds.</p>
          ${donut(sigSlices, { centerValue:String(locs.length), centerLabel:"locations", aria:"Locations by budget signal" })}</div>`}
        <div class="card"><h3>Spend by campaign type</h3>
          <p class="cs">Where the ${fmtMoney(tot.cost)} went.</p>
          ${donut(segSlices, { format: fmtMoney, centerValue:compactMoney(tot.cost), centerLabel:"total", aria:"Spend by campaign type" })}</div>
      </div>
    </div>

    ${mapCard()}

    <div class="card">
      <h3>Every location</h3>
      <p class="cs">Sort on any column. Daily budget is the total of the location's campaign budgets.</p>
      ${dataTable("locations", [
        { key:"name", label:"Location", sortVal:r=>r.name },
        { key:"campaigns", label:"Campaigns", fmt:fmtNum, foot:()=>fmtNum(D.campaigns.length) },
        { key:"impressions", label:"Impr.", fmt:fmtNum, foot:t=>fmtNum(t.impressions) },
        { key:"clicks", label:"Clicks", fmt:fmtNum, foot:t=>fmtNum(t.clicks) },
        { key:"ctr", label:"CTR", fmt:v=>fmtPctRaw(v,2), foot:t=>fmtPctRaw(t.impressions?t.clicks/t.impressions*100:0,2) },
        { key:"cost", label:"Cost", fmt:fmtMoney, foot:t=>fmtMoney(t.cost) },
        { key:"conv", label:"Conv.", fmt:fmtNum, foot:t=>fmtNum(t.conv) },
        { key:"cpl", label:"Cost / conv.", fmt:(v,r)=>r.conv?fmtMoney2(v):"—", foot:t=>fmtMoney2(t.conv?t.cost/t.conv:0) },
        { key:"dailyBudget", label:"Daily budget", fmt:v=>v?fmtMoney(v):"—" },
        ...(client ? [] : [{ key:"sigOrder", label:"Budget signal", align:"left",
          cell:r=>`<span class="tag ${r.sig.cls}" title="${esc(r.sig.full)}">${ICON[r.sig.cls]} ${esc(r.sig.short)}</span>`,
          foot:()=>"" }])
      ], locs.map(l=>({ ...l, sigOrder: SIG_ORDER[l.sig.key], dailyBudget: l.mtdBudget ? l.mtdBudget/30 : 0 })),
        { defaultSort:{k:"cost",d:"desc"}, totals:tot })}
    </div>
      ${actionCard("locations")}
  </section>`;
}

/* Budget use, location by location. Spend is set against what the budgets
   allowed over the same days: the whole reporting month when the sheet holds
   last month's spend, the days so far when it holds month to date. */
function budgetRows(D){
  const days = budgetDays(D);
  const byLoc = new Map();
  (D.pacing || []).forEach(p => {
    let g = byLoc.get(p.location);
    if (!g){ g = { name:p.location, cost:0, daily:0, campaigns:0 }; byLoc.set(p.location,g); }
    g.cost += p.cost; g.daily += p.period === "DAILY" ? p.budget : p.budget/30; g.campaigns++;
  });
  return { days, rows: [...byLoc.values()].map(g => {
    const allowed = g.daily * days;
    const used = allowed ? g.cost / allowed : 0;
    const band = used >= 0.95 ? "full" : used >= 0.75 ? "most" : "under";
    return { ...g, allowed, used, band };
  }).sort((a,b) => b.cost - a.cost) };
}
const BAND = {
  full:  { color:"var(--s1)",  label:"Spending its full budget", short:"Full budget" },
  most:  { color:"var(--good)", label:"Spending most of its budget (75–95%)", short:"Most of budget" },
  under: { color:"var(--warn)", label:"Leaving budget unspent (under 75%)", short:"Under-spending" }
};
function secBudget(){
  const { D, locs } = derive();
  if (!D.pacing?.length) return "";
  const { days, rows } = budgetRows(D);
  const month = D.pacingKind === "month";
  const span = month ? (reportPeriod() || "the month") : `${fmtMonthLong(D.mtd?.month || new Date().toISOString())} so far`;
  const totCost = rows.reduce((s,r)=>s+r.cost,0), totAllowed = rows.reduce((s,r)=>s+r.allowed,0);
  const used = totAllowed ? totCost / totAllowed : 0, gap = totAllowed - totCost;
  const cnt = k => rows.filter(r => r.band === k).length;
  const cplOf = Object.fromEntries(locs.map(l => [l.name, l]));

  return `<section id="budget">
    <div class="sechead"><h2>Budget use</h2>${winChip(["pacing"])}
      <span class="sub">How much of each location's budget was spent in ${esc(span)} · ${days} day${days===1?"":"s"}</span></div>
    <div class="grid g3" style="margin-bottom:14px">
      <div class="kpi"><div class="k">Spent</div><div class="v">${fmtMoney(totCost)}</div><div class="d muted">${esc(span)} · ${rows.length} locations</div></div>
      <div class="kpi"><div class="k">Budget available</div><div class="v">${fmtMoney(totAllowed)}</div><div class="d muted">daily budgets × ${days} days</div></div>
      <div class="kpi hero"><div class="k">Budget used</div><div class="v">${(used*100).toFixed(0)}%</div>
        <div class="d muted">${gap >= 0 ? `${fmtMoney(gap)} of budget went unspent` : `${fmtMoney(-gap)} over the budgets set`}</div></div>
    </div>
    <div class="split">
      <div class="card">
        <h3>Spend against budget, by location</h3>
        <p class="cs">The bar is what was spent; the tick is what the budgets allowed (daily budget × ${days} days). A bar that reaches the tick means the budget — not demand — capped the location.${clientView() ? "" : " Hover for its cost per conversion."}</p>
        ${bullet(rows.map(r => {
          const L0 = cplOf[r.name];
          return { label:r.name, value:r.cost, target:r.allowed, color:BAND[r.band].color,
            right:`${(r.used*100).toFixed(0)}% used`,
            tip:`${r.name}\n${fmtMoney(r.cost)} spent of ${fmtMoney(r.allowed)} available (${fmtMoney(r.daily)}/day)\n${BAND[r.band].label}`+
                (L0 && L0.conv ? `\n${fmtMoney2(L0.cpl)} per conversion${clientView() ? "" : " — " + L0.sig.label}` : "") };
        }), { aria:"Spend against available budget by location" })}
        <div class="legend">
          ${["full","most","under"].map(k => `<div><i style="background:${BAND[k].color}"></i>${esc(BAND[k].label)} <b>${cnt(k)}</b></div>`).join("")}
        </div>
      </div>
      <div class="card"><h3>Campaign budgets</h3>
        <p class="cs">Every campaign budget, with what it spent in ${esc(span)}. Budgets are today's settings, so a budget changed during the month reads approximately.</p>
        ${dataTable("pacing", [
          { key:"campaign", label:"Campaign", cell:r=>`<span class="trunc" style="max-width:220px">${esc(r.campaign)}</span>` },
          { key:"budget", label:"Daily budget", fmt:fmtMoney,
            cell:r=>`${esc(fmtMoney(r.budget))}<span class="muted" style="font-weight:400">/${r.period==="DAILY"?"day":"mo"}</span>`, align:"right" },
          { key:"cost", label:"Spent", fmt:fmtMoney },
          { key:"used", label:"Used", fmt:v=>v ? `${(v*100).toFixed(0)}%` : "—" }
        ], D.pacing.map(p => { const allowed = (p.period === "DAILY" ? p.budget : p.budget/30) * days;
            return { ...p, used: allowed ? p.cost/allowed : 0 }; }), { scroll:true, defaultSort:{k:"cost",d:"desc"} })}
      </div>
    </div>
      ${actionCard("budget")}
  </section>`;
}

/* Google bands the extremes of share metrics: "< 10%" arrives as 9.99% and
   "> 90%" as 90.01%. Show them as the bands they are. */
const isBand = v => Math.abs(v - 0.0999) < 0.00015 || Math.abs(v - 0.9001) < 0.00015;
const fmtIS = v => Math.abs(v - 0.0999) < 0.00015 ? "< 10%" : Math.abs(v - 0.9001) < 0.00015 ? "> 90%" : fmtPct(v, 0);
function secShare(){
  const { D } = derive();
  if (!D.competitive?.length) return "";
  /* Google reports Performance Max impression share for its Search slice only,
     so it isn't comparable — the chart and the average are Search campaigns. */
  const typeOf = new Map((D.campaigns||[]).map(c => [c.campaign, c.type]));
  const isPmax = c => /pmax|performance max/i.test(c.campaign) || /PERFORMANCE_MAX|performance max/i.test(typeOf.get(c.campaign) || "");
  const rows = D.competitive.filter(c => !isPmax(c) && c.impressions > 300 && (c.searchIS > 0 || c.lostBudget > 0 || c.lostRank > 0))
    .sort((a,b)=>b.lostBudget-a.lostBudget).slice(0,16);
  if (!rows.length) return "";
  const bars = rows.map(c => ({
    label: c.campaign.length > 34 ? c.campaign.slice(0,33)+"…" : c.campaign,
    parts: [
      { name:"Won", value:c.searchIS, color:"var(--s1)" },
      { name:"Lost to budget", value:c.lostBudget, color:"var(--warn)" },
      { name:"Lost to ad rank", value:c.lostRank, color:"var(--neutral)" }
    ],
    tip:`${c.campaign}\n${fmtNum(c.impressions)} impressions\nShare won ${fmtIS(c.searchIS)}\nLost to budget ${fmtIS(c.lostBudget)}\nLost to ad rank ${fmtIS(c.lostRank)}`
  }));
  const worstBudget = [...rows].sort((a,b)=>b.lostBudget-a.lostBudget).slice(0,3);
  const avgIS = rows.reduce((s,c)=>s+c.searchIS,0)/rows.length;

  return `<section id="share">
    <div class="sechead"><h2>Impression share</h2>${winChip(["competitive"])}
      <span class="sub">Search campaigns with meaningful volume, most budget-constrained first · the share of available auctions each one actually appeared in</span></div>
    <div class="split">
      <div class="card">
        <h3>Where the auctions went</h3>
        <p class="cs">The full track is every auction the campaign was eligible for. "Lost to budget" is recoverable with money; "lost to ad rank" needs better bids, quality or relevance. Google rounds the extremes into bands — "under 10%" and "over 90%" — so those bars are drawn at the band edge.</p>
        ${stackedBar(bars, { labelWidth:212, domain:1, aria:"Impression share won and lost, by campaign" })}
        <div class="legend">
          <div><i style="background:var(--s1)"></i>Impression share won</div>
          <div><i style="background:var(--warn)"></i>Lost to budget</div>
          <div><i style="background:var(--neutral)"></i>Lost to ad rank</div>
        </div>
      </div>
      <div style="display:grid;gap:14px;align-content:start">
        <div class="kpi"><div class="k">Average share won</div><div class="v">${fmtPct(avgIS,1)}</div>
          <div class="d muted">across the ${rows.length} Search campaigns charted${rows.some(c => isBand(c.searchIS)) ? " · bands counted at their edge" : ""}</div></div>
        <div class="card"><h3>Most constrained by budget</h3>
          <p class="cs">Raising these budgets buys impressions that are already being lost.</p>
          <ul class="bullets">${worstBudget.map(c=>`<li><i style="background:var(--warn)"></i><span><b>${esc(c.campaign)}</b> — losing <b>${fmtIS(c.lostBudget)}</b> of impressions to budget, winning ${fmtIS(c.searchIS)}.</span></li>`).join("")}</ul>
        </div>
      </div>
    </div>
    <div class="card" style="margin-top:14px">
      <h3>Full competitive detail</h3>
      <p class="cs">Top-of-page rates describe where the ad sat when it did show. Performance Max rows cover only its Search slice. Sort on any column.</p>
      ${dataTable("competitive", [
        { key:"campaign", label:"Campaign",
          cell:r=>`<span class="trunc" style="max-width:240px">${esc(r.campaign)}</span>` },
        { key:"kind", label:"Type", cell:r=>`<span class="tag ${r.kind==="Search"?"none":"warn"}">${r.kind}</span>` },
        { key:"impressions", label:"Impr.", fmt:fmtNum },
        { key:"searchIS", label:"Share won", fmt:v=>v?fmtIS(v):"—" },
        { key:"lostBudget", label:"Lost — budget", fmt:v=>v?fmtIS(v):"—" },
        { key:"lostRank", label:"Lost — rank", fmt:v=>v?fmtIS(v):"—" },
        { key:"topPct", label:"Top of page", fmt:v=>v?fmtPct(v,0):"—" },
        { key:"absTopPct", label:"Abs. top", fmt:v=>v?fmtPct(v,0):"—" },
        { key:"clickShare", label:"Click share", fmt:v=>v?fmtIS(v):"—" }
      ], D.competitive.filter(c=>c.impressions>100).map(c => ({ ...c, kind: isPmax(c) ? "PMax" : "Search" })), { scroll:true, defaultSort:{k:"impressions",d:"desc"} })}
    </div>
      ${actionCard("share")}
  </section>`;
}
</script>

<script>
/* Where Performance Max actually spent — the channel split explains a cost per
   conversion that looks too good: Display conversions are cheap and light. */
function pmaxChannelCard(D, tot){
  const ch = (D.pmaxChannels || []).filter(c => c.cost > 0 || c.conv > 0 || c.impressions > 0);
  if (!ch.length) return "";
  const cost = ch.reduce((s,c)=>s+c.cost,0) || 1, conv = ch.reduce((s,c)=>s+c.conv,0);
  const top = ch[0];
  const slices = ch.filter(c => c.cost > 0).map((c,i) => ({ name:c.channel, value:c.cost, color:seriesColor(i) }));
  const displayShare = ch.filter(c => /display/i.test(c.channel)).reduce((s,c)=>s+c.cost,0) / cost;
  return `<div class="split rev" style="margin-bottom:14px">
    <div class="card">
      <h3>Where Performance Max spent</h3>
      <p class="cs">Spend by Google channel${D.pmaxChannelsWindow ? ` · ${esc(D.pmaxChannelsWindow)}` : ""}.</p>
      ${donut(slices, { format: fmtMoney, centerValue: compactMoney(cost), centerLabel:"PMax spend", aria:"Performance Max spend by channel" })}
    </div>
    <div class="card">
      <h3>Channel detail</h3>
      <p class="cs">${displayShare > 0.6
        ? `<b>${fmtPctRaw(displayShare*100,0)} of Performance Max spend went to the Display Network.</b>${clientView() ? "" : " Display conversions are cheap but usually lighter-intent than Search, so judge this cost per conversion against lead quality, not against Search."}`
        : `${esc(top.channel)} took the largest share of spend.`}</p>
      ${dataTable("pmaxch", [
        { key:"channel", label:"Channel" },
        { key:"cost", label:"Spend", fmt:fmtMoney },
        { key:"share", label:"Share", fmt:v=>fmtPctRaw(v*100,1) },
        { key:"conv", label:"Conv.", fmt:fmtNum },
        { key:"cpl", label:"Cost / conv.", fmt:(v,r)=>r.conv?fmtMoney2(v):"—" }
      ], ch.map(c => ({ ...c, share:c.cost/cost, cpl:c.conv ? c.cost/c.conv : null })), { defaultSort:{k:"cost",d:"desc"} })}
    </div>
  </div>`;
}


/* ---------------- Campaign performance ---------------- */
const typeLabel = (t, name) => {
  const x = String(t || "").toUpperCase();
  if (/PERFORMANCE_MAX|PERFORMANCE MAX/.test(x) || /pmax|performance max/i.test(name || "")) return "PMax";
  if (/SEARCH/.test(x)) return "Search";
  if (/DISPLAY/.test(x)) return "Display";
  if (/VIDEO/.test(x)) return "Video";
  if (/DEMAND|DISCOVERY/.test(x)) return "Demand Gen";
  return x ? x.charAt(0) + x.slice(1).toLowerCase().replace(/_/g," ") : "—";
};
function campaignRows(){
  const { D, S } = derive();
  const budget = new Map((D.pacing || []).map(p => [p.campaign, p.period === "DAILY" ? p.budget : p.budget/30]));
  const comp = new Map((D.competitive || []).map(c => [c.campaign, c]));
  return (D.campaigns || []).map(c => {
    const cpl = c.conv ? c.cost / c.conv : 0;
    const k = comp.get(c.campaign);
    return { ...c, kind: typeLabel(c.type, c.campaign), cpl: c.conv ? cpl : null,
      ctr: c.impressions ? c.clicks / c.impressions * 100 : 0, cvr: c.clicks ? c.conv / c.clicks * 100 : 0,
      budget: budget.get(c.campaign) || 0, lostBudget: k ? k.lostBudget : null,
      sig: signal(cpl, c.conv, S.strongCPL, S.highCPL) };
  });
}
/* A tab that stops at a round row count was almost certainly cut off by the export. */
function capNote(n, what){
  if (!n || ![500, 1000, 2000, 5000, 10000].includes(n)) return "";
  const { D } = derive();
  const search = (D.campaigns || []).filter(c => typeLabel(c.type, c.campaign) === "Search").reduce((s,c)=>s+c.cost,0);
  const tab = what === "keyword" ? D.keywordTotals.cost : D.searchTermTotals.cost;
  return ` <b>The sheet holds only the top ${fmtNum(n)} ${what}s</b>${search ? `, covering ${fmtPctRaw(tab/search*100,0)} of Search spend` : ""} — totals here are for those rows.`;
}
function secCampaigns(){
  const { D, S } = derive();
  if (!(D.campaigns || []).length) return "";
  const all = campaignRows();
  const kinds = [...new Set(all.map(r => r.kind))].sort((a,b) => all.filter(r=>r.kind===b).length - all.filter(r=>r.kind===a).length);
  const kind = kinds.includes(UI.ctype) ? UI.ctype : "all";
  const q = (UI.cq || "").toLowerCase();
  const rows = all.filter(r => (kind === "all" || r.kind === kind) && (!q || (r.campaign + " " + r.location).toLowerCase().includes(q)));
  const spenders = rows.filter(r => r.cost > 0);
  const tot = rows.reduce((o,r)=>({ impressions:o.impressions+r.impressions, clicks:o.clicks+r.clicks, conv:o.conv+r.conv, cost:o.cost+r.cost }),
    { impressions:0, clicks:0, conv:0, cost:0 });
  const byKind = kinds.map(k => { const x = all.filter(r => r.kind === k);
    const c = x.reduce((s,r)=>s+r.cost,0), v = x.reduce((s,r)=>s+r.conv,0);
    return { k, n:x.length, cost:c, conv:v }; });
  const top = [...spenders].sort((a,b) => b.cost - a.cost).slice(0, 15);
  const client = clientView();
  const bars = top.map(r => client
    ? { label: r.campaign.length > 34 ? r.campaign.slice(0,33) + "…" : r.campaign, value: r.cost, color: "var(--s1)",
        note: `· ${fmtNum(r.conv)} conv.`,
        tip: `${r.campaign}\n${fmtMoney(r.cost)} · ${fmtNum(r.conv)} conversions${r.conv ? `\n${fmtMoney2(r.cpl)} per conversion` : ""}` }
    : { label: r.campaign.length > 34 ? r.campaign.slice(0,33) + "…" : r.campaign, value: r.cost, color: r.sig.color,
        note: `· ${r.conv ? fmtMoney2(r.cpl) + "/conv." : "no conv."}`,
        tip: `${r.campaign}\n${fmtMoney(r.cost)} · ${fmtNum(r.conv)} conversions\n${r.conv ? fmtMoney2(r.cpl) + " per conversion — " + r.sig.full : "No conversions"}` });
  const idle = all.filter(r => !r.cost && !r.impressions).length;

  return `<section id="campaigns">
    <div class="sechead"><h2>Campaign performance</h2>${winChip(["campaigns"])}
      <span class="sub">${fmtNum(all.length)} campaigns${idle ? ` · ${idle} with no activity` : ""} · every figure from the campaign tab</span></div>
    <div class="grid g4" style="margin-bottom:14px">
      ${byKind.slice(0,4).map(b => `<div class="kpi"><div class="k">${esc(b.k)} campaigns</div><div class="v">${fmtMoney(b.cost)}</div>
        <div class="d muted">${b.n} campaigns · ${fmtNum(b.conv)} conv.${b.conv ? ` · ${fmtMoney2(b.cost/b.conv)} each` : ""}</div></div>`).join("")}
    </div>
    <div class="card" style="margin-bottom:14px">
      <h3>Top ${top.length} campaigns by spend</h3>
      <p class="cs">${client ? `The campaigns that spent the most${reportPeriod() ? ` in ${esc(reportPeriod())}` : ""}, with the conversions each produced.`
        : `Bar length is spend; colour is cost per conversion against the ${fmtMoney2(S.strongCPL)} strong and ${fmtMoney2(S.highCPL)} high thresholds.`}</p>
      ${bars.length ? hbar(bars, { format: compactMoney, labelWidth:230, rowH:24, valueWidth:150, aria:"Spend by campaign" }) : `<p class="muted">No campaign spent in this view.</p>`}
      ${client ? "" : `<div class="legend"><div><i style="background:var(--good)"></i>Strong</div><div><i style="background:var(--warn)"></i>On track</div><div><i style="background:var(--crit)"></i>High</div><div><i style="background:var(--neutral)"></i>No conversions</div></div>`}
    </div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px">
        <div class="tabs" style="margin:0">
          <button data-ctype="all" aria-selected="${kind==="all"}">All (${all.length})</button>
          ${kinds.map(k => `<button data-ctype="${esc(k)}" aria-selected="${kind===k}">${esc(k)} (${all.filter(r=>r.kind===k).length})</button>`).join("")}
        </div>
        <input class="srch" id="cq" placeholder="Filter by campaign or location…" value="${esc(UI.cq || "")}">
      </div>
      ${dataTable("campaigns", [
        { key:"campaign", label:"Campaign", cell:r=>`<span style="white-space:normal">${esc(r.campaign)}</span><br><span class="muted" style="font-weight:400;font-size:11.5px">${esc(r.location)}${r.status ? " · " + esc(r.status) : ""}</span>` },
        { key:"kind", label:"Type", cell:r=>`<span class="tag none">${esc(r.kind)}</span>` },
        { key:"impressions", label:"Impr.", fmt:fmtNum, foot:t=>fmtNum(t.impressions) },
        { key:"clicks", label:"Clicks", fmt:fmtNum, foot:t=>fmtNum(t.clicks) },
        { key:"ctr", label:"CTR", fmt:v=>fmtPctRaw(v,2), foot:t=>fmtPctRaw(t.impressions?t.clicks/t.impressions*100:0,2) },
        { key:"conv", label:"Conv.", fmt:fmtNum, foot:t=>fmtNum(t.conv) },
        { key:"cvr", label:"Conv. rate", fmt:v=>fmtPctRaw(v,1), foot:t=>fmtPctRaw(t.clicks?t.conv/t.clicks*100:0,1) },
        { key:"cost", label:"Spend", fmt:fmtMoney, foot:t=>fmtMoney(t.cost) },
        { key:"cpl", label:"Cost / conv.", fmt:v=>v===null?"—":fmtMoney2(v), foot:t=>t.conv?fmtMoney2(t.cost/t.conv):"—" },
        { key:"budget", label:"Daily budget", fmt:v=>v?fmtMoney(v):"—" },
        { key:"lostBudget", label:"Lost to budget", fmt:(v,r)=>v===null||v===undefined||r.kind==="PMax"?"—":fmtIS(v) },
        ...(client ? [] : [{ key:"sigOrder", label:"Signal", align:"left", cell:r=>`<span class="tag ${r.sig.cls}" title="${esc(r.sig.full)}">${ICON[r.sig.cls]} ${esc(r.sig.label)}</span>`, foot:()=>"" }])
      ], rows.map(r => ({ ...r, sigOrder: SIG_ORDER[r.sig.key] })),
        { scroll:true, limit:150, defaultSort:{k:"cost",d:"desc"}, totals:tot, empty:"No campaigns match this filter." })}
    </div>
      ${actionCard("campaigns")}
  </section>`;
}

/* ---------------- Days & hours ---------------- */
const DOW_NAMES = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const hourName = h => h === 0 ? "12 am" : h < 12 ? `${h} am` : h === 12 ? "12 pm" : `${h-12} pm`;
function timingStats(T, S){
  const withCpl = arr => arr.map(x => ({ ...x, cpl: x.conv ? x.cost / x.conv : null, cvr: x.clicks ? x.conv / x.clicks * 100 : 0 }));
  const hours = withCpl(T.byHour), days = withCpl(T.byDow);
  /* Only judge slots with enough volume to mean something. */
  const minConv = Math.max(5, (hours.reduce((s,h)=>s+h.conv,0) / 24) * 0.25);
  const goodH = hours.filter(h => h.conv >= minConv).sort((a,b) => a.cpl - b.cpl);
  const goodD = days.filter(d => d.conv > 0).sort((a,b) => a.cpl - b.cpl);
  return { hours, days, goodH, goodD };
}
function secTiming(){
  const { D, S } = derive();
  if (!D.timing) return "";
  const scope = UI.tscope === "all" || !D.timing.search ? "all" : "search";
  const T = { ...(scope === "search" ? D.timing.search : D.timing), window: D.timing.window };
  if (!(T.hasHour || T.hasDow)) return "";
  const { hours, days, goodH, goodD } = timingStats(T, S);
  const totConv = hours.reduce((s,h)=>s+h.conv,0) || days.reduce((s,d)=>s+d.conv,0);
  const totCost = hours.reduce((s,h)=>s+h.cost,0) || days.reduce((s,d)=>s+d.cost,0);
  const avgCpl = totConv ? totCost / totConv : 0;
  const best3 = goodH.slice(0,3), worst3 = goodH.slice(-3).reverse();
  /* The busiest 6-hour stretch for conversions. */
  let peak = null;
  if (T.hasHour){ for (let h = 0; h < 24; h++){ const w = [0,1,2,3,4,5].map(i => hours[(h+i)%24]);
    const c = w.reduce((s,x)=>s+x.conv,0); if (!peak || c > peak.conv) peak = { start:h, conv:c }; } }

  /* heat map: conversions by day × hour */
  let heat = "";
  if (T.hasHour && T.hasDow){
    const max = Math.max(1, ...T.grid.flat().map(c => c.conv));
    const order = [1,2,3,4,5,6,0];
    heat = `<div class="card" style="margin-top:14px">
      <h3>Conversions by day and hour</h3>
      <p class="cs">Darker means more conversions in that hour. Hover a cell for its clicks, spend and cost per conversion.</p>
      <div style="overflow-x:auto"><div class="heat" style="grid-template-columns:44px repeat(24,minmax(22px,1fr))">
        <div></div>${Array.from({length:24},(_,h)=>`<div class="hh">${h%3===0 ? hourName(h).replace(" ","") : ""}</div>`).join("")}
        ${order.map(d => `<div class="hd">${DOW_NAMES[d].slice(0,3)}</div>` + T.grid[d].map((c,h) => {
          const a = c.conv / max;
          return `<div class="hc" style="background:color-mix(in srgb,var(--s1) ${Math.round(6 + a*94)}%,var(--card2))" data-tip="${esc(`${DOW_NAMES[d]} ${hourName(h)}\n${fmtNum(c.conv)} conversions · ${fmtNum(c.clicks)} clicks\n${fmtMoney(c.cost)} spent${c.conv ? ` · ${fmtMoney2(c.cost/c.conv)} each` : ""}`)}"></div>`; }).join("")).join("")}
      </div></div>
    </div>`;
  }

  const hourBars = T.hasHour ? vbar(hours.map(h => ({ label: h.hour % 3 === 0 ? hourName(h.hour) : "", value: h.conv,
      color: h.cpl === null ? "var(--neutral)" : h.cpl <= avgCpl * 0.9 ? "var(--good)" : h.cpl >= avgCpl * 1.2 ? "var(--crit)" : "var(--s1)",
      tip: `${hourName(h.hour)}–${hourName((h.hour+1)%24)}\n${fmtNum(h.conv)} conversions · ${fmtNum(h.clicks)} clicks\n${fmtMoney(h.cost)}${h.cpl !== null ? ` · ${fmtMoney2(h.cpl)} per conversion` : ""}` })),
      { aria:"Conversions by hour of day", noValues:true, barWidth:18 }) : "";
  const dayRows = [1,2,3,4,5,6,0].map(d => days[d]);

  return `<section id="timing">
    <div class="sechead"><h2>Days &amp; hours</h2>${winChip(["timing"])}
      <span class="sub">When the ads produced conversions${T.days ? ` · ${T.days} days of data` : ""} · times are the account's time zone</span></div>
    ${D.timing.search ? `<div class="tabs" style="margin-bottom:12px">
      <button data-tscope="search" aria-selected="${scope==="search"}">Search campaigns</button>
      <button data-tscope="all" aria-selected="${scope==="all"}">All campaigns (incl. Performance Max)</button></div>
      <p class="cs" style="margin:-4px 0 12px">${scope === "search" ? "Search only — the campaigns whose bids can be adjusted by hour and day." : "Includes Performance Max, which mostly runs on Display and can shift which hours look busiest and cheapest."}</p>` : ""}
    <div class="grid g3" style="margin-bottom:14px">
      ${best3.length ? `<div class="kpi hero"><div class="k">Best hours</div><div class="v" style="font-size:20px">${best3.map(h => hourName(h.hour)).join(" · ")}</div>
        <div class="d muted">lowest cost per conversion, from ${fmtMoney2(best3[0].cpl)}</div></div>` : ""}
      ${goodD.length ? `<div class="kpi"><div class="k">Best day</div><div class="v" style="font-size:20px">${DOW_NAMES[goodD[0].dow]}</div>
        <div class="d muted">${fmtNum(goodD[0].conv)} conversions at ${fmtMoney2(goodD[0].cpl)} each</div></div>` : ""}
      ${peak ? `<div class="kpi"><div class="k">Busiest 6 hours</div><div class="v" style="font-size:20px">${hourName(peak.start)} – ${hourName((peak.start+6)%24)}</div>
        <div class="d muted">${fmtPctRaw(totConv ? peak.conv/totConv*100 : 0,0)} of all conversions</div></div>` : ""}
    </div>
    <div class="split">
      ${T.hasHour ? `<div class="card">
        <h3>Conversions by hour of day</h3>
        <p class="cs">Bar height is conversions. Green hours convert at least 10% cheaper than the ${fmtMoney2(avgCpl)} average; red hours at least 20% dearer.</p>
        ${hourBars}
        <div class="legend"><div><i style="background:var(--good)"></i>Cheaper than average</div><div><i style="background:var(--s1)"></i>Around average</div><div><i style="background:var(--crit)"></i>Dearer than average</div></div>
      </div>` : ""}
      ${T.hasDow ? `<div class="card">
        <h3>By day of the week</h3>
        <p class="cs">Every ${esc(T.window ? T.window.toLowerCase() : "period")} day added together.</p>
        ${dataTable("dow", [
          { key:"name", label:"Day", sort:false },
          { key:"clicks", label:"Clicks", fmt:fmtNum, sort:false },
          { key:"conv", label:"Conv.", fmt:fmtNum, sort:false },
          { key:"cost", label:"Spend", fmt:fmtMoney, sort:false },
          { key:"cpl", label:"Cost / conv.", sort:false, cell:r => r.cpl === null ? "—" :
            `<span style="color:${r.cpl <= avgCpl*0.9 ? "var(--good)" : r.cpl >= avgCpl*1.2 ? "var(--crit)" : "var(--ink2)"};font-weight:600">${fmtMoney2(r.cpl)}</span>` }
        ], dayRows.map(d => ({ ...d, name: DOW_NAMES[d.dow] })), {})}
      </div>` : ""}
    </div>
    ${heat}
    ${worst3.length && best3.length ? `<div class="note" style="margin-top:14px">${SVG.info}<div>Dearest hours with real volume: <b>${worst3.map(h => `${hourName(h.hour)} (${fmtMoney2(h.cpl)})`).join(", ")}</b>. Cheapest: <b>${best3.map(h => `${hourName(h.hour)} (${fmtMoney2(h.cpl)})`).join(", ")}</b>.</div></div>` : ""}
      ${actionCard("timing")}
  </section>`;
}

function secPmax(){
  const { D, S } = derive();
  if (!D.pmax?.length) return "";
  const rows = [...D.pmax].sort((a,b)=>b.conv-a.conv);
  const tot = rows.reduce((o,r)=>({impressions:o.impressions+r.impressions,clicks:o.clicks+r.clicks,conv:o.conv+r.conv,cost:o.cost+r.cost}),{impressions:0,clicks:0,conv:0,cost:0});
  const bars = rows.map(r => {
    const cpl = r.conv ? r.cost/r.conv : 0;
    if (!clientView()){
      const sg = signal(cpl, r.conv, S.strongCPL, S.highCPL);
      return { label:r.assetGroup || r.campaign, value: cpl, color: sg.color,
        note:`· ${fmtNum(r.conv)} conv.`,
        tip:`${r.campaign}\n${fmtMoney2(cpl)} per conversion — ${sg.full}\n${fmtNum(r.conv)} conv. from ${fmtMoney(r.cost)} · ${fmtNum(r.impressions)} impr.` };
    }
    return { label:r.assetGroup || r.campaign, value: cpl, color: r.conv ? "var(--s1)" : "var(--neutral)",
      note:`· ${fmtNum(r.conv)} conv.`,
      tip:`${r.campaign}\n${r.conv ? fmtMoney2(cpl) + " per conversion" : "No conversions"}\n${fmtNum(r.conv)} conv. from ${fmtMoney(r.cost)} · ${fmtNum(r.impressions)} impr.` };
  }).sort((a,b)=>b.value-a.value);

  return `<section id="pmax">
    <div class="sechead"><h2>Performance Max</h2>${winChip(["pmax"])}
      <span class="sub">${rows.length} asset groups · Google's automated campaigns across Search, Display, YouTube, Maps and Gmail</span></div>
    <div class="grid g4" style="margin-bottom:14px">
      <div class="kpi"><div class="k">Impressions</div><div class="v">${fmtNum(tot.impressions)}</div><div class="d muted">Performance Max only</div></div>
      <div class="kpi"><div class="k">Clicks</div><div class="v">${fmtNum(tot.clicks)}</div><div class="d muted">${fmtPctRaw(tot.impressions?tot.clicks/tot.impressions*100:0,2)} CTR</div></div>
      <div class="kpi"><div class="k">Conversions</div><div class="v">${fmtNum(tot.conv)}</div><div class="d muted">${fmtPctRaw(tot.clicks?tot.conv/tot.clicks*100:0,1)} conversion rate</div></div>
      <div class="kpi hero"><div class="k">Cost per conversion</div><div class="v">${fmtMoney2(tot.conv?tot.cost/tot.conv:0)}</div><div class="d muted">${fmtMoney(tot.cost)} spent</div></div>
    </div>
    ${pmaxChannelCard(D, tot)}
    <div class="grid" style="grid-template-columns:minmax(0,1fr)">
      <div class="card">
        <h3>Cost per conversion by asset group</h3>
        ${clientView()
          ? `<p class="cs">Highest first.</p>
        <div class="note" style="margin:0 0 12px">${SVG.info}<div><b>Each asset group is named after the clinic location it serves</b>, so every row here is one location's Performance Max result — not a location total for the whole account.</div></div>
        ${hbar(bars, { format: v=>"$"+v.toFixed(2), labelWidth:130, rowH:24, valueWidth:130, clamp:true, aria:"Performance Max cost per conversion by asset group" })}`
          : `<p class="cs">Highest first. ${bars.every(b => b.value < S.strongCPL) ? `Every asset group is under the ${fmtMoney2(S.strongCPL)} strong threshold — read alongside the channel split above.` : `Vertical rules mark the ${fmtMoney2(S.strongCPL)} strong and ${fmtMoney2(S.highCPL)} high thresholds.`}</p>
        ${hbar(bars, { format: v=>"$"+v.toFixed(2), labelWidth:130, rowH:24, valueWidth:130, clamp:true, aria:"Performance Max cost per conversion by asset group",
          refs:[{at:S.strongCPL,color:"var(--good)",label:"Strong"},{at:S.highCPL,color:"var(--crit)",label:"High"}] })}`}
      </div>
      <div class="card"><h3>Asset group detail</h3><p class="cs">${clientView() ? "Asset groups carry the name of the location they serve. " : ""}Sort on any column.</p>
        ${dataTable("pmax", [
          { key:"assetGroup", label:"Asset group", cell:r=>esc(r.assetGroup||r.campaign),
            sortVal:r=>r.assetGroup||r.campaign },
          { key:"impressions", label:"Impr.", fmt:fmtNum, foot:t=>fmtNum(t.impressions) },
          { key:"clicks", label:"Clicks", fmt:fmtNum, foot:t=>fmtNum(t.clicks) },
          { key:"conv", label:"Conv.", fmt:fmtNum, foot:t=>fmtNum(t.conv) },
          { key:"cost", label:"Cost", fmt:fmtMoney, foot:t=>fmtMoney(t.cost) },
          { key:"cpl", label:"Cost / conv.", fmt:(v,r)=>r.conv?fmtMoney2(v):"—",
            foot:t=>fmtMoney2(t.conv?t.cost/t.conv:0) }
        ], rows.map(r=>({ ...r, cpl: r.conv ? r.cost/r.conv : null })),
          { defaultSort:{k:"conv",d:"desc"}, totals:tot })}
      </div>
    </div>
      ${actionCard("pmax")}
  </section>`;
}

function secAudience(){
  const { D } = derive();
  if (!D.age?.length && !D.gender?.length) return "";
  const totClicks = D.age.reduce((s,a)=>s+a.clicks,0);
  const ageRows = D.age.map((a,i) => ({
    label:a.label, value:a.clicks, color: a.label==="Unknown" ? "var(--neutral)" : SEQ[Math.min(6,i+1)],
    sub: a.conv ? fmtMoney2(a.cost/a.conv) : "no conv.",
    tip:`${a.label}\n${fmtNum(a.clicks)} clicks · ${fmtNum(a.impressions)} impr.\n${fmtNum(a.conv)} conv. at ${a.conv?fmtMoney2(a.cost/a.conv):"—"} each` }));
  const genderPal = paletteFor(D.gender.map(g=>g.label));
  const devicePal = paletteFor(D.device.map(g=>g.label));
  const slices = (arr, pal) => arr.map(g => ({ name:g.label, value:g.clicks,
    color: g.label==="Unknown" ? "var(--neutral)" : pal.get(g.label) }));

  /* The three side-by-side cards are narrow, so these tables carry the four
     columns that matter and leave impressions to the full-width age table. */
  const dimTable = (id, rows, head, opts = {}) => `<div style="margin-top:12px">${dataTable(id, [
    { key:"label", label:head, sort: opts.ordered !== true },
    ...(opts.impr ? [{ key:"impressions", label:"Impr.", fmt:fmtNum }] : []),
    { key:"clicks", label:"Clicks", fmt:fmtNum },
    { key:"conv", label:"Conv.", fmt:fmtNum1 },
    { key:"cost", label:"Cost", fmt:fmtMoney },
    { key:"cpl", label:"Cost / conv.", fmt:(v,r)=>r.conv?fmtMoney2(v):"—" }
  ], rows.map(r=>({ ...r, cpl: r.conv ? r.cost/r.conv : null })),
    { scroll:opts.scroll, defaultSort:{ k: opts.ordered ? "label" : "clicks", d: opts.ordered ? "asc" : "desc" } })}</div>`;

  const bestAge = [...D.age].filter(a=>a.conv>0&&a.label!=="Unknown").sort((a,b)=>(a.cost/a.conv)-(b.cost/b.conv))[0];

  return `<section id="audience">
    <div class="sechead"><h2>Audience</h2>${winChip(["demographics","age","gender","device"], " · Search only")}
      <span class="sub">Google reports demographics for Search campaigns only, so these totals are smaller than the account figures above</span></div>
    <div class="card" style="margin-bottom:14px">
      <h3>Clicks by age bracket</h3>
      <p class="cs">Bars are clicks; the figure under each bracket is its cost per conversion.${bestAge?` <b>${esc(bestAge.label)}</b> converts most cheaply at ${fmtMoney2(bestAge.cost/bestAge.conv)}.`:""}</p>
      ${vbar(ageRows, { aria:"Clicks by age bracket", height:250 })}
      ${dimTable("age", D.age, "Age bracket", { impr:true, ordered:true })}
    </div>
    <div class="grid g3" style="align-items:start">
      <div class="card"><h3>Gender</h3><p class="cs">Share of ${fmtNum(totClicks)} Search clicks.</p>
        ${donut(slices(D.gender, genderPal), { aria:"Clicks by gender" })}${dimTable("gender", D.gender, "Gender")}</div>
      <div class="card"><h3>Device</h3><p class="cs">Share of ${fmtNum(totClicks)} Search clicks.</p>
        ${donut(slices(D.device, devicePal), { aria:"Clicks by device" })}${dimTable("device", D.device, "Device")}</div>
      <div class="card"><h3>Gender × device</h3>
        <p class="cs">The cross-tab both donuts are drawn from, sorted by clicks.</p>
        ${dimTable("genderDevice", D.genderDevice, "Segment", { scroll:true })}
      </div>
    </div>
      ${actionCard("audience")}
  </section>`;
}

function secTerms(){
  const { D } = derive();
  const q = UI.q.trim().toLowerCase();
  const tabs = [
    { k:"keywords",  label:`Keywords (${fmtNum(D.keywords.length)})` },
    { k:"terms",     label:`Search terms (${fmtNum(D.searchTerms.length)})` },
    { k:"adcopy",    label:`Ad destinations (${fmtNum(D.adCopy.length)})` }
  ];
  const filt = (rows, key) => q ? rows.filter(r => String(r[key]).toLowerCase().includes(q) || String(r.campaign).toLowerCase().includes(q)) : rows;

  const money = { key:"cost", label:"Cost", fmt:fmtMoney };
  const cplCol = { key:"cpl", label:"Cost / conv.", fmt:(v,r)=>r.conv?fmtMoney2(v):"—" };
  const withCpl = rows => rows.map(r => ({ ...r, cpl: r.conv ? r.cost/r.conv : null }));
  const campaignCol = { key:"campaign", label:"Campaign",
    cell:r=>`<span class="trunc" style="max-width:210px;color:var(--ink3);font-weight:400">${esc(r.campaign)}</span>` };

  let body = "", note = "";
  if (UI.tab === "keywords"){
    const rows = filt(D.keywords, "keyword");
    note = `The ${fmtNum(D.keywords.length)} highest-spending keywords, out of ${fmtMoney(D.keywordTotals.cost)} across every keyword in the tab.${capNote(D.keywordRows, "keyword")} Sort on any column.`;
    body = dataTable("keywords", [
      { key:"keyword", label:"Keyword" }, campaignCol,
      { key:"match", label:"Match", align:"right" },
      { key:"impressions", label:"Impr.", fmt:fmtNum },
      { key:"clicks", label:"Clicks", fmt:fmtNum },
      money, { key:"conv", label:"Conv.", fmt:fmtNum }, cplCol
    ], withCpl(rows), { scroll:true, limit:150, defaultSort:{k:"cost",d:"desc"},
      empty:`Nothing matches “${UI.q}”.` });
  } else if (UI.tab === "terms"){
    const rows = filt(D.searchTerms, "term");
    note = `What people actually typed. The ${fmtNum(D.searchTerms.length)} highest-spending terms, out of ${fmtMoney(D.searchTermTotals.cost)} in the tab.${capNote(D.searchTermRows, "search term")} Sort on any column.`;
    body = dataTable("terms", [
      { key:"term", label:"Search term" }, campaignCol,
      { key:"state", label:"Status", align:"right", fmt:v=>v||"—" },
      { key:"impressions", label:"Impr.", fmt:fmtNum },
      { key:"clicks", label:"Clicks", fmt:fmtNum },
      money, { key:"conv", label:"Conv.", fmt:fmtNum }, cplCol
    ], withCpl(rows), { scroll:true, limit:150, defaultSort:{k:"cost",d:"desc"},
      empty:`Nothing matches “${UI.q}”.` });
  } else {
    const rows = filt(D.adCopy, "url");
    note = `The Ad Copy tab reports cost per conversion but no raw conversion count, so the conversions column here is derived as cost ÷ cost-per-conversion and can carry a rounding fraction. Sort on any column.`;
    body = dataTable("adcopy", [
      { key:"url", label:"Landing page",
        cell:r=>`<span class="trunc" style="max-width:300px">${esc((r.url||r.ad).replace(/^https?:\/\/(www\.)?/,""))}</span>`,
        sortVal:r=>(r.url||r.ad) },
      campaignCol,
      { key:"impressions", label:"Impr.", fmt:fmtNum },
      { key:"clicks", label:"Clicks", fmt:fmtNum },
      money, { key:"conv", label:"Conv.", fmt:fmtNum1 }, cplCol
    ], withCpl(rows), { scroll:true, limit:150, defaultSort:{k:"cost",d:"desc"},
      empty:`Nothing matches “${UI.q}”.` });
  }

  return `<section id="terms">
    <div class="sechead"><h2>Keywords &amp; search terms</h2>${winChip(["keywords","searchTerms"])}
      <span class="sub">Keywords are what the account bids on; search terms are what people typed</span></div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:12px">
        <div class="tabs" style="margin:0">${tabs.map(t=>`<button data-tab="${t.k}" aria-selected="${UI.tab===t.k}">${t.label}</button>`).join("")}</div>
        <input class="srch" id="q" type="search" placeholder="Filter by term or campaign…" value="${esc(UI.q)}" aria-label="Filter rows">
      </div>
      <p class="cs">${note}</p>
      ${body}
    </div>
      ${actionCard("terms")}
  </section>`;
}

function secGeo(){

  const bars = top.map(g => ({ label: String(g.zip).length > 24 ? String(g.zip).slice(0,23) + "…" : `${g.zip}`, value:g.cost, color:"var(--s1)",
    note:`· ${esc(g.topLoc)}`,
    tip:`${g.zip} — ${g.topLoc}\n${fmtMoney(g.cost)} · ${fmtNum(g.clicks)} clicks\n${fmtNum(g.conv)} conv. at ${g.conv?fmtMoney2(g.cost/g.conv):"—"} each` }));
  const t = D.geoTotals;
  const win = D.geoWindow || (D.tabs ? "" : "Last 90 days");

    <div class="split">
      <div class="card"><h3>Highest-spend targeted locations</h3>
        <p class="cs">One colour — the bar length is the whole story. The name beside each bar is the nearest clinic targeting it.</p>
        ${hbar(bars, { format: compactMoney, labelWidth:labelW, rowH:24, valueWidth:158, clamp:true, aria:"Spend by targeted ZIP code" })}
      </div>
      <div style="display:grid;gap:14px;align-content:start">
        <div class="grid" style="grid-template-columns:1fr 1fr;gap:14px">
          <div class="kpi"><div class="k">Locations targeted</div><div class="v">${fmtNum(t.zips)}</div><div class="d muted">${esc(win || "reporting window")}</div></div>
          <div class="kpi"><div class="k">Spend</div><div class="v">${fmtMoney(t.cost)}</div><div class="d muted">${fmtNum(t.conv)} conversions</div></div>
        </div>
        <div class="card"><h3>Targeted location detail</h3><p class="cs">Sort on any column.</p>
          ${dataTable("geo", [

              cell:r=>`<span style="color:var(--ink3);font-weight:400">${esc(r.topLoc)}</span>` },
            { key:"clicks", label:"Clicks", fmt:fmtNum },
            { key:"cost", label:"Cost", fmt:fmtMoney },
            { key:"conv", label:"Conv.", fmt:fmtNum },
            { key:"cpl", label:"Cost / conv.", fmt:(v,r)=>r.conv?fmtMoney2(v):"—" }
          ], D.geo.map(g=>({ ...g, cpl: g.conv ? g.cost/g.conv : null })),
            { scroll:true, limit:60, defaultSort:{k:"cost",d:"desc"} })}</div>
    </div>
      ${actionCard("geo")}
  </section>`;

        ${hbar(top, { format: compact, labelWidth:150, rowH:23, valueWidth:70, clamp:true, aria:"Impressions by placement" })}

function secSources(){
  if (clientView()) return "";
  const { D } = derive();
  const linked = linkedSheet();
  const refreshNote = linked
    ? `Figures sync from the linked Google Sheet each time the dashboard is opened, and on <b>Sync sheet</b>.`
    : `Figures are refreshed when a new workbook is uploaded or a Google Sheet is linked — this page does not connect to Google Ads directly.`;
  const unmatched = D.unmatchedCampaigns?.length ? `<div class="note" style="margin-top:14px">${SVG.info}<div><b>${D.unmatchedCampaigns.length} campaign${D.unmatchedCampaigns.length>1?"s":""} could not be matched to a location</b> and sit under "Unassigned": ${esc(D.unmatchedCampaigns.slice(0,6).join(", "))}${D.unmatchedCampaigns.length>6?"…":""}. Naming them "<i>Location</i> - <i>type</i>" fixes this on the next sync.</div></div>` : "";

  /* Saves made before tabs were detected by content only carry pull stamps. */
  if (!D.tabs){
    const stamps = D.tabStamps || {};
    return `<section id="sources">
      <div class="sechead"><h2>Data sources</h2>
        <span class="sub">Every figure above traces to one of these tabs.</span></div>
      <div class="card">
        ${dataTable("sources", [
          { key:"tab", label:"Workbook tab" },
          { key:"pulled", label:"Pulled from Google Ads",
            cell:r=>`<span style="color:var(--ink3);font-weight:400">${esc(fmtWhen(r.pulled))}</span>`, sortVal:r=>r.pulled || "" }
        ], Object.keys(stamps).map(n => ({ tab:n, pulled:stamps[n] })), { defaultSort:{k:"tab",d:"asc"} })}
        ${unmatched}
        <div class="note" style="margin-top:14px">${SVG.info}<div>Source: <b>${esc(D.sourceFile||"—")}</b>. ${refreshNote}</div></div>
      </div></section>`;
  }

  const useOf = t => t.status === "empty" ? "Empty — ignored"
    : t.status === "primary" ? (t.roleLabel || "—") + (t.campaignSource && t.role !== "campaigns" ? " · campaign totals" : "")
    : t.roleLabel && D.tabs.some(x => x.role === t.role && x.status === "primary") ? `${t.roleLabel} · other window`
    : t.roleLabel ? `${t.roleLabel} · shown as a table` : "Shown as a table";
  const rows = D.tabs.map((t,i) => ({ i, tab:t.name, use:useOf(t), window:t.window || "—", rows:t.rows, status:t.status }));
  const used = D.tabs.filter(t => t.status !== "empty").length, empty = D.tabs.length - used;
  return `<section id="sources">
    <div class="sechead"><h2>Data sources</h2>
      <span class="sub">${used} tab${used===1?"":"s"} read${empty ? ` · ${empty} empty tab${empty===1?"":"s"} ignored` : ""}. Tabs are recognised by their columns, so their names can change. Reporting windows differ by tab — that is why totals differ between sections.</span></div>
    <div class="card">
      ${dataTable("sources", [
        { key:"tab", label:"Workbook tab", cell:r=>r.status==="empty" ? `<span class="muted">${esc(r.tab)}</span>` : esc(r.tab) },
        { key:"use", label:"Used for", cell:r=>`<span class="tag ${r.status==="primary"?"good":r.status==="empty"?"none":"warn"}">${esc(r.use)}</span>` },
        { key:"window", label:"Reporting window", cell:r=>r.window==="—" ? `<span class="muted">—</span>` : `<span class="pill">${esc(r.window)}</span>` },
        { key:"rows", label:"Rows", fmt:fmtNum }
      ], rows, { defaultSort:{k:"i",d:"asc"} })}
      ${D.reporting ? `<div class="note" style="margin-top:14px">${SVG.info}<div>Reporting month <b>${esc(D.reporting.label)}</b>${D.reporting.range ? ` (${esc(D.reporting.range)})` : ""} — taken from ${esc(D.reporting.basis)}.</div></div>` : ""}
      ${unmatched}
      <div class="note" style="margin-top:14px">${SVG.info}<div>Source: <b>${esc(D.sourceFile||"—")}</b>. ${refreshNote}</div></div>
    </div>
    </section>`;
}

/* Tabs no section claims (other date windows, household income, campaign
   settings, anything unrecognised) — one switchable table so nothing is lost. */
function secExtras(){
  const sheets = STATE.data.generic?.sheets || [];
  if (STATE.data.kind === "generic" || !sheets.length) return "";
  const i = Math.min(UI.xtab || 0, sheets.length - 1);
  const sh = sheets[i];
  return `<section id="more">
    <div class="sechead"><h2>More from the workbook</h2>
      <span class="sub">${sheets.length} more tab${sheets.length===1?"":"s"} — other date windows and reports no section above covers</span></div>
    <div class="tabs" role="tablist">${sheets.map((x,j) => `<button data-xtab="${j}" aria-selected="${j===i}">${esc(x.name)}</button>`).join("")}</div>
    ${genericBody(sh, "x" + i, true)}
  </section>`;
}
/* ---------------------------------------------------------------------
   Generic sections -- one per tab, for a workbook that doesn't match the
   known tracker shape. KPIs are the column sums, the chart (if any) is
   auto-picked from the column types, and the table shows every row.
   ------------------------------------------------------------------ */
function secGenericAll(){
  const sheets = STATE.data.generic?.sheets || [];
  if (!sheets.length) return `<section id="gen-empty">
    <div class="sechead"><h2>Nothing to show yet</h2>
      <span class="sub">The workbook was read, but no tab had a header row with data underneath it.</span></div>
    </section>`;
  return sheets.map((sh,i) => secGenericSheet(sh,i)).join("");
}
function genericBody(sh, id, compact){
  const kpiRow = sh.kpis.length ? `<div class="grid g4" style="margin-bottom:16px">
    ${sh.kpis.map(k => `<div class="kpi"><div class="k">${esc(k.label)}</div><div class="v">${fmtNum1(k.value)}</div></div>`).join("")}
  </div>` : "";
  const charts = compact ? sh.charts.filter(c => c.type === "bar").slice(0,1) : sh.charts;
  const chartsHTML = charts.map(c => {
    if (c.type === "bar")   return `<div class="card" style="margin-bottom:14px"><h3>${esc(c.title)}</h3>${hbar(c.rows, { aria:c.title })}</div>`;
    if (c.type === "donut") return `<div class="card" style="margin-bottom:14px"><h3>${esc(c.title)}</h3>${donut(c.slices, { aria:c.title })}</div>`;
    if (c.type === "trend") return `<div class="card" style="margin-bottom:14px"><h3>${esc(c.title)}</h3>${trend(c.points, { aria:c.title, color:"var(--s1)" })}</div>`;
    return "";
  }).join("");
  const cols = sh.headers.slice(0,10).map((h,ci) => ({
    key:"c"+ci, label:h, align: sh.types[ci]==="number" ? "right" : "left",
    fmt: sh.types[ci]==="number" ? (v=>fmtNum1(v)) : undefined
  }));
  const tableRows = sh.rows.map(r => { const o={}; cols.forEach((c,ci)=>o[c.key]=r[ci]); return o; });
  const meta = [sh.role, sh.window, `${fmtNum(sh.rowCount)} row${sh.rowCount===1?"":"s"}`].filter(Boolean).join(" · ");
  return `${compact ? `<p class="cs" style="margin:-4px 0 12px">${esc(meta)}</p>` : ""}${kpiRow}${chartsHTML}
    <div class="card">${dataTable(id, cols, tableRows, { limit:150, scroll:true })}</div>`;
}
function secGenericSheet(sh, i){
  const id = `gen-${i}`;
  return `<section id="${id}" data-navlabel="${esc(sh.name)}">
    <div class="sechead"><h2>${esc(sh.name)}</h2>
      <span class="sub">${fmtNum(sh.rowCount)} row${sh.rowCount===1?"":"s"} · auto-detected from the uploaded sheet</span></div>
    ${genericBody(sh, id, false)}
    </section>`;
}
</script>

<script>
/* ---------------------------------------------------------------------
   7. Shell, sign-in, setup, admin
   ------------------------------------------------------------------ */
function header(){
  const D = STATE?.data, S = STATE?.settings;
  const stamp = STATE?.history?.length ? STATE.history[STATE.history.length-1].at : null;
  return `<div class="top"><div class="wrap">
    <div class="topbar">
      <div class="logo">${logoImg("brand")}</div>
      <div class="hactions">
        <div class="skin" role="group" aria-label="Dashboard style">
          <button data-skin-set="classic" aria-pressed="${SKIN==="classic"}">${SVG.grid} Classic</button>
          <button data-skin-set="analytics" aria-pressed="${SKIN==="analytics"}">${SVG.gauge} Analytics</button>
        </div>
        ${hasData() ? `<button class="btn sec" id="doPrint" title="Print or download the report (Ctrl/Cmd + P)">${SVG.print} Export</button>` : ``}
        ${hasData() && !clientView() ? `<button class="btn sec" id="askAiOpen">${SVG.chat} Ask AI</button>` : ``}
        ${!isClient() ? `<button class="btn ghost" id="toggleClient" title="See the dashboard exactly as the client does">${UI.asClient ? "Exit client view" : "Client view"}</button>` : ``}
        ${linkedSheet() ? `<button class="btn sec" id="syncSheet" ${SYNC.busy?"disabled":""} title="${esc(SYNC.at ? "Last checked " + fmtWhen(SYNC.at) : "Fetch the latest figures from the linked Google Sheet")}">${SVG.refresh} ${SYNC.busy ? "Syncing…" : "Sync sheet"}</button>` : ``}
        ${isAdmin() ? `<button class="btn" id="openUpdate">${SVG.refresh} Update data</button>` : ``}
        <button class="btn ghost" id="signOut" title="${esc(SESSION.email)}">${SVG.out} Sign out</button>
      </div>
    </div>
    <div style="margin-top:18px">
      <div class="eyebrow">Paid search performance</div>
      <h1 class="title">${esc(S?.client || "Dashboard")}</h1>
      ${reportPeriod() ? `<div class="period" title="${esc(periodBasis())}">${SVG.cal} ${(S?.period||"").trim() ? "Reporting period" : "Reporting month"} · <b>${esc(reportPeriod())}</b>${!(S?.period||"").trim() && D?.reporting?.range ? `<span style="opacity:.75">(${esc(D.reporting.range)})</span>` : ""}</div>` : ``}
      <div class="meta">
        ${D ? `<span>${esc(dataStampText(D))}</span><span class="dot">·</span>
        <span>${stamp ? `Published ${esc(fmtWhen(stamp))}` : "Not yet published"}</span><span class="dot">·</span>
        <span>${D.kind === "generic" ? `${D.generic.sheets.length} sheet${D.generic.sheets.length===1?"":"s"}` : `${D.locations.length} locations · ${D.campaigns.length} campaigns`}</span><span class="dot">·</span>` : ``}
        <span>Signed in as ${esc(SESSION.email)}${SESSION.role === "viewer" ? " · staff" : ""}${UI.asClient && !isClient() ? " · previewing the client view" : ""}</span>
      </div>
    </div>
  </div></div>`;
}

/* Only link sections the current workbook actually produced — a slimmer upload
   drops whole sections, and a nav item pointing at nothing is worse than none. */
function nav(bodyHTML){
  const fixed = NAV.filter(([id]) => bodyHTML.includes(`<section id="${id}"`));
  /* Generic (auto-detected) sheet sections carry their nav label right on the
     section tag, since there's no fixed NAV entry for a sheet whose name was
     never known in advance. */
  const generic = [...bodyHTML.matchAll(/<section id="(gen-[^"]+)" data-navlabel="([^"]*)"/g)]
    .map(m => [m[1], m[2].replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/&gt;/g,">")]);
  const items = [...fixed, ...generic];
  if (items.length < 2) return "";
  return `<div class="nav"><div class="wrap"><ul>${
    items.map(([id,label]) => `<li><a href="#${id}" data-nav="${id}">${esc(label)}</a></li>`).join("")
  }</ul></div></div>`;
}

function noticeBar(){
  if (!NOTICE) return "";
  const warn = NOTICE.kind === "warn";
  return `<div class="note anim" style="margin-bottom:18px;border-color:${warn?"var(--warn)":"var(--good)"};`+
    `background:${warn?"var(--warnBg)":"var(--goodBg)"};color:var(--ink)">${SVG.info}<div>${NOTICE.text}</div></div>`;
}

function emptyDashboard(){
  return header() + `<main><div class="wrap" style="max-width:660px">
    ${noticeBar()}
    <div class="card" style="text-align:center;padding:46px 26px">
      <div style="color:var(--ink3);margin-bottom:12px">${SVG.up}</div>
      <h2 style="font-size:18px;margin-bottom:8px">No workbook published yet</h2>
      <p class="muted" style="font-size:13.5px;max-width:420px;margin:0 auto 18px">
        ${isAdmin()
          ? "Open the update panel and link the Google Sheet (or upload an .xlsx). Every section of the dashboard is built from it, whatever its tabs are called."
          : "Nothing has been published to this dashboard yet. Whoever manages it will need to upload the tracker workbook first."}</p>
      ${isAdmin() ? `<button class="btn" id="openUpdate" style="margin:0 auto">${SVG.refresh} Upload a workbook</button>` : ``}
    </div>
  </div></main>`;
}

function dashboard(){
  if (!hasData()) return emptyDashboard();
  let body = STATE.data.kind === "generic"
    ? secGenericAll() + secSources()
    : secOverview()+secLocations()+secCampaigns()+secBudget()+secShare()+secPmax()
    + secAudience()+secTiming()+secTerms()+secGeo()+secPlacements()+secExtras()+secSources();
  body = insertChangeCards(body);
  return header() + nav(body) + `<main><div class="wrap">
    <div class="printhead">
      <div>
        <img class="ph-logo" src="${LOGO.dark}" alt="${esc(PUB.brand.name)}">
        <div class="ph-client">${esc(STATE.settings.client)}</div>
      </div>
      <div class="ph-meta">
        ${reportPeriod() ? `<div><b>${esc(reportPeriod())}</b></div>` : ""}
        <div>${esc(dataStampText(STATE.data))}</div>
      </div>
    </div>
    ${noticeBar()}${body}
    <div class="footer">
      Prepared by ${esc(PUB.brand.name)}${PUB.brand.sub?" "+esc(PUB.brand.sub):""} for ${esc(STATE.settings.client)}.<br>
      ${linkedSheet() ? (syncMode() === "open" ? "Kept in step with the linked Google Sheet — it is re-read each time this page opens." : "Updated from the linked Google Sheet on the 1st and 16th of each month.") : "Refreshed by uploading the tracker workbook — this page holds no live connection to Google Ads."}
    </div>
  </div></main>`;
}

/* ---------------- sign-in ---------------- */
function authShell(inner, wide){
  return `<div class="center anim"><div class="gate" style="${wide?"max-width:440px":""}">
    <div class="auth-logo">${logoImg()}</div>
    ${inner}
  </div></div>`;
}

function launchTabs(){
  return `<div class="tabs" style="justify-content:center;margin-bottom:20px">
    <button data-launch="signin" aria-selected="${AUTH.mode !== "request"}">Sign in</button>
    <button data-launch="request" aria-selected="${AUTH.mode === "request"}">Request access</button>
  </div>`;
}

/* The page has no server and a person without an account cannot write to it, so a
   request cannot be queued here. It opens a pre-written email to the administrator
   instead — and the wording promises only what that actually does. */
function requestView(){
  const to = (PUB.contact || "").trim();
  return authShell(`
    ${launchTabs()}
    <h2 style="font-size:18px">Request access</h2>
    <p class="muted" style="font-size:13px;margin:6px 0 20px">
      Accounts are created by the administrator. Send your details and they'll set one up.</p>
    <div class="${AUTH.err?"shake":""}" style="text-align:left">
      <label class="flabel" for="r-name">Your name</label>
      <input id="r-name" data-req="name" value="${esc(AUTH.reqName||"")}" placeholder="Jane Okafor">
      <label class="flabel" for="r-email" style="margin-top:12px">Email</label>
      <input id="r-email" data-req="email" type="email" inputmode="email" value="${esc(AUTH.reqEmail||"")}" placeholder="you@company.com">
      <label class="flabel" for="r-org" style="margin-top:12px">Company or role <span style="font-weight:400;text-transform:none;letter-spacing:0">(optional)</span></label>
      <input id="r-org" data-req="org" value="${esc(AUTH.reqOrg||"")}" placeholder="Marketing lead, OrthoAtlanta">
    </div>
    ${AUTH.err ? `<div class="err">${SVG.info} ${esc(AUTH.err)}</div>` : ""}
    <button class="btn" id="doRequest" style="width:100%;justify-content:center;margin-top:16px">
      ${to ? "Send request" : "Continue"}</button>
    <p class="muted" style="font-size:11.5px;margin-top:16px;line-height:1.6">
      ${to ? "This opens your email app with the request written out, addressed to the account manager."
           : "No contact address has been set on this dashboard yet, so you'll be shown the details to send on yourself."}</p>`);
}

function requestSentDialog(){
  const to = (PUB.contact || "").trim();
  const body = AUTH.sentBody || "";
  return `<div class="modal-wrap" role="dialog" aria-modal="true" aria-labelledby="sent-h">
    <div class="modal anim">
      <div class="ic" style="background:var(--good);color:#fff">✓</div>
      <h2 id="sent-h" style="font-size:18px;margin-top:14px">Request sent</h2>
      <p style="font-size:13.5px;line-height:1.65;color:var(--ink2);margin:10px 0 0">
        Thanks${AUTH.sentName ? `, ${esc(AUTH.sentName)}` : ""}. Your request has gone to the account manager
        for approval. Once they've approved you they'll email <b>${esc(AUTH.sentEmail)}</b> with your
        sign-in details — accounts are created by hand, so it won't be instant.</p>
      ${to ? `<p class="muted" style="font-size:12px;margin-top:12px;line-height:1.6">
        If your email app didn't open, send the details below to <b>${esc(to)}</b> yourself.</p>
        <pre class="reqblock">${esc(body)}</pre>
        <button class="btn sec" id="copyReq" style="width:100%;justify-content:center;margin-top:10px">${ADMIN.copied ? "Copied" : "Copy the request"}</button>`
      : `<p class="muted" style="font-size:12px;margin-top:12px;line-height:1.6">
        This dashboard has no contact address set, so send these details to whoever sent you the link.</p>
        <pre class="reqblock">${esc(body)}</pre>
        <button class="btn sec" id="copyReq" style="width:100%;justify-content:center;margin-top:10px">${ADMIN.copied ? "Copied" : "Copy the request"}</button>`}
      <button class="btn" id="closeSent" style="width:100%;justify-content:center;margin-top:10px">Back to sign in</button>
    </div>
  </div>`;
}

function signInView(){
  const wait = lockoutRemaining();
  return authShell(`
    ${launchTabs()}
    <h2 style="font-size:18px">Client dashboard</h2>
    <p class="muted" style="font-size:13px;margin:6px 0 20px">Sign in to view the reporting.</p>
    <div class="${AUTH.err?"shake":""}" style="text-align:left">
      <label class="flabel" for="email">Email</label>
      <input id="email" type="email" autocomplete="username" inputmode="email" value="${esc(AUTH.email)}" placeholder="you@agency.com">
      <label class="flabel" for="pw" style="margin-top:12px">Password</label>
      <input id="pw" type="password" autocomplete="current-password" placeholder="••••••••••">
    </div>
    ${AUTH.err ? `<div class="err">${SVG.info} ${esc(AUTH.err)}</div>` : ""}
    ${wait ? `<div class="err" style="color:var(--warn)">${SVG.info} Too many attempts — wait ${wait}s.</div>` : ""}

    <p class="muted" style="font-size:11.5px;margin-top:16px;line-height:1.6">
      The figures on this dashboard are encrypted. A correct password is what decrypts them —
      there is nothing readable here without one.</p>`);
}

function setupView(){
  return authShell(`
    <div class="ic">${SVG.lock}</div>
    <h2 style="font-size:18px">Set up this dashboard</h2>
    <p class="muted" style="font-size:13px;margin:6px 0 20px">Create the first account. It becomes the administrator.</p>
    <div class="${AUTH.err?"shake":""}" style="text-align:left">
      <label class="flabel" for="email">Email</label>
      <input id="email" type="email" autocomplete="username" inputmode="email" value="${esc(AUTH.email)}" placeholder="you@agency.com">
      <label class="flabel" for="pw1" style="margin-top:12px">Password</label>

      ${meterHTML(AUTH.pw1)}

      ${AUTH.busy ? "Creating…" : "Create account"}</button>
    <div class="note" style="margin-top:18px;text-align:left;font-size:11.5px">${SVG.info}<div>
      This password encrypts the dashboard's data — it isn't stored anywhere, and it can't be reset.

}

function unreachableView(){
  return authShell(`
    <div class="ic">${SVG.info}</div>
    <h2 style="font-size:18px">Couldn't load this dashboard</h2>
    <p class="muted" style="font-size:13px;margin:8px 0 0;line-height:1.6">

    <p class="muted" style="font-size:11.5px;margin-top:14px;line-height:1.6">
      If it keeps happening, check you're opening the current link — and whoever set the dashboard up
      can confirm it's still published.</p>`);
}

function noCryptoView(){
  return authShell(`
    <div class="ic">${SVG.info}</div>
    <h2 style="font-size:18px">This browser can't open the dashboard</h2>
    <p class="muted" style="font-size:13px;margin:8px 0 0;line-height:1.6">
      The data is encrypted, which needs the Web Crypto API over a secure connection.
      Open this link over https in a current browser — Chrome, Edge, Firefox or Safari.</p>`);
}

/* ---------------- admin ---------------- */
function admin(){
  const S = ADMIN.draft || STATE.settings;
  const p = ADMIN.parsed;
  const steps = ADMIN.steps.map(st =>
    `<div class="step ${st.state}"><span class="n">${st.state==="ok"?"✓":st.state==="bad"?"!":st.n}</span><span>${st.text}</span></div>`).join("");

  let preview = "";
  if (p && p.kind === "generic"){
    const n = p.generic.sheets.length, rows = p.generic.sheets.reduce((s,sh)=>s+sh.rowCount,0);
    preview = `<div class="grid g4" style="margin-top:16px">
      <div class="kpi"><div class="k">Tabs found</div><div class="v">${n}</div><div class="d muted">with usable data</div></div>
      <div class="kpi hero" style="grid-column:span 3"><div class="k">Sheets</div><div class="d" style="font-weight:600">${esc(p.generic.sheets.map(s=>s.name).join(", "))}</div></div>
    </div>
    <div class="note" style="margin-top:14px">${SVG.info}<div>This workbook doesn't match the usual tracker shape, so a generic dashboard was built instead — ${fmtNum(rows)} rows across ${n} tab${n===1?"":"s"}, with one section per tab, an auto-detected chart, and a sortable table. Nothing is published until you press the button below.</div></div>`;
  } else if (p){
    const a = p.account;
    preview = `<div class="grid g4" style="margin-top:16px">
      <div class="kpi"><div class="k">Locations</div><div class="v">${p.locations.length}</div><div class="d muted">${p.campaigns.length} campaigns</div></div>
      <div class="kpi"><div class="k">Clicks</div><div class="v">${fmtNum(a.clicks)}</div><div class="d muted">${fmtNum(a.impressions)} impressions</div></div>
      <div class="kpi"><div class="k">Conversions</div><div class="v">${fmtNum(a.conv)}</div><div class="d muted">${fmtMoney(a.cost)} spent</div></div>
      <div class="kpi hero"><div class="k">Cost per conversion</div><div class="v">${fmtMoney2(a.conv?a.cost/a.conv:0)}</div><div class="d muted">blended</div></div>
    </div>
    <div class="note" style="margin-top:14px">${SVG.info}<div>Read ${(p.tabs||[]).filter(t=>t.status!=="empty").length} tab${(p.tabs||[]).filter(t=>t.status!=="empty").length===1?"":"s"}${(p.tabs||[]).some(t=>t.status==="empty") ? ` (${p.tabs.filter(t=>t.status==="empty").length} empty, ignored)` : ""}. ${p.reporting ? `Reporting month <b>${esc(p.reporting.label)}</b>, from ${esc(p.reporting.basis)}. ` : ""}${p.unmatchedCampaigns.length? `<b>${p.unmatchedCampaigns.length} campaign(s)</b> didn't match a clinic name and will appear as "Unassigned": ${esc(p.unmatchedCampaigns.slice(0,4).join(", "))}.` : "Every campaign matched a clinic location."} Nothing is published until you press the button below.</div></div>`;
  }
  if (p && ADMIN.file !== "Google Sheet" && linkedSheet() && !(ADMIN.draft && ADMIN.draft.sheetUrl === ""))
    preview += `<div class="note" style="margin-top:12px;border-color:var(--warn);background:var(--warnBg)">${SVG.info}<div>A Google Sheet is linked, so its figures will replace this upload the next time the dashboard syncs. Remove the link below if this upload should stay.</div></div>`;

  return `<div class="top"><div class="wrap"><div class="topbar">
      <div class="logo" style="color:var(--onBrand)">${logoImg("brand")}
        <div class="logo-div"><b>Update panel</b><span>${esc(STATE.settings.client)}</span></div></div>
      <div class="hactions">
        <button class="btn ghost" id="cancelAdmin">${SVG.back} Back to dashboard</button>
        <button class="btn" id="publish" ${ADMIN.busy?"disabled":""}>${ADMIN.busy?"Publishing…":(p?"Publish to dashboard":"Publish changes")}</button>
      </div></div></div></div>
    <main class="anim"><div class="wrap" style="max-width:880px">
      <section>
        <div class="sechead"><h2>Data source</h2>
          <span class="sub">Link the Google Sheet (it then updates itself) or upload an .xlsx — tab names don't matter</span></div>
        <div class="card">
          <div class="drop" id="drop" role="button" tabindex="0" aria-label="Choose or drop the tracker .xlsx file">
            ${SVG.up}
            <h3 style="margin-top:10px">Drop the .xlsx here, or click to choose</h3>
            <p>Any Google Ads workbook — every non-empty tab is read and recognised by its columns.</p>
            ${ADMIN.file && ADMIN.file !== "Google Sheet" ? `<div class="fn"><b>${esc(ADMIN.file)}</b></div>`:""}
          </div>
          <input type="file" id="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" style="display:none">
          ${sheetLinkCard()}
          ${steps?`<div class="steps">${steps}</div>`:""}
          ${ADMIN.error?`<div class="note" style="margin-top:14px;border-color:var(--crit);color:var(--crit)">${SVG.info}<div>${esc(ADMIN.error)}</div></div>`:""}
          ${preview}
        </div>
        ${requirementsCard()}
      </section>

      ${changeHistorySection()}

      ${contentSection()}

      ${clearSection()}

      ${accessSection()}

      <section>
        <div class="sechead"><h2>Dashboard settings</h2><span class="sub">Saved with the next publish</span></div>
        <div class="card"><div class="fields">
          <div><label for="f-brand">Agency name</label><input id="f-brand" data-brand="name" value="${esc(PUB.brand.name)}"></div>
          <div><label for="f-sub">Agency subtitle</label><input id="f-sub" data-brand="sub" value="${esc(PUB.brand.sub)}"></div>

          <div><label for="f-managed">Managing the account since</label><input id="f-managed" data-set="managedSince" type="month" value="${esc(S.managedSince || "")}"></div>
          <div><label for="f-strong">Strong cost / conv. at or below ($)</label><input id="f-strong" data-set="strongCPL" type="number" step="0.01" value="${S.strongCPL}"></div>
          <div><label for="f-high">High cost / conv. at or above ($)</label><input id="f-high" data-set="highCPL" type="number" step="0.01" value="${S.highCPL}"></div>
        </div>
        <div class="note" style="margin-top:14px">${SVG.info}<div>The agency name and subtitle appear on the sign-in screen, so they stay outside the encrypted part. Everything else here is sealed with the data. The strong / high cost-per-conversion thresholds colour the charts for administrators and staff; client accounts never see them.</div></div>
        </div>
      </section>

      <section>
        <div class="card">
          <h3>How publishing works</h3>
          <p class="cs">${PUBLISH_MODE === "shared"
            ? "Published data is saved into this artifact, so everyone with an account sees the same figures."
            : "Publishing saves into this artifact so every account sees the update. If this view can't write to it, the data stays in this browser only and the dashboard will say so."}</p>
          <ul class="bullets">
            <li><i style="background:var(--s1)"></i><span>Publishing replaces every section with the uploaded workbook's data, encrypted with the key your password unlocks.</span></li>
            <li><i style="background:var(--s3)"></i><span>A snapshot of the headline totals is kept each time — that's what the trend charts and "vs last upload" figures are drawn from. ${STATE.history.length} snapshot${STATE.history.length===1?"":"s"} so far.</span></li>
            <li><i style="background:var(--s2)"></i><span>Each publish rewrites the whole page with the accounts and sealed data inside it, so nothing depends on a second file loading. It takes a few seconds and reloads this view.</span></li>
          </ul>
          <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:14px">
            <button class="btn sec" id="republish" ${ADMIN.busy?"disabled":""}>${ADMIN.busy?"Publishing…":"Publish current state"}</button>
            <span class="muted" style="font-size:12px">Pushes the accounts and data you already have, without uploading anything.</span>
          </div>
        </div>
      </section>
    </div></main>`;
}

/* What the parser recognises. Tabs are identified by their columns, so the
   names below are only what each kind of report usually contains. */
const WORKBOOK_SPEC = [
  { role:"account",      gives:"The headline KPI tiles and the reporting month", cols:"Account (and a Date / Month column, if any), Impr., Clicks, Conversions, Cost — no Campaign column" },
  { role:"campaigns",    gives:"Locations and the campaign rollup", cols:"Campaign, Impr., Clicks, Conversions, Cost (status/type optional). Without one, campaign totals are summed from the largest campaign-level tab" },
  { role:"monthly",      gives:"Month-by-month trends and the vs-last-month comparison", cols:"Month or Date, Clicks, Conversions, Cost (Impr. or CTR) — several rows" },
  { role:"pacing",       gives:"Budget pacing", cols:"Campaign, Budget, Cost (Budget period optional)" },
  { role:"settings",     gives:"Campaign status and type", cols:"Campaign, Budget — no performance columns" },
  { role:"competitive",  gives:"Impression share", cols:"Campaign, Search impr. share / Click share / Search lost IS (budget, rank)" },
  { role:"pmax",         gives:"Performance Max", cols:"Asset group, Campaign, Cost, Conversions" },
  { role:"keywords",     gives:"The keywords table", cols:"Keyword / Search keyword, Match type, Campaign, Cost" },

  { role:"adCopy",       gives:"Ad destinations", cols:"Final URL (or Ad / Headline 1), Campaign, Cost" },
  { role:"demographics", gives:"Gender and device splits", cols:"Gender and/or Device, or a Segment column of Male / Female" },
  { role:"age",          gives:"The age chart", cols:"Age, or a Segment column of age ranges" },
  { role:"geo",          gives:"Geography", cols:"Location / Targeted location / ZIP, Cost" },
  { role:"placements",   gives:"Placements", cols:"Placement, Impr., Cost" },
