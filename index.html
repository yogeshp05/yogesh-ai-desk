<style>
:root{
  --font: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --page:#F4F6F9; --card:#FFFFFF; --card2:#FAFBFC; --line:#E4E8EE; --line2:#EDF0F4;
  --ink:#101828; --ink2:#4B5565; --ink3:#7D8899;
  --brand:#16284A; --brand2:#0E1D38; --accent:#B8860B; --accentBg:#FBF3E2; --onBrand:#FFFFFF;
  --grid:#E9ECF1; --axis:#CFD6E0;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b; --neutral:#98A2B3;
  --goodBg:#E7F6E7; --warnBg:#FEF4E0; --critBg:#FBEAEA; --neutralBg:#EFF1F4;
  --seq1:#cde2fb; --seq2:#9ec5f4; --seq3:#6da7ec; --seq4:#3987e5; --seq5:#256abf; --seq6:#184f95; --seq7:#0d366b;
  --shadow:0 1px 2px rgba(16,24,40,.05), 0 1px 3px rgba(16,24,40,.06);
  --radius:14px;
}
[data-skin="analytics"]{
  --page:#0B1014; --card:#141B20; --card2:#101015; --line:#242E36; --line2:#1D262C;
  --ink:#E9EFF3; --ink2:#9FB0BC; --ink3:#75868F;
  --brand:#0F161B; --brand2:#0B1014; --accent:#E3A73B; --accentBg:#241D0F; --onBrand:#E9EFF3;
  --grid:#1E272E; --axis:#2C3841;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b; --neutral:#64748B;
  --goodBg:rgba(12,163,12,.14); --warnBg:rgba(250,178,25,.14); --critBg:rgba(208,59,59,.16); --neutralBg:rgba(255,255,255,.06);
  --seq1:#0d366b; --seq2:#184f95; --seq3:#256abf; --seq4:#3987e5; --seq5:#6da7ec; --seq6:#9ec5f4; --seq7:#cde2fb;
  --shadow:none;
}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
#app{background:var(--page);color:var(--ink);min-height:100vh}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.01em}
a{color:inherit}
button{font-family:inherit}
.wrap{max-width:1320px;margin:0 auto;padding:0 clamp(14px,3.2vw,32px)}
.hidden{display:none !important}

/* ---------- header ---------- */
.top{background:var(--brand);color:var(--onBrand);padding:16px 0 22px;border-bottom:1px solid var(--line)}
[data-skin="analytics"] .top{background:linear-gradient(180deg,#0F161B,#0B1014)}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px}
.logo svg{flex:none}
.logo b{display:block;font-size:15px;font-weight:800;letter-spacing:.01em;line-height:1.1}
.logo span{display:block;font-size:9px;letter-spacing:.18em;text-transform:uppercase;opacity:.72;font-weight:600;margin-top:2px}
.heat{display:grid;gap:2px;min-width:620px}
.heat .hh{font-size:9.5px;color:var(--ink3);text-align:left;white-space:nowrap;overflow:visible}
.heat .hd{font-size:11px;font-weight:600;color:var(--ink3);display:flex;align-items:center}
.heat .hc{height:22px;border-radius:3px}
.heat .hc:hover{outline:2px solid var(--ink);outline-offset:-1px}
.lmap{height:440px;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--card2);z-index:0}
.lmap .leaflet-popup-content-wrapper,.lmap .leaflet-tooltip{border-radius:10px}
[data-skin="analytics"] .lmap .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.85) contrast(.9) saturate(.6)}
@media(max-width:560px){.lmap{height:340px}}
@media print{.lmap{height:360px}}
.gtc-logo{display:block;height:64px;width:auto;flex:none;margin:-6px 0}
.logo-div{border-left:1px solid rgba(255,255,255,.25);padding-left:12px;margin-left:4px}
.auth-logo{display:flex;justify-content:center;margin-bottom:24px}
.auth-logo .gtc-logo{height:88px;max-width:100%;object-fit:contain}
.gtc-logo.on-dark{display:none}
[data-skin="analytics"] .gtc-logo.on-light{display:none}
[data-skin="analytics"] .gtc-logo.on-dark{display:block}
.ph-logo{display:block;height:34px;width:auto;margin-bottom:6px}
@media(max-width:560px){.gtc-logo{height:48px}.logo-div{display:none}}
.hactions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.skin{display:flex;gap:2px;padding:3px;border-radius:999px;background:rgba(255,255,255,.11)}
.skin button{border:0;background:transparent;color:rgba(255,255,255,.72);font-size:12.5px;font-weight:600;padding:6px 13px;border-radius:999px;cursor:pointer;display:flex;align-items:center;gap:6px}
.skin button[aria-pressed="true"]{background:#fff;color:#16284A}
[data-skin="analytics"] .skin button[aria-pressed="true"]{background:var(--accent);color:#1A1204}
.btn{display:inline-flex;align-items:center;gap:7px;border:0;border-radius:10px;padding:9px 16px;font-size:13.5px;font-weight:700;cursor:pointer;background:var(--accent);color:#fff;white-space:nowrap}
[data-skin="analytics"] .btn{background:var(--accent);color:#1A1204}
.btn.ghost{background:transparent;color:var(--onBrand);border:1px solid rgba(255,255,255,.3);font-weight:600}
.btn.sec{background:var(--card);color:var(--ink);border:1px solid var(--line);font-weight:600}
.btn:disabled{opacity:.5;cursor:not-allowed}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;opacity:.72}
.title{font-size:clamp(21px,2.7vw,29px);margin-top:5px}
.meta{font-size:12.5px;opacity:.72;margin-top:7px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.period{display:inline-flex;align-items:center;gap:7px;margin-top:10px;font-size:12.5px;padding:5px 12px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.16)}
.period b{font-weight:700;white-space:nowrap}
.period span{white-space:nowrap}
@media(max-width:560px){.period{flex-wrap:wrap;row-gap:2px}}
.card.plan{border-left:3px solid var(--accent);margin-top:14px}
.card.plan h3{font-size:13.5px}
.plan-list{margin:10px 0 0;padding-left:20px;display:grid;gap:8px}
.plan-list li{font-size:13.2px;line-height:1.55;color:var(--ink2)}
.plan-list li::marker{color:var(--accent);font-weight:700}
.plan-list li b{color:var(--ink)}
.dot{opacity:.5}

/* ---------- generic ---------- */
main{padding:22px 0 72px}
section{margin-bottom:30px;scroll-margin-top:70px}
.sechead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:0 0 13px}
.sechead h2{font-size:16px}
.sechead .sub{font-size:12.5px;color:var(--ink3)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;border-radius:999px;background:var(--accentBg);color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 26%,transparent);white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.card h3{font-size:13.5px;margin-bottom:3px}
.card .cs{font-size:12px;color:var(--ink3);margin:0 0 12px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}

<script>
/* =====================================================================
   Client paid-search dashboard
   Zero dependencies. The workbook is read in the browser: ZIP central
   directory -> DecompressionStream('deflate-raw') -> SpreadsheetML.
   ===================================================================== */
"use strict";

/* ---------------------------------------------------------------------
   1. XLSX reader
   ------------------------------------------------------------------ */
const td = new TextDecoder();

async function inflateRaw(bytes){
  if (typeof DecompressionStream !== "function") throw new Error("This browser can't unzip files (needs a 2023+ browser).");
  const ds = new DecompressionStream("deflate-raw");
  const stream = new Blob([bytes]).stream().pipeThrough(ds);
  return new Uint8Array(await new Response(stream).arrayBuffer());
}

/* Read a ZIP via its End Of Central Directory record. */
async function unzip(buf){
  const u8 = new Uint8Array(buf), dv = new DataView(buf);
  let eocd = -1;
  for (let i = u8.length - 22; i >= Math.max(0, u8.length - 66000); i--){
    if (dv.getUint32(i, true) === 0x06054b50){ eocd = i; break; }
  }
  if (eocd < 0) throw new Error("Not a valid .xlsx file (no ZIP directory found).");
  let count = dv.getUint16(eocd + 10, true);
  let cdOff = dv.getUint32(eocd + 16, true);
  // ZIP64 fallback
  if (cdOff === 0xffffffff || count === 0xffff){
    for (let i = eocd - 20; i >= 0; i--){
      if (dv.getUint32(i, true) === 0x07064b50){
        const z64 = Number(dv.getBigUint64(i + 8, true));
        count = Number(dv.getBigUint64(z64 + 32, true));
        cdOff = Number(dv.getBigUint64(z64 + 48, true));
        break;
      }
    }
  }
  const files = new Map();
  let p = cdOff;
  for (let i = 0; i < count && p + 46 <= u8.length; i++){
    if (dv.getUint32(p, true) !== 0x02014b50) break;
    const method = dv.getUint16(p + 10, true);
    const csize  = dv.getUint32(p + 20, true);
    const nlen   = dv.getUint16(p + 28, true);
    const elen   = dv.getUint16(p + 30, true);
    const clen   = dv.getUint16(p + 32, true);
    const lho    = dv.getUint32(p + 42, true);
    const name   = td.decode(u8.subarray(p + 46, p + 46 + nlen));
    files.set(name, { method, csize, lho });
    p += 46 + nlen + elen + clen;
  }
  return {
    names: [...files.keys()],
    async read(name){
      const f = files.get(name);
      if (!f) return null;
      const ln = dv.getUint16(f.lho + 26, true), le = dv.getUint16(f.lho + 28, true);
      const start = f.lho + 30 + ln + le;
      const raw = u8.subarray(start, start + f.csize);
      const out = f.method === 0 ? raw : await inflateRaw(raw);
      return td.decode(out);
    }
  };
}

const xml = (s) => new DOMParser().parseFromString(s, "application/xml");
const colIndex = (ref) => {
  let n = 0;
  for (let i = 0; i < ref.length; i++){
    const c = ref.charCodeAt(i);
    if (c < 65 || c > 90) break;
    n = n * 26 + (c - 64);
  }
  return n - 1;
};

/* Excel serial -> ISO date (1900 system, with the Lotus leap bug). */
function serialToDate(v){
  const ms = Math.round((v - 25569) * 86400000);
  return new Date(ms);
}

async function readWorkbook(arrayBuffer){
  const zip = await unzip(arrayBuffer);
  if (!zip.names.includes("xl/workbook.xml")) throw new Error("That file isn't an Excel workbook.");

  // shared strings
  const shared = [];
  const ssRaw = await zip.read("xl/sharedStrings.xml");
  if (ssRaw){
    const doc = xml(ssRaw);
    for (const si of doc.getElementsByTagName("si")){
      let s = "";
      for (const t of si.getElementsByTagName("t")) s += t.textContent;
      shared.push(s);
    }
  }

  // sheet name -> part path
  const rels = xml(await zip.read("xl/_rels/workbook.xml.rels"));
  const relMap = new Map();
  for (const r of rels.getElementsByTagName("Relationship")){
    let t = r.getAttribute("Target") || "";
    t = t.replace(/^\/xl\//, "").replace(/^\.\//, "");
    relMap.set(r.getAttribute("Id"), t.startsWith("xl/") ? t : "xl/" + t);
  }
  const wbDoc = xml(await zip.read("xl/workbook.xml"));
  const sheets = [];
  for (const sh of wbDoc.getElementsByTagName("sheet")){
    const rid = sh.getAttributeNS("http://schemas.openxmlformats.org/officeDocument/2006/relationships", "id")
             || sh.getAttribute("r:id");
    sheets.push({ name: sh.getAttribute("name") || "", path: relMap.get(rid) });
  }

  const out = new Map();
  for (const sh of sheets){
    if (!sh.path) continue;
    const raw = await zip.read(sh.path);
    if (!raw) continue;
    const doc = xml(raw);
    const rows = [];
    for (const row of doc.getElementsByTagName("row")){
      const arr = [];
      for (const c of row.getElementsByTagName("c")){
        const idx = colIndex(c.getAttribute("r") || "");
        const type = c.getAttribute("t");
        let val = null;
        if (type === "inlineStr"){
          val = "";
          for (const t of c.getElementsByTagName("t")) val += t.textContent;
        } else {
          const v = c.getElementsByTagName("v")[0];
          if (v){
            if (type === "s") val = shared[+v.textContent] ?? "";
            else if (type === "b") val = v.textContent === "1";
            else if (type === "e") val = null;
            else if (type === "str") val = v.textContent;
            else { const f = parseFloat(v.textContent); val = Number.isFinite(f) ? f : v.textContent; }
          }
        }
        if (idx >= 0) arr[idx] = val;
      }
      rows.push(arr);
    }
    out.set(sh.name, rows);
  }
  return out;
}

<script>
/* ---------------------------------------------------------------------
   2. Workbook -> dataset  (dynamic)

   Tabs are recognised by what is IN them, not by what they are called. Every
   non-empty tab is read, its header row is found, and its columns are matched
   against the metric names Google Ads exports use ("Impr.", "Cost / conv.",
   "Search lost IS (budget)" …). The set of columns decides what the tab is —
   account totals, campaigns, keywords, search terms, Performance Max, budget
   pacing, impression share, geography, placements, demographics — so a tab can
   be renamed, reordered or split across 7/31/90-day windows and still land in
   the right section. Completely empty tabs are ignored; anything that isn't
   recognised is still shown, as an auto-detected table, so no tab is dropped.
   ------------------------------------------------------------------ */
const LOCATIONS = ["Aiken","Alpharetta","Augusta Downtown","Austell","Brookhaven","Cartersville",
 "Covington","Douglasville","Fayetteville","Gwinnett","Johns Creek","Macon","Marietta","McDonough",
 "Newnan","Paulding","Peachtree City","Piedmont West","Rockdale/Stonecrest","Sandy Springs",
 "Snellville","Stockbridge","Sugarloaf","The Battery","Woodstock","Locust Grove","Evans"];
/* Set per workbook in buildDataset: a short place name that is plainly a longer
   one cut down ("Locust - …" beside "Locust Grove - …") is folded into it. */
let LOC_ALIAS = new Map();
const LOC_SORTED = [...LOCATIONS].sort((a,b)=>b.length-a.length);
const TYPOS = [[/^Snelville\b/i,"Snellville"]];
/* A prefix that names a campaign type rather than a place is never taken as a location. */
const NOT_A_PLACE = /^(pmax|performance max|search|display|video|shopping|demand gen|discovery|brand(ed)?( .*)?|non-?brand( .*)?|generic|remarketing|retargeting|competitors?|dsa|app|youtube|test|copy of .*)$/i;

function cleanCampaign(name){
  let n = String(name ?? "").trim().replace(/^['"\s]+|['"\s]+$/g,"").trim();
  TYPOS.forEach(([re,fix]) => { n = n.replace(re,fix); });
  return n;
}
function locOf(name){
  const r = locOfRaw(name);
  return r && LOC_ALIAS.has(r) ? LOC_ALIAS.get(r) : r;
}
function locOfRaw(name){
  const n = cleanCampaign(name);
  if (!n) return null;
  const jr = n.match(/^Joint Replacement\s*[-–]\s*(.+)$/i);
  if (jr){
    const cand = jr[1].trim();
    return LOCATIONS.find(l => l.toLowerCase() === cand.toLowerCase()) || cand;
  }
  const known = LOC_SORTED.find(l => n.toLowerCase().startsWith(l.toLowerCase()));
  if (known) return known;
  /* Any other account: "<Place> - <campaign type>" naming gives the place. */
  const m = n.match(/^(.+?)\s+[-–|]\s+\S/);
  if (m){
    const cand = m[1].trim();
    if (cand.length <= 40 && !NOT_A_PLACE.test(cand)) return cand;
  }
  return null;
}
function segmentOf(name){
  const n = cleanCampaign(name).toLowerCase();
  if (n.includes("pmax") || n.includes("performance max")) return "Performance Max";
  if (n.includes("joint replacement")) return "Joint Replacement";
  if (n.includes("branded oa")) return "Branded — OrthoAtlanta";
  if (n.includes("branded piedmont")) return "Branded — Piedmont";
  if (n.includes("specialt")) return "Specialties";
  if (n.includes("nonbrand") || n.includes("non-brand")) return "Non-Brand General";
  if (n.includes("brand")) return "Branded";
  return "Other";
}
const nv = (v) => {
  if (v === null || v === undefined) return 0;
  if (typeof v === "number") return Number.isFinite(v) ? v : 0;
  const f = parseFloat(String(v).replace(/[^0-9.\-]/g,""));
  return Number.isFinite(f) ? f : 0;
};
/* Share columns arrive as fractions (0.29) from Syncwith and as text ("29.27%",
   "< 10%", "> 90%") from a pasted Google Ads export; both become a fraction. */
const pv = (v) => {
  if (v === null || v === undefined) return 0;
  if (typeof v === "number") return Number.isFinite(v) ? (v > 1.5 ? v/100 : v) : 0;
  const s = String(v).trim();
  const f = parseFloat(s.replace(/[^0-9.\-]/g,""));
  if (!Number.isFinite(f)) return 0;
  return s.includes("%") || f > 1.5 ? f/100 : f;
};
const sv = (v) => v === null || v === undefined ? "" : String(v).trim();
const r2 = (x) => Math.round(x * 100) / 100;
const r4 = (x) => Math.round(x * 10000) / 10000;
const norm = (s) => String(s ?? "").toLowerCase().replace(/[^a-z0-9]/g,"");

/* Kept for anything that still asks for a tab by name. */
function pickSheet(book, wanted){
  const w = norm(wanted);
  for (const k of book.keys()) if (norm(k) === w) return book.get(k);
  for (const k of book.keys()){ const n = norm(k); if (n.startsWith(w) || w.startsWith(n)) return book.get(k); }
  return null;
}
