<script>
/* ---------------------------------------------------------------------
   4a. Accounts and encryption

   Gating a static page with a JavaScript `if` protects nothing — the page
   arrives whole and anyone can read past the check. So the dashboard's data
   is not merely hidden behind sign-in, it is encrypted, and a correct
   password is what produces the key.

   Envelope scheme, so several people can hold different passwords over one
   copy of the data:
     DEK   a random AES-256-GCM key; the dataset is sealed with it, once.
     KEK   per user, PBKDF2-SHA256(password, their own salt); it encrypts
           the DEK, and nothing else.
   Signing in derives the KEK and opens that user's wrapped DEK. AES-GCM is
   authenticated, so a wrong password fails to unwrap — no password hash is
   stored anywhere, and there is nothing else to compare against.

   The consequence to be honest about: lose every password and the published
   figures are unrecoverable. The workbook stays the source of truth, so the
   fix is to publish a fresh dashboard from it.
   ------------------------------------------------------------------ */
const KDF_ITER   = 310000;         // PBKDF2-SHA256 rounds; the cost an attacker pays per guess
const MIN_PW     = 10;
const SESSION_KEY = "ortho-session-v1";

const subtle = () => (window.crypto && window.crypto.subtle) || null;
const cryptoReady = () => !!subtle();

const B64 = {
  enc(buf){ const b = new Uint8Array(buf); let s = "";
    for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i+0x8000));
    return btoa(s); },
  dec(str){ return Uint8Array.from(atob(str), c => c.charCodeAt(0)); }
};
const randomBytes = n => crypto.getRandomValues(new Uint8Array(n));
const normalizeEmail = e => String(e || "").trim().toLowerCase();

async function deriveKEK(password, salt, iter){
  const base = await subtle().importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
  return subtle().deriveKey(
    { name:"PBKDF2", salt, iterations: iter || KDF_ITER, hash:"SHA-256" },
    base, { name:"AES-GCM", length:256 }, false, ["encrypt","decrypt"]);
}
async function newDEK(){
  return subtle().generateKey({ name:"AES-GCM", length:256 }, true, ["encrypt","decrypt"]);
}
async function sealBytes(bytes, key){
  const iv = randomBytes(12);
  const ct = await subtle().encrypt({ name:"AES-GCM", iv }, key, bytes);
  return { iv: B64.enc(iv), ct: B64.enc(ct) };
}
async function openBytes(env, key){
  const pt = await subtle().decrypt({ name:"AES-GCM", iv: B64.dec(env.iv) }, key, B64.dec(env.ct));
  return new Uint8Array(pt);
}
const sealJSON = async (obj, key) => sealBytes(new TextEncoder().encode(JSON.stringify(obj)), key);
const openJSON = async (env, key) => JSON.parse(new TextDecoder().decode(await openBytes(env, key)));

async function wrapDEK(dek, kek){ return sealBytes(await subtle().exportKey("raw", dek), kek); }
async function unwrapDEK(wrapped, kek){
  const raw = await openBytes(wrapped, kek);
  return subtle().importKey("raw", raw, { name:"AES-GCM" }, true, ["encrypt","decrypt"]);
}

/* Build the record stored for one person. Needs the DEK, so only someone
   already signed in (or setting up the very first account) can add a user. */
async function makeUser(email, password, role, dek){
  const salt = randomBytes(16);
  const kek = await deriveKEK(password, salt, KDF_ITER);
  return { email: normalizeEmail(email), role, iter: KDF_ITER,
           salt: B64.enc(salt), wrap: await wrapDEK(dek, kek),
           addedAt: new Date().toISOString() };
}

/* Returns the DEK on success, null on a wrong password. An unknown address is
   given the same answer as a wrong password, so the screen never reveals which
   addresses have accounts. */
async function unlock(email, password, auth){
  const user = (auth?.users || []).find(u => u.email === normalizeEmail(email));
  if (!user) { await deriveKEK(password, randomBytes(16), KDF_ITER); return null; }
  try {
    const kek = await deriveKEK(password, B64.dec(user.salt), user.iter || KDF_ITER);
    const dek = await unwrapDEK(user.wrap, kek);
    return { dek, user };
  } catch(e){ return null; }
}

/* Password rules. Length is what actually costs an attacker time here, since
   the wrapped key can be attacked offline by anyone holding the page. */
function passwordProblem(pw){
  if (!pw || pw.length < MIN_PW) return `Use at least ${MIN_PW} characters — this password is what encrypts the data, so length is the protection.`;
  if (/^(.)\1+$/.test(pw)) return "That's a single repeated character. Use something with more variety.";
  const weak = ["password","12345678","qwertyui","letmein","changeme","admin123","welcome1"];
  if (weak.some(w => pw.toLowerCase().includes(w))) return "That contains a very common password. Pick something less guessable.";
  return null;
}
function passwordStrength(pw){
  if (!pw) return { score:0, label:"", color:"var(--neutral)" };
  let bits = 0;
  const classes = [/[a-z]/, /[A-Z]/, /[0-9]/, /[^a-zA-Z0-9]/].filter(r => r.test(pw)).length;
  bits = pw.length * Math.log2(Math.max(2, classes * 22));
  if (bits < 45)  return { score:1, label:"Weak",       color:"var(--crit)" };
  if (bits < 70)  return { score:2, label:"Reasonable", color:"var(--warn)" };
  if (bits < 100) return { score:3, label:"Strong",     color:"var(--good)" };
  return { score:4, label:"Very strong", color:"var(--good)" };
}

/* Failed attempts are counted in this browser only. It slows down someone
   guessing by hand at the form; it does nothing against an offline attack on
   the wrapped key, which is why the password rules above exist. */
const ATTEMPT_KEY = "ortho-attempts-v1";
function readAttempts(){
  try { return JSON.parse(localStorage.getItem(ATTEMPT_KEY) || "{}"); } catch(_){ return {}; }
}
function lockoutRemaining(){
  const a = readAttempts();
  if (!a.until) return 0;
  return Math.max(0, Math.ceil((a.until - Date.now()) / 1000));
}
function noteFailure(){
  const a = readAttempts();
  a.n = (a.n || 0) + 1;
  if (a.n >= 5) a.until = Date.now() + Math.min(15 * 60, 30 * Math.pow(2, a.n - 5)) * 1000;
  try { localStorage.setItem(ATTEMPT_KEY, JSON.stringify(a)); } catch(_){}
}
function clearFailures(){ try { localStorage.removeItem(ATTEMPT_KEY); } catch(_){} }

/* The unlocked key is kept per tab, so closing the tab signs you out. It is
   deliberately not kept in localStorage: that would leave the key readable on
   the machine long after the person walked away. */
function saveSession(email, role, dek){
  return subtle().exportKey("raw", dek).then(raw => {
    try { sessionStorage.setItem(SESSION_KEY, JSON.stringify({ email, role, k: B64.enc(raw) })); } catch(_){}
  }).catch(() => {});
}
async function restoreSession(){
  let s = null;
  try { s = JSON.parse(sessionStorage.getItem(SESSION_KEY) || "null"); } catch(_){ return null; }
  if (!s || !s.k) return null;
  try {
    const dek = await subtle().importKey("raw", B64.dec(s.k), { name:"AES-GCM" }, true, ["encrypt","decrypt"]);
    return { email: s.email, role: s.role, dek };
  } catch(_){ return null; }
}
function dropSession(){ try { sessionStorage.removeItem(SESSION_KEY); } catch(_){} }
</script>

<script>
/* ---------------------------------------------------------------------
   4b. State + persistence

   A published state has two halves:
     public   brand wording and the account vault — enough to draw the
              sign-in screen and to unwrap the key, nothing more.
     vault    AES-GCM over {settings, data, history}. Without a password
              this is opaque bytes, in the page source as much as anywhere.
   ------------------------------------------------------------------ */
const LS_KEY = "ortho-tracker-state-v2";
/* Deliberately generic: this is what the page holds before anyone signs in, so
   naming the client here would put them in the public source for nothing. The
   real name is set in the update panel and travels inside the vault. */
const DEFAULT_SETTINGS = {
  client: "Paid search dashboard",
  strongCPL: 7.00, highCPL: 15.00,
  period: "",           // reporting period shown in the header; blank = derived from the workbook
  managedSince: "2026-08", // month the agency took the account over — marked on the history charts
  summary: null,        // {text, bullets:[]} written by the admin; null = generated from the figures
  actions: {}           // per-section plan text; a missing or blank entry = generated
};
const DEFAULT_BRAND = { name:"Golden Tide", sub:"Consulting" };
/* Public, because the request-access form is shown before anyone signs in. An
   agency contact address is not a secret; the figures behind the vault are. */
const DEFAULT_CONTACT = "";

let PUB     = null;   // public half: {v, origin, savedAt, brand, auth, vault}
let STATE   = null;   // decrypted half: {settings, data, history} — null until sign-in
let SESSION = null;   // {email, role, dek} — null when signed out
let SKIN = "classic";
let VIEW = "signin";
let ADMIN = { file:null, parsed:null, steps:[], busy:false, error:null, draft:null, confirm:null };
let UI = { tab:"keywords", q:"", sorts:{} };   // sorts: per-table {k, d}
let PUBLISH_MODE = "local";

/* Netlify build: saving/loading goes through a Netlify Function backed by Netlify
   Blobs instead of Claude's artifact-rewrite mechanism. This token just has to match
   the STATE_WRITE_TOKEN environment variable set on the Netlify site -- it's a simple
   gate against drive-by writes, not a substitute for the per-user account passwords,
   which still control what anyone can actually see once the page loads. */
const WRITE_TOKEN = "f391d3612002a338ed677e76bb33868ff2da0d50728ae227";
const STATE_ENDPOINT = "/.netlify/functions/state";

/* Roles: "admin" (full control), "viewer" = Staff (the full internal dashboard,
   read only), "client" (the client-facing version: no internal notes, no
   cost thresholds, no data-source detail). Admins and staff can preview the
   client version from the header. */
const isAdmin = () => SESSION?.role === "admin";
const isClient = () => SESSION?.role === "client";
const ROLE_NAME = { admin:"Administrator", viewer:"Staff", client:"Client" };
const clientView = () => isClient() || !!UI.asClient;
const hasAccounts = () => (PUB?.auth?.users || []).length > 0;
const hasData = () => !!(STATE?.data?.account);

function seedPublic(){
  const raw = JSON.parse(document.getElementById("seed").textContent);
  return { v:2, origin: raw.origin || "build", savedAt: raw.savedAt || "1970-01-01T00:00:00.000Z",
           brand: { ...DEFAULT_BRAND, ...(raw.brand||{}) },
           auth: raw.auth || { users: [] },
           contact: raw.contact || DEFAULT_CONTACT,
           vault: raw.vault || null };
}
function snapshotOf(data, at){
  const a = data.account || {};
  return { at, impressions:a.impressions||0, clicks:a.clicks||0, conv:a.conv||0, cost:a.cost||0,
           mtdCost:(data.mtd ? data.mtd.cost : data.monthly?.[0]?.cost)||0 };
}

/* Read one candidate URL and say which of three things happened. The distinction
   matters: "absent" is a page that was never set up, while "error" is a page whose
   state we simply failed to reach — and those two must not lead to the same
   screen, or a visitor arriving during a blip is invited to claim the dashboard. */
async function tryFetchState(url){
  try {
    const res = await fetch(url, { cache:"no-store" });
    if (res.status === 404) return { kind:"absent" };
    if (!res.ok) return { kind:"error" };
    const txt = await res.text();
    try { return { kind:"ok", json: JSON.parse(txt) }; }
    catch(_){ return { kind:"error" }; }   // an HTML shell, not our file
  } catch(_){ return { kind:"error" }; }
}

/* One fixed endpoint: a Netlify Function backed by Netlify Blobs. GET returns
   the current state (or a 404 if nothing's been saved yet); POST saves a new one. */
function stateUrlCandidates(){
  return [ new URL(STATE_ENDPOINT, location.origin).href ];
}

async function loadPublic(){
  const seed = seedPublic();
  const usable = s => s && s.v === 2 && s.auth;

  let published = null, anyError = false;
  for (const url of stateUrlCandidates()){
    const r = await tryFetchState(url);
    if (r.kind === "ok"){ published = r.json; break; }
    if (r.kind === "error") anyError = true;
  }

  let local = null, localBlocked = false;
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) local = JSON.parse(raw);
  } catch(e){ localBlocked = true; }

  /* A build seed always loses to a real publish: it carries no accounts, and its
     timestamp is the workbook's own client-timezone stamp, which can sit ahead of
     a viewer's clock. Published beats local on ties so one stale browser can't
     shadow a newer publish. */
  const cands = [published, local].filter(usable);
  if (seed.origin === "publish") cands.unshift(seed);

  const state = cands.length
    ? cands.reduce((best, s) => new Date(s.savedAt||0) > new Date(best.savedAt||0) ? s : best)
    : seed;

  /* Only offer to set the dashboard up when we are sure there is nothing to sign
     in to: no accounts anywhere, and nothing failed on the way to finding that out. */
  const certain = !anyError && !localBlocked;
  return { state, certain };
}

/* Seal the working state and hand back the public half that gets saved. */
async function buildPublic(settings, data, history, auth, brand, contact){
  const vault = await sealJSON({ settings, data, history }, SESSION.dek);
  return { v:2, origin:"publish", savedAt:new Date().toISOString(),
           brand: brand || PUB.brand,
           contact: contact !== undefined ? contact : (PUB.contact || ""),
           auth, vault };
}

/* Saves the data blob (not the whole page) to the Netlify Function, which writes it
   to Netlify Blobs. Every visitor's next load fetches the same blob back via GET. */
async function persist(pub){
  PUB = pub;
  try { localStorage.setItem(LS_KEY, JSON.stringify(pub)); } catch(e){ /* non-fatal */ }

  try {
    const res = await fetch(STATE_ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + WRITE_TOKEN },
      body: JSON.stringify(pub)
    });
    if (res.status === 401 || res.status === 403) return { ok:false, code:"not_writer" };
    if (!res.ok) return { ok:false, code:"unavailable" };
    PUBLISH_MODE = "shared";
    return { ok:true, how:"page" };
  } catch(e){
    return { ok:false, code:"unavailable", message: e?.message };
  }
}


/* ---------------------------------------------------------------------
   Rebuilding this page around new data.

   The files form of artifact.publish is refused once an artifact is shared
   publicly — exactly when a client-facing dashboard needs it most. So the page
   carries its own source as a template and can republish itself whole. The
   template holds two placeholders, the state and a copy of itself, which is
   what lets every rebuilt page rebuild again.
   ------------------------------------------------------------------ */
const TPL_CLOSE = "<" + "/script";
const unescapeTpl = t => t.split("<\\/script").join(TPL_CLOSE);
const escapeTpl   = t => t.split(TPL_CLOSE).join("<\\/script");
/* < keeps a stray "</script" inside the data from closing the tag early;
   it is an ordinary JSON escape and parses straight back to "<". */
const jsonForPage = o => JSON.stringify(o).replace(/</g, "\\u003c");

function buildPage(pub){
  const el = document.getElementById("tpl");
  if (!el || !el.textContent.trim()) return null;
  const tpl = unescapeTpl(el.textContent);
  if (!tpl.startsWith("<!doctype html")) return null;
  const seedJson = jsonForPage({ ...pub, origin:"publish" });
  const tplEsc = escapeTpl(tpl);
  /* One pass, so nothing resembling a placeholder inside the data is touched. */
  const out = tpl.replace(/__(SEED|TPL)__/g, (_, k) => k === "SEED" ? seedJson : tplEsc);
  return /__(SEED|TPL)__/.test(out.slice(0, 400)) ? null : out;
}

/* ---------------------------------------------------------------------
   5. Derived figures
   ------------------------------------------------------------------ */
function derive(){
  const D = STATE.data, S = STATE.settings;
  const a = D.account;
  const cur = {
    impressions:a.impressions, clicks:a.clicks, conv:a.conv, cost:a.cost,
    ctr: a.impressions ? a.clicks/a.impressions*100 : 0,
    cpc: a.clicks ? a.cost/a.clicks : 0,
    cpm: a.impressions ? a.cost/a.impressions*1000 : 0,
    cpl: a.conv ? a.cost/a.conv : 0,
    cvr: a.clicks ? a.conv/a.clicks*100 : 0
  };
  /* Compare with the month before when the sheet has it; otherwise with the
     previous upload, as before. */
  let prev = null, prevLabel = "vs last upload";
  if (D.prevMonth){ prev = D.prevMonth; prevLabel = "vs " + fmtMonthShort(D.prevMonth.month); }
  else if (STATE.history.length >= 2) prev = STATE.history[STATE.history.length-2];
  const locs = D.locations.map(L => ({ ...L, cpl: L.conv ? L.cost/L.conv : 0,
    ctr: L.impressions ? L.clicks/L.impressions*100 : 0,
    sig: signal(L.conv ? L.cost/L.conv : 0, L.conv, S.strongCPL, S.highCPL) }));
  return { D, S, cur, prev, prevLabel, locs };
}
const fmtMonthShort = iso => { const d = new Date(String(iso).slice(0,7) + "-01T00:00:00");
  return isNaN(d) ? "" : d.toLocaleDateString("en-US",{ month:"short" }); };
const fmtMonthLong = iso => { const d = new Date(String(iso).slice(0,7) + "-01T00:00:00");
  return isNaN(d) ? "" : d.toLocaleDateString("en-US",{ month:"long", year:"numeric" }); };
const pctChange = (c,p) => (p === null || p === undefined || !p) ? null : ((c-p)/p)*100;

function deltaHTML(d, invert, label){
  if (d === null) return `<span class="muted" style="font-size:11.5px">no prior upload</span>`;
  const flat = Math.abs(d) < 0.5;
  const good = invert ? d <= 0 : d >= 0;
  const cls = flat ? "flat" : good ? "up" : "down";
  const arrow = flat ? "→" : d >= 0 ? "↑" : "↓";
  return `<span class="delta ${cls}">${arrow} ${Math.abs(d).toFixed(Math.abs(d)<10?1:0)}%</span>`+
         `<span class="muted">${esc(label || "vs last upload")}</span>`;
}


/* ---------------------------------------------------------------------
   6. Reporting period, and the plans that hang off the figures

   Everything below has a generated form and an editable form. The generated
   one is what the numbers say; the editable one is what the person running
   the account decides to say about them. The admin panel starts from the
   generated text, so an override is always an edit rather than a blank page.
   ------------------------------------------------------------------ */

/* The reporting month comes from the account performance date in the sheet (see
   buildDataset). Google Ads reporting here mostly describes the month just gone,
   so a pull date on its own is read as "the month before", never as today. */
function derivedPeriod(){
  const D = STATE?.data;
  if (!D) return "";
  if (D.reporting?.label) return D.reporting.label;
  /* Saves made before the reporting month was detected: the month before the pull. */
  const pulled = D.pulledAt ? new Date(D.pulledAt) : null;
  if (pulled && !isNaN(pulled)){
    const p = new Date(pulled.getFullYear(), pulled.getMonth() - 1, 1);
    return p.toLocaleDateString("en-US",{ month:"long", year:"numeric" });
  }
  const mtd = D.monthly?.[0];
  return mtd ? fmtMonth(mtd.month) : "";
}
/* Days a budget had to spend: the whole reporting month when the pacing tab is
   last month's totals, days elapsed when it is month to date. */
function budgetDays(D){
  if (D.pacingKind === "month" && D.reporting){ const [y,m] = D.reporting.month.split("-").map(Number); return new Date(y, m, 0).getDate(); }
  const at = D.pulledAt ? new Date(D.pulledAt) : new Date();
  return Math.max(1, at.getDate() - (D.pacingKind === "mtd" ? 1 : 0)) || 1;
}
const reportPeriod = () => (STATE?.settings?.period || "").trim() || derivedPeriod();
/* The window a section's figures cover, as the workbook states it. Older saves
   (before tabs were detected by content) carry no window, so they keep the
   tracker's own "Month to date". */
function winChip(roles, suffix){
  const W = STATE?.data?.windows;
  const lab = W ? roles.map(r => W[r]).find(Boolean) || "" : "Month to date";
  return lab ? `<span class="chip">${esc(lab)}${esc(suffix || "")}</span>` : "";
}
/* Where the reporting month came from, for the header's hover text. */
function periodBasis(){
  if ((STATE?.settings?.period || "").trim()) return "Set by your account manager";
  const r = STATE?.data?.reporting;
  return r?.basis ? `Taken from ${r.basis}` : "";
}
/* When the figures were last refreshed: a sheet sync, a pull stamp, or the upload. */
function dataStampText(D){
  if (!D) return "";
  if (D.syncedAt) return `Synced from Google Sheet ${fmtWhen(D.syncedAt)}`;
  if (D.pulledAt) return `Data pulled ${fmtWhen(D.pulledAt)}`;
  const st = STATE?.history?.length ? STATE.history[STATE.history.length-1].at : null;
  return st ? `Uploaded ${fmtWhen(st)}` : "Workbook uploaded";
}
const periodChip = () => `<span class="chip">${esc(reportPeriod() ? reportPeriod() : "Current reporting period")}</span>`;

/* The reporting month beside the month before, in plain terms — what a client
   actually asks: did it get better or worse, and by how much. */
function kpiTable(){
  if (!hasData()) return [];
  const { D, cur } = derive();
  const p = D.prevMonth;
  const P = p ? { impressions:p.impressions, clicks:p.clicks, conv:p.conv, cost:p.cost,
    ctr: p.impressions ? p.clicks/p.impressions*100 : null, cpc: p.clicks ? p.cost/p.clicks : null,
    cpl: p.conv ? p.cost/p.conv : null, cvr: p.clicks ? p.conv/p.clicks*100 : null } : null;
  const pm = p ? fmtMonthShort(p.month) : "";
  const say = (key, c, v) => {
    if (!P || v === null || v === undefined) return "";
    const d = c - v, up = d > 0, same = Math.abs(d) < (["ctr","cvr"].includes(key) ? 0.05 : key === "cpc" || key === "cpl" ? 0.005 : 0.5);
    if (same) return `About the same as ${pm}`;
    switch (key){
      case "cost":  return `${fmtMoney(Math.abs(d))} ${up?"more":"less"} spent than in ${pm}`;
      case "conv":  return `${fmtNum(Math.abs(d))} ${up?"more":"fewer"} enquiries and bookings`;
      case "cpl":   return `Each conversion cost ${fmtMoney2(Math.abs(d))} ${up?"more":"less"}`;
      case "clicks":return `${fmtNum(Math.abs(d))} ${up?"more":"fewer"} visits to the website`;
      case "cpc":   return `Each visit cost ${fmtMoney2(Math.abs(d))} ${up?"more":"less"}`;
      case "ctr":   return up ? "More people who saw an ad clicked it" : "Fewer people who saw an ad clicked it";
      case "cvr":   return up ? "A larger share of visitors converted" : "A smaller share of visitors converted";
      case "impressions": return `Ads were shown ${compact(Math.abs(d))} ${up?"more":"fewer"} times`;
    }
    return "";
  };
  const row = (metric, key, fmt, invert) => {
    const c = cur[key], v = P ? P[key] : null;
    const ch = v ? (c - v) / v * 100 : null;
    return { metric, key, period: fmt(c), prev: v === null || v === undefined ? "—" : fmt(v), change: ch, invert,
             text: say(key, c, v) };
  };
  return [
    row("Spend", "cost", fmtMoney, false),
    row("Conversions", "conv", fmtNum, false),
    row("Cost per conversion", "cpl", fmtMoney2, true),
    row("Clicks", "clicks", fmtNum, false),
    row("Cost per click", "cpc", fmtMoney2, true),
    row("Click-through rate", "ctr", v => fmtPctRaw(v, 2), false),
    row("Conversion rate", "cvr", v => fmtPctRaw(v, 1), false),
    row("Impressions", "impressions", fmtNum, false)
  ];
}
const changeHTML = (ch, invert) => {
  if (ch === null || ch === undefined || !isFinite(ch)) return `<span class="muted">—</span>`;
  const flat = Math.abs(ch) < 0.5, good = invert ? ch <= 0 : ch >= 0;
  return `<span class="delta ${flat ? "flat" : good ? "up" : "down"}">${flat ? "→" : ch >= 0 ? "↑" : "↓"} ${Math.abs(ch).toFixed(Math.abs(ch) < 10 ? 1 : 0)}%</span>`;
};

/* One plan per section, written from that section's own figures. Each returns a
   list of lines; an empty list means the section has nothing worth acting on. */
function generatedActions(id){
  if (!hasData()) return [];
  const { D, S, cur, locs } = derive();
  const conv = locs.filter(l => l.conv > 0);
  const cheap = [...conv].sort((a,b)=>a.cpl-b.cpl);
  const dear  = [...conv].sort((a,b)=>b.cpl-a.cpl);
  const out = [];
  const money = fmtMoney, money2 = fmtMoney2;

  if (id === "overview"){
    if (cheap[0]) out.push(`Shift budget toward ${cheap.slice(0,3).map(l=>l.name).join(", ")} — the three cheapest markets, converting at ${money2(cheap[0].cpl)}–${money2(cheap[Math.min(2,cheap.length-1)].cpl)}.`);
    if (dear[0] && dear[0].cpl > S.highCPL) out.push(`Review ${dear[0].name} before it takes any more spend: ${money2(dear[0].cpl)} per conversion against a ${money2(S.highCPL)} ceiling.`);
    const noConv = locs.filter(l => !l.conv && l.cost > 0);
    if (noConv.length) out.push(`Check conversion tracking on ${noConv.length} location${noConv.length>1?"s":""} spending with nothing recorded (${noConv.slice(0,3).map(l=>l.name).join(", ")}${noConv.length>3?"…":""}).`);
    out.push(`Blended cost per conversion is ${money2(cur.cpl)} on ${money(cur.cost)}; hold that as the benchmark for the next period.`);
  }

  if (id === "locations"){
    const strong = locs.filter(l => l.sig.key === "strong");
    const high = locs.filter(l => l.sig.key === "high");
    if (strong.length) out.push(`Increase budgets in ${strong.map(l=>l.name).join(", ")} — all at or under the ${money2(S.strongCPL)} strong line.`);
    if (high.length) out.push(`Audit ${high.map(l=>l.name).join(", ")}: keywords, match types and landing pages, before any budget increase.`);
    const thin = locs.filter(l => l.clicks > 0 && l.clicks < 200);
    if (thin.length) out.push(`${thin.length} market${thin.length>1?"s are":" is"} below 200 clicks, too little to judge on yet — leave them a full period before acting.`);
  }

  if (id === "budget"){
    const { rows } = budgetRows(D);
    const cplOf = Object.fromEntries(locs.map(l => [l.name, l]));
    const capped = rows.filter(r => r.band === "full" && cplOf[r.name]?.sig.key === "strong");
    const cappedDear = rows.filter(r => r.band === "full" && cplOf[r.name]?.sig.key === "high");
    const under = rows.filter(r => r.band === "under" && r.allowed > 0).sort((a,b)=>a.used-b.used);
    if (capped.length) out.push(`${capped.slice(0,4).map(r=>r.name).join(", ")} spent their full budget at a strong cost per conversion — these are the places where more budget should buy more leads.`);
    if (cappedDear.length) out.push(`${cappedDear.slice(0,3).map(r=>r.name).join(", ")} also hit their budget, but at a high cost per conversion; fix efficiency before adding money.`);
    if (under.length) out.push(`${under.slice(0,3).map(r=>`${r.name} (${(r.used*100).toFixed(0)}% used)`).join(", ")} left budget unspent — bids or keyword coverage are too narrow to use it, or the budget can move elsewhere.`);
    if (!out.length) out.push(`Every location used most of its budget; no budget changes are needed on spend alone.`);
  }

  if (id === "campaigns"){
    const rows = campaignRows().filter(r => r.cost > 0);
    const conv = rows.filter(r => r.conv >= 5).sort((a,b) => a.cpl - b.cpl);
    const waste = rows.filter(r => !r.conv && r.cost > 100).sort((a,b) => b.cost - a.cost);
    const dear = rows.filter(r => r.sig.key === "high" && r.cost > 300).sort((a,b) => b.cost - a.cost);
    const capped = rows.filter(r => r.sig.key === "strong" && r.lostBudget !== null && r.lostBudget > 0.3 && r.kind !== "PMax");
    if (capped.length) out.push(`${capped.slice(0,3).map(r => `${r.campaign} (${fmtIS(r.lostBudget)} lost to budget)`).join(", ")} convert cheaply and are held back by budget — raise these first.`);
    if (dear.length) out.push(`Review ${dear.slice(0,3).map(r => `${r.campaign} (${fmtMoney2(r.cpl)} per conversion)`).join(", ")} — the costliest campaigns with meaningful spend.`);
    if (waste.length) out.push(`${waste.slice(0,3).map(r => `${r.campaign} (${fmtMoney(r.cost)})`).join(", ")} spent without a single conversion; check tracking, keywords and landing page.`);
    if (!out.length && conv[0]) out.push(`${conv[0].campaign} is the most efficient campaign at ${fmtMoney2(conv[0].cpl)} per conversion.`);
  }

  if (id === "timing" && D.timing){
    const { goodH, goodD } = timingStats(D.timing.search || D.timing, S);
    const totC = goodH.reduce((s,h)=>s+h.cost,0), totV = goodH.reduce((s,h)=>s+h.conv,0), avg = totV ? totC/totV : 0;
    const cheap = goodH.filter(h => h.cpl <= avg * 0.85).slice(0,4);
    const dear = goodH.filter(h => h.cpl >= avg * 1.3).slice(-4).reverse();
    if (cheap.length) out.push(`Raise bids (e.g. +10–20%) during ${cheap.map(h => hourName(h.hour)).join(", ")} — the hours converting well below the ${fmtMoney2(avg)} average.`);
    if (dear.length) out.push(`Lower bids or limit ads during ${dear.map(h => `${hourName(h.hour)} (${fmtMoney2(h.cpl)})`).join(", ")}, where each conversion costs at least 30% more.`);
    if (goodD.length > 1) out.push(`${DOW_NAMES[goodD[0].dow]} is the most efficient day (${fmtMoney2(goodD[0].cpl)}) and ${DOW_NAMES[goodD[goodD.length-1].dow]} the least (${fmtMoney2(goodD[goodD.length-1].cpl)}); worth a day-of-week bid adjustment.`);
    out.push(`Hour and day bid adjustments apply to Search campaigns; Performance Max can only be scheduled on or off.`);
  }

  if (id === "share"){
    const search = (D.competitive||[]).filter(c => !/pmax|performance max/i.test(c.campaign));
    const lost = search.filter(c => c.impressions > 300 && c.lostBudget > 0.3)
      .sort((a,b)=>b.lostBudget-a.lostBudget);
    const rank = search.filter(c => c.impressions > 300 && c.lostRank > 0.3)
      .sort((a,b)=>b.lostRank-a.lostRank);
    if (lost.length) out.push(`Raising budget on ${lost.slice(0,3).map(c=>`${c.campaign} (${fmtIS(c.lostBudget)} lost)`).join(", ")} buys impressions that are already being forfeited.`);
    if (rank.length) out.push(`${rank.slice(0,3).map(c=>c.campaign).join(", ")} lose most to ad rank, not budget — that needs bids, quality score or relevance work, and money alone won't fix it.`);
    if (!lost.length && !rank.length) out.push(`No campaign is losing a material share of auctions; coverage is not the constraint this period.`);
  }

  if (id === "pmax"){
    const rows = D.pmax || [];
    const tot = rows.reduce((o,r)=>({ conv:o.conv+r.conv, cost:o.cost+r.cost }), { conv:0, cost:0 });
    const ch = D.pmaxChannels || [];
    const chCost = ch.reduce((s,c)=>s+c.cost,0);
    const disp = chCost ? ch.filter(c => /display/i.test(c.channel)).reduce((s,c)=>s+c.cost,0) / chCost : 0;
    if (tot.conv && disp > 0.6) out.push(`Performance Max converts at ${money2(tot.cost/tot.conv)}, but ${fmtPctRaw(disp*100,0)} of its spend runs on the Display Network. Check those conversions turn into real appointments before moving budget here from Search.`);
    else if (tot.conv) out.push(`Performance Max is converting at ${money2(tot.cost/tot.conv)} against a blended ${money2(cur.cpl)}; confirm lead quality, then consider it for extra budget.`);
    const dead = rows.filter(r => r.cost > 0 && !r.conv);
    if (dead.length) out.push(`${dead.map(r=>r.assetGroup||r.campaign).join(", ")} spent without converting; refresh the assets or pause.`);
    const idle = rows.filter(r => !r.cost && !r.impressions);
    if (idle.length) out.push(`${idle.map(r=>r.assetGroup||r.campaign).join(", ")} had no delivery at all — check the asset groups are approved and live.`);
  }

  if (id === "audience"){
    const ages = (D.age||[]).filter(a => a.conv > 0 && a.label !== "Unknown");
    const best = [...ages].sort((a,b)=>(a.cost/a.conv)-(b.cost/b.conv))[0];
    const worst = [...ages].sort((a,b)=>(b.cost/b.conv)-(a.cost/a.conv))[0];
    if (best && worst && best !== worst) out.push(`Bid up ${best.label} (${money2(best.cost/best.conv)} per conversion) and consider a negative adjustment on ${worst.label} (${money2(worst.cost/worst.conv)}).`);
    const dev = [...(D.device||[])].filter(d=>d.conv>0).sort((a,b)=>(a.cost/a.conv)-(b.cost/b.conv));
    if (dev.length > 1) out.push(`${dev[0].label} convert most cheaply at ${money2(dev[0].cost/dev[0].conv)}; ${dev[dev.length-1].label} cost ${money2(dev[dev.length-1].cost/dev[dev.length-1].conv)}. Worth a device bid adjustment.`);
    const unknown = (D.age||[]).find(a => a.label === "Unknown");
    const allClicks = (D.age||[]).reduce((s,a)=>s+a.clicks,0);
    if (unknown && allClicks && unknown.clicks/allClicks > 0.2) out.push(`${fmtPctRaw(unknown.clicks/allClicks*100,0)} of clicks have no age attached, so read these splits as directional rather than precise.`);
  }

  if (id === "terms"){
    const waste = (D.keywords||[]).filter(k => !k.conv && k.cost > 100).sort((a,b)=>b.cost-a.cost);
    const winners = (D.keywords||[]).filter(k => k.conv > 0).sort((a,b)=>(a.cost/a.conv)-(b.cost/b.conv));
    if (waste.length) out.push(`${money(waste.reduce((s,k)=>s+k.cost,0))} went to ${waste.length} keyword${waste.length>1?"s":""} with no conversions — starting with ${waste.slice(0,3).map(k=>`"${k.keyword}"`).join(", ")}. Pause or re-match these.`);
    if (winners.length) out.push(`Build out ${winners.slice(0,3).map(k=>`"${k.keyword}"`).join(", ")} — the cheapest converting terms, from ${money2(winners[0].cost/winners[0].conv)}.`);
    const broad = (D.searchTerms||[]).filter(t => !t.conv && t.cost > 50);
    if (broad.length) out.push(`Add negatives from the search-terms tab: ${broad.length} term${broad.length>1?"s":""} spent over $50 without converting.`);
  }

  if (id === "geo"){
    const g = D.geo || [];
    const spendNoConv = g.filter(z => !z.conv && z.cost > 200).sort((a,b)=>b.cost-a.cost);
    const best = g.filter(z => z.conv > 0).sort((a,b)=>(a.cost/a.conv)-(b.cost/b.conv));
    if (best.length) out.push(`Best-converting areas${D.geoWindow === undefined || /9[0-2]/.test(D.geoWindow) ? " over 90 days" : ""}: ${best.slice(0,3).map(z=>`${z.zip} (${money2(z.cost/z.conv)})`).join(", ")}. Consider a positive location bid adjustment.`);
    if (spendNoConv.length) out.push(`${spendNoConv.slice(0,3).map(z=>z.zip).join(", ")} each took over $200 with no conversions${D.geoWindow === undefined || /9[0-2]/.test(D.geoWindow) ? " in 90 days" : " in this window"} — candidates for exclusion.`);
  }

  if (id === "placements"){
    const p = D.placements || [];
    const junk = p.filter(x => x.impressions > 50 && !x.clicks);
    if (junk.length) out.push(`${junk.length} placement${junk.length>1?"s":""} served over 50 impressions with zero clicks (${junk.slice(0,3).map(x=>x.placement).join(", ")}) — add them to the exclusion list.`);
    const apps = p.filter(x => /\.(online|apk|app)$|apk|game/i.test(x.placement));
    if (apps.length) out.push(`${apps.length} placement${apps.length>1?"s look":" looks"} like app or download inventory rather than medical content; excluding that category usually improves quality without much volume loss.`);
    if (!out.length) out.push(`Nothing in the placement list looks obviously wasteful this period.`);
  }
  return out;
}

function actionsFor(id){
  const A = STATE?.settings?.actions || {};
  const override = A.__forData === dataKey(STATE?.data) ? A[id] : null;
  if (typeof override === "string" && override.trim())
    return { lines: override.split(/\n+/).map(l => l.replace(/^[-•*]\s*/, "").trim()).filter(Boolean), edited:true };
  return { lines: generatedActions(id), edited:false };
}

/* The card that closes each section. */
function actionCard(id){
  /* Next actions are internal working notes: never shown in the client view. */
  if (clientView()) return "";
  const { lines, edited } = actionsFor(id);
  if (!lines.length) return "";
  return `<div class="card plan">
    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap">
      <h3>Next actions</h3>
      <span class="muted" style="font-size:11px">${edited ? "Written by your account manager" : "Suggested from the figures above"}</span>
    </div>
    <ol class="plan-list">${lines.map(l => `<li>${edited ? esc(l) : l}</li>`).join("")}</ol>
  </div>`;
}

/* Locally-written narrative — no network call, so it always renders. */
function narrative(){
  if (!hasData()) return { head:"", bullets:[] };
  const { D, S, cur, prev, prevLabel, locs } = derive();
  const conv = [...locs].filter(l => l.conv > 0);
  const best = [...conv].sort((a,b)=>a.cpl-b.cpl)[0];
  const worst = [...conv].sort((a,b)=>b.cpl-a.cpl)[0];
  const spendiest = [...locs].sort((a,b)=>b.cost-a.cost)[0];
  const counts = locs.reduce((o,l)=>(o[l.sig.key]=(o[l.sig.key]||0)+1,o),{});
  const noConv = locs.filter(l => !l.conv && l.cost > 0);
  const paceDays = budgetDays(D);
  const overspend = (D.pacing||[]).filter(p => p.period === "DAILY" && p.budget > 0 && p.cost > p.budget * paceDays * 1.15);
  const lostBudget = [...(D.competitive||[])].filter(c => c.impressions > 400 && !/pmax|performance max/i.test(c.campaign)).sort((a,b)=>b.lostBudget-a.lostBudget)[0];
  const mtd = D.mtd || (D.tabs ? null : D.monthly?.[0]);

  const bullets = [];
  const internal = !clientView();
  if (internal && best && worst) bullets.push({ c:"var(--good)", t:`<b>${esc(best.name)}</b> is the most efficient market at <b>${fmtMoney2(best.cpl)}</b> per conversion — ${(worst.cpl/best.cpl).toFixed(0)}× cheaper than <b>${esc(worst.name)}</b> at ${fmtMoney2(worst.cpl)}.` });
  if (spendiest) bullets.push({ c:"var(--s1)", t:`<b>${esc(spendiest.name)}</b> takes the largest share of spend (${fmtMoney(spendiest.cost)}, ${(spendiest.cost/cur.cost*100).toFixed(0)}% of the period) across ${spendiest.campaigns} campaigns.` });
  if (internal && counts.strong) bullets.push({ c:"var(--good)", t:`<b>${counts.strong} location${counts.strong>1?"s":""}</b> sit at or below the ${fmtMoney2(S.strongCPL)} strong-CPL line — the first place to put incremental budget.` });
  if (internal && counts.high) bullets.push({ c:"var(--crit)", t:`<b>${counts.high} location${counts.high>1?"s":""}</b> are at or above ${fmtMoney2(S.highCPL)} per conversion and should be reviewed before any budget increase.` });
  if (noConv.length) bullets.push({ c:"var(--neutral)", t:`${noConv.length} location${noConv.length>1?"s have":" has"} spend but no recorded conversions this period: ${esc(noConv.slice(0,4).map(l=>l.name).join(", "))}${noConv.length>4?" and others":""}.` });
  if (lostBudget && lostBudget.lostBudget > 0.15) bullets.push({ c:"var(--warn)", t:`<b>${esc(lostBudget.campaign)}</b> loses <b>${fmtIS(lostBudget.lostBudget)}</b> of available search impressions to budget — the clearest capacity constraint in the account.` });
  if (internal && overspend.length) bullets.push({ c:"var(--warn)", t:`${overspend.length} campaign${overspend.length>1?"s are":" is"} spending more than 15% above daily budget × ${paceDays} days; worth a budget check.` });

  const head = `Across <b>${fmtNum(locs.length)} locations</b> and <b>${fmtNum(D.campaigns.length)} campaigns</b>, ${esc(reportPeriod() || "the current reporting period")} delivered <b>${fmtNum(cur.conv)} conversions</b> from <b>${fmtNum(cur.clicks)} clicks</b> on <b>${fmtMoney(cur.cost)}</b> of spend — a blended <b>${fmtMoney2(cur.cpl)}</b> per conversion at a <b>${fmtPctRaw(cur.ctr)}</b> click-through rate.` +
    (mtd ? ` So far in ${esc(fmtMonth(mtd.month))}, the account stands at ${fmtNum(mtd.conv)} conversions on ${fmtMoney(mtd.cost)}.` : "");
  const move = prev ? (() => {
    const dc = pctChange(cur.conv, prev.conv), dk = pctChange(cur.cost, prev.cost);
    if (dc === null) return "";
    const dir = Math.abs(dc) < 3 ? "held roughly flat" : dc > 0 ? `rose ${Math.abs(dc).toFixed(0)}%` : `fell ${Math.abs(dc).toFixed(0)}%`;
    const sp = dk === null ? "" : ` on ${Math.abs(dk) < 3 ? "flat" : dk > 0 ? `${Math.abs(dk).toFixed(0)}% higher` : `${Math.abs(dk).toFixed(0)}% lower`} spend`;
    return ` ${D.prevMonth ? `Against ${esc(fmtMonthLong(D.prevMonth.month))}` : "Against the previous upload"}, conversions ${dir}${sp}.`;
  })() : "";
  return { head: head + move, bullets };
}

/* What the dashboard actually shows: the admin's words when they've written any,
   otherwise the generated ones. Both go through the same renderer so an override
   never looks like a different kind of thing. */
/* Typed wording belongs to the figures it was written about. Each override
   remembers them (the reporting month); once the sheet moves on, the
   dashboard goes back to the generated text instead of showing stale words. */
const dataKey = D => !D ? "" : D.reporting?.month ? `m:${D.reporting.month}` : `c:${Math.round(D.account?.cost || 0)}`;
const overrideFresh = o => !!o && o.forData === dataKey(STATE?.data);
function summaryContent(){
  const s0 = STATE?.settings?.summary;
  const s = overrideFresh(s0) ? s0 : null;
  if (!hasData() && !(s && (String(s.text||"").trim() || (s.bullets||[]).length)))
    return { paras:[], bullets:[], edited:false };
  if (s && (String(s.text||"").trim() || (s.bullets||[]).length)){
    const paras = String(s.text||"").split(/\n\s*\n/).map(t=>t.trim()).filter(Boolean);
    const bullets = (s.bullets||[]).map(b => String(b).replace(/^[-•*]\s*/,"").trim()).filter(Boolean);
    return { paras, bullets: bullets.map(t => ({ c:"var(--s1)", t: esc(t) })), edited:true };
  }
  const n = narrative();
  return { paras:[n.head], bullets:n.bullets, edited:false };
}
/* Used to pre-fill the admin editor, so it has to be safe before any workbook exists. */

function logoImg(where){
  const alt = esc(`${PUB?.brand?.name || "Golden Tide"}${PUB?.brand?.sub ? " " + PUB.brand.sub : ""}`);
  if (where === "brand") return `<img class="gtc-logo" src="${LOGO.light}" alt="${alt}">`;
  return `<img class="gtc-logo on-light" src="${LOGO.dark}" alt="${alt}"><img class="gtc-logo on-dark" src="${LOGO.light}" alt="${alt}">`;
}

/* ---------------------------------------------------------------------
   One table renderer for the whole dashboard.

   Every table is sortable on every column that holds a value worth ordering.
   Sort state is kept per table id in UI.sorts, so sorting the keyword list
   doesn't disturb the locations table, and the choice survives a re-render.
   ------------------------------------------------------------------ */
function sortRows(rows, key, dir, sortVal){
  const val = sortVal || ((r) => r[key]);
  const s = [...rows].sort((a,b) => {
    const av = val(a, key), bv = val(b, key);
    const an = av === null || av === undefined || av === "", bn = bv === null || bv === undefined || bv === "";
    if (an && bn) return 0;
    if (an) return 1;              // blanks sink, whichever way the column is sorted
    if (bn) return -1;
    if (typeof av === "string" || typeof bv === "string")
      return String(av).localeCompare(String(bv), undefined, { numeric:true, sensitivity:"base" });
    return av - bv;
  });
  return dir === "desc" ? s.reverse() : s;
}

/* cols: [{key, label, align, fmt, sort:false, sortKey, sortVal, cell, width, foot}] */
function dataTable(id, cols, rows, o = {}){
  if (!rows || !rows.length)
    return `<p class="muted" style="font-size:12.5px;margin:0">${esc(o.empty || "Nothing in this tab of the uploaded workbook.")}</p>`;

  const def = o.defaultSort || { k: cols.find(c => c.sort !== false)?.key, d: "desc" };
  const st = UI.sorts[id] || def;
  const col = cols.find(c => c.key === st.k);
  const sorted = col ? sortRows(rows, col.sortKey || col.key, st.d, col.sortVal) : rows;
  const shown = o.limit ? sorted.slice(0, o.limit) : sorted;

  const head = cols.map(c => {
    const on = st.k === c.key;
    const sortable = c.sort !== false;
    const align = c.align || (c.fmt ? "right" : "left");
    return `<th${sortable ? ` data-tsort="${esc(id)}:${esc(c.key)}" tabindex="0" role="button"`
                          : ` class="nosort"`}`+
      `${on ? ` aria-sort="${st.d === "desc" ? "descending" : "ascending"}"` : ""}`+
      ` style="text-align:${align}${c.width ? `;width:${c.width}` : ""}"`+
      ` title="${sortable ? `Sort by ${esc(c.label)}` : ""}">${esc(c.label)}`+
      `<span class="sarrow">${on ? (st.d === "desc" ? "↓" : "↑") : (sortable ? "↕" : "")}</span></th>`;
  }).join("");

  const body = shown.map(r => `<tr>${cols.map(c => {
    const align = c.align || (c.fmt ? "right" : "left");
    const inner = c.cell ? c.cell(r) : c.fmt ? esc(c.fmt(r[c.key], r)) : esc(r[c.key] ?? "");
    return `<td style="text-align:${align}">${inner}</td>`;
  }).join("")}</tr>`).join("");

  const foot = o.totals ? `<tfoot><tr>${cols.map(c => {
    const align = c.align || (c.fmt ? "right" : "left");
    return `<td style="text-align:${align}">${c.foot ? c.foot(o.totals, sorted) : ""}</td>`;
  }).join("")}</tr></tfoot>` : "";

  const more = o.limit && sorted.length > o.limit
    ? `<p class="cs" style="margin:8px 0 0">Showing the first ${fmtNum(o.limit)} of ${fmtNum(sorted.length)} rows, in the order sorted above.</p>` : "";

  return `<div class="tw${o.scroll ? " scroll" : ""}"><table>`+
         `<thead><tr>${head}</tr></thead><tbody>${body}</tbody>${foot}</table></div>${more}`;
}

function secOverview(){
  const { D, S, cur, prev, prevLabel, locs } = derive();
  const mtd = D.mtd || (D.tabs ? null : D.monthly?.[0]);
  const dark = SKIN === "analytics";

  /* A change against the month before when there is one; otherwise a plain descriptor. */
  const kpi = (k,v,d,invert,hero,sub) =>
    `<div class="kpi${hero?" hero":""}"><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div>`+
    `<div class="d">${(d === undefined || d === null) ? `<span class="muted">${esc(sub||"")}</span>` : deltaHTML(d, invert, prevLabel)}</div></div>`;

  let s = `<section id="overview">
    <div class="sechead"><h2>Account overview</h2>
      ${periodChip()}
      <span class="sub">Every campaign in the account${D.accountDerived ? " · totals summed from the campaign rows" : ""}${prev && D.prevMonth ? ` · changes are against ${esc(fmtMonthLong(D.prevMonth.month))}` : ""}</span></div>
    <div class="grid g4" style="margin-bottom:14px">
      ${kpi("Spend", fmtMoney(cur.cost), pctChange(cur.cost, prev?.cost), false, false, reportPeriod() || "this reporting period")}
      ${kpi("Conversions", fmtNum(cur.conv), pctChange(cur.conv, prev?.conv), false, false, `across ${locs.length} locations`)}
      ${kpi("Cost per conversion", fmtMoney2(cur.cpl), pctChange(cur.cpl, prev && prev.conv ? prev.cost/prev.conv : null), true, true, "blended across the account")}
      ${kpi("Conversion rate", fmtPctRaw(cur.cvr, 1), pctChange(cur.cvr, prev && prev.clicks ? prev.conv/prev.clicks*100 : null), false, false, "conversions ÷ clicks")}
      ${kpi("Clicks", fmtNum(cur.clicks), pctChange(cur.clicks, prev?.clicks), false, false, `${fmtPctRaw(cur.ctr,2)} of impressions`)}
      ${kpi("Cost per click", fmtMoney2(cur.cpc), pctChange(cur.cpc, prev && prev.clicks ? prev.cost/prev.clicks : null), true, false, "what each visit cost")}
      ${kpi("Click-through rate", fmtPctRaw(cur.ctr, 2), pctChange(cur.ctr, prev && prev.impressions ? prev.clicks/prev.impressions*100 : null), false, false, "clicks ÷ impressions")}
      ${kpi("Impressions", fmtNum(cur.impressions), pctChange(cur.impressions, prev?.impressions), false, false, `across ${D.campaigns.length} campaigns`)}
    </div>`;

  /* Month to date — its own window, never mixed with the month above. */
  const mtdName = mtd ? fmtMonthLong(mtd.month) : "";
  const asOfTxt = D.pulledAt ? ` up to ${new Date(D.pulledAt).toLocaleDateString("en-US",{ month:"short", day:"numeric" })}` : "";
  const sum = summaryContent();
  s += `<div class="split">
    <div class="card">
      <h3>Performance summary</h3>
      ${sum.edited ? `<p class="cs">Written by your account manager.</p>` : clientView() ? "" : `<p class="cs">Written from the figures in the sheet — no number here is estimated.</p>`}
      ${sum.paras.map(p => `<p class="sum">${p}</p>`).join("")}
      <ul class="bullets">${sum.bullets.map(b=>`<li><i style="background:${b.c}"></i><span>${b.t}</span></li>`).join("")}</ul>
    </div>
    <div class="card">
      <h3>${mtd ? `${esc(mtdName)} so far` : "Month to date"}</h3>
      <p class="cs">${mtd ? `The month in progress${esc(asOfTxt)} · whole account. A part month, so it reads lower than the full month to the left.` : "—"}</p>
      ${mtd ? `<div class="grid" style="grid-template-columns:1fr 1fr;gap:10px">
        ${kpi("Spend", fmtMoney(mtd.cost))}
        ${kpi("Conversions", fmtNum(mtd.conv))}
        ${kpi("Cost per conversion", mtd.conv ? fmtMoney2(mtd.cost/mtd.conv) : "—", null, false, false, cur.cpl && D.reporting ? `${fmtMonthShort(D.reporting.month)}: ${fmtMoney2(cur.cpl)}` : "")}
        ${kpi("Clicks", fmtNum(mtd.clicks), null, false, false, mtd.impressions ? `${fmtNum(mtd.impressions)} impressions` : "")}
      </div>` : `<p class="muted">No month-to-date figures in this sheet.</p>`}
    </div>
  </div>`;

  /* The reporting month beside the month before, in plain terms. */
  const rows = kpiTable();
  if (D.prevMonth && rows.length){
    const pm = fmtMonthLong(D.prevMonth.month), cm = reportPeriod();
    s += `<div class="card" style="margin-top:14px">
      <h3>${esc(cm)} compared with ${esc(pm)}</h3>
      <p class="cs">Green is an improvement, red is a decline — for costs, lower is better.${D.monthlyImprEstimated ? ` ${esc(pm)} impressions are worked out from its clicks and click-through rate.` : ""}</p>
      <div class="tw"><table>
        <thead><tr><th class="nosort" style="text-align:left">Measure</th><th class="nosort">${esc(cm)}</th><th class="nosort">${esc(pm)}</th>
          <th class="nosort">Change</th><th class="nosort" style="text-align:left">What it means</th></tr></thead>
        <tbody>${rows.map(r => `<tr><td>${esc(r.metric)}</td><td>${esc(r.period)}</td>
          <td style="color:var(--ink3)">${r.key === "impressions" && D.monthlyImprEstimated && r.prev !== "—" ? "≈ " : ""}${esc(r.prev)}</td>
          <td>${changeHTML(r.change, r.invert)}</td>
          <td style="text-align:left;white-space:normal;min-width:220px;color:var(--ink2)">${esc(r.text)}</td></tr>`).join("")}</tbody>
      </table></div>
    </div>`;
  }

  if (dark){
    /* Each needle is placed inside the range this account's own locations occupy,
       so the position means something. No outside benchmark is implied. */
    /* 10th-90th percentile rather than min-max: one runaway market would otherwise
       squash every needle against the left edge and tell you nothing. */
    const band = (fn, filter) => {
      const v = locs.filter(filter || (()=>true)).map(fn).filter(Number.isFinite).sort((a,b)=>a-b);
      if (!v.length) return [0,1];
      const q = p => { const i = (v.length-1)*p, f = Math.floor(i);
        return v[f] + (v[Math.min(f+1,v.length-1)] - v[f]) * (i-f); };
      const lo = q(0.1), hi = q(0.9);
      return hi > lo ? [lo,hi] : [v[0], v[v.length-1] || v[0]+1];
    };
    const [cpcLo, cpcHi] = band(l => l.clicks ? l.cost/l.clicks : NaN, l => l.clicks > 0);
    const [cpmLo, cpmHi] = band(l => l.impressions ? l.cost/l.impressions*1000 : NaN, l => l.impressions > 0);
    const [ctrLo, ctrHi] = band(l => l.ctr, l => l.impressions > 0);
    const [cplLo, cplHi] = band(l => l.cpl, l => l.conv > 0);
    s += `<div class="card" style="margin-top:14px"><h3>Where the account sits in its own range</h3>
      <p class="cs">Each dial spans the middle of this account's own spread — the 10th to the 90th percentile across its ${locs.length} locations — and the needle is the blended account figure. These are this account's limits, not an industry benchmark, and a needle pinned to an end means the blend sits outside the typical market.</p>
      <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr))">
        <div>${gauge("Cost per click", cur.cpc, cpcLo, cpcHi, fmtMoney2, "10th–90th percentile of locations")}</div>
        <div>${gauge("Cost per 1,000 impr.", cur.cpm, cpmLo, cpmHi, fmtMoney2, "10th–90th percentile of locations")}</div>
        <div>${gauge("Click-through rate", cur.ctr, ctrLo, ctrHi, v=>fmtPctRaw(v,1), "10th–90th percentile of locations")}</div>
        <div>${clientView() ? gauge("Cost per conversion", cur.cpl, cplLo, cplHi, fmtMoney2, "10th–90th percentile of locations")
          : gauge("Cost per conversion", cur.cpl, cplLo, cplHi, fmtMoney2, "ticks mark the two thresholds",
          [{at:S.strongCPL,color:"var(--good)",label:`Strong threshold ${fmtMoney2(S.strongCPL)}`},
           {at:S.highCPL,color:"var(--crit)",label:`High threshold ${fmtMoney2(S.highCPL)}`}])}</div>
      </div></div>`;
  }


  /* The sheet's monthly history (complete months only), oldest on the left, with the
     month the agency took over marked so the client can see the change since. */
  const series = (D.monthly || []).filter(m => D.reporting ? m.month.slice(0,7) <= D.reporting.month
      : !(D.mtd && m.month.slice(0,7) === String(D.mtd.month).slice(0,7)))
    .slice(0, clientView() ? 36 : 12).reverse();
  if (series.length >= 2 && !clientView()){
    const pts = f => series.map(m => ({ label: fmtMonthShort(m.month), v: f(m) }));
    const box = (title, p, o) => `<div><div class="k" style="font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);margin-bottom:4px">${title}</div>${trend(p, o)}</div>`;
    s += `<div class="card" style="margin-top:14px">
      <h3>Month by month</h3>
      <p class="cs">The last ${series.length} complete months, from the sheet's monthly history.</p>
      <div class="grid g4">
        ${box("Conversions", pts(m => m.conv), { color:"var(--s1)", aria:"Conversions by month" })}
        ${box("Spend", pts(m => m.cost), { color:"var(--s2)", format:fmtMoney, aria:"Spend by month" })}
        ${box("Cost per conversion", pts(m => m.conv ? m.cost/m.conv : 0), { color:"var(--s3)", format:fmtMoney2, aria:"Cost per conversion by month" })}
        ${box("Clicks", pts(m => m.clicks), { color:"var(--s5)", aria:"Clicks by month" })}
      </div></div>`;
    return s + `    ${actionCard("overview")}
  </section>`;
  }
  if (series.length >= 2){
    const since = String(S.managedSince || "").slice(0,7);
    const mIdx = since ? series.findIndex(m => m.month.slice(0,7) === since) : -1;
    const agency = PUB.brand?.name || "we";
    const yLabel = iso => { const d = new Date(String(iso).slice(0,7) + "-01T00:00:00");
      return isNaN(d) ? "" : d.toLocaleDateString("en-US",{ month:"short" }) + " ’" + String(d.getFullYear()).slice(2); };
    const pts = f => series.map(m => ({ label: yLabel(m.month), v: f(m) }));
    const mk = mIdx > 0 ? { marker:mIdx } : {};
    const box = (title, p, o) => `<div><div class="k" style="font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);margin-bottom:4px">${title}</div>${trend(p, { ...o, ...mk })}</div>`;
    /* Before vs since: average month in the 12 months before the takeover, against the average month since. */
    let compare = "";
    if (mIdx > 0){
      const before = series.slice(Math.max(0, mIdx - 12), mIdx), after = series.slice(mIdx);
      const avg = (arr, f) => arr.reduce((t,m) => t + f(m), 0) / arr.length;
      const cplOf = arr => { const c = arr.reduce((t,m)=>t+m.conv,0); return c ? arr.reduce((t,m)=>t+m.cost,0) / c : 0; };
      const b = { conv:avg(before, m=>m.conv), cost:avg(before, m=>m.cost), clicks:avg(before, m=>m.clicks), cpl:cplOf(before) };
      const a = { conv:avg(after, m=>m.conv), cost:avg(after, m=>m.cost), clicks:avg(after, m=>m.clicks), cpl:cplOf(after) };
      const tile = (k, av, bv, fmt, invert) => `<div class="kpi"><div class="k">${esc(k)}</div><div class="v">${esc(fmt(av))}</div>
        <div class="d">${changeHTML(bv ? (av - bv) / bv * 100 : null, invert)}<span class="muted">vs ${esc(fmt(bv))} before</span></div></div>`;
      compare = `<div class="grid g4" style="margin-top:14px">
        ${tile("Conversions a month", a.conv, b.conv, fmtNum, false)}
        ${tile("Cost per conversion", a.cpl, b.cpl, fmtMoney2, true)}
        ${tile("Clicks a month", a.clicks, b.clicks, fmtNum, false)}
        ${tile("Spend a month", a.cost, b.cost, fmtMoney, false)}
      </div>
      <p class="cs" style="margin:10px 0 0">Average month since ${esc(fmtMonthLong(series[mIdx].month))} (${after.length} month${after.length===1?"":"s"}) against the average of the ${before.length} months before.</p>`;
    }
    s += `<div class="card" style="margin-top:14px">
      <h3>Month by month</h3>
      <p class="cs">${esc(yLabel(series[0].month))} to ${esc(yLabel(series[series.length-1].month))}, oldest on the left.${mIdx > 0 ? ` The dashed line marks ${esc(fmtMonthLong(series[mIdx].month))}, when ${esc(agency)} took over the account; the shaded stretch is before.` : ""}</p>
      <div class="grid g4">
        ${box("Conversions", pts(m => m.conv), { color:"var(--s1)", aria:"Conversions by month" })}
        ${box("Spend", pts(m => m.cost), { color:"var(--s2)", format:fmtMoney, aria:"Spend by month" })}
        ${box("Cost per conversion", pts(m => m.conv ? m.cost/m.conv : 0), { color:"var(--s3)", format:fmtMoney2, aria:"Cost per conversion by month" })}
        ${box("Clicks", pts(m => m.clicks), { color:"var(--s5)", aria:"Clicks by month" })}
      </div>
      ${compare}
    </div>`;
    return s + `    ${actionCard("overview")}
  </section>`;
  }
  const hist = STATE.history;
  if (hist.length < 2){
    s += `<div class="note" style="margin-top:14px">${SVG.info}<div><b>Trend charts start after your next upload.</b> `+
      `Add a month-by-month tab to the sheet (Month, Clicks, Conversions, Cost) and they appear straight away.</div></div>`;
    return s + `    ${actionCard("overview")}
  </section>`;
  }
  const hp = k => hist.map(h => ({ label: fmtDay(h.at), v: h[k] }));
  s += `<div class="card" style="margin-top:14px">
    <h3>Trend across uploads</h3>
    <p class="cs">One point each time the data was refreshed — not a daily series. ${hist.length} snapshots recorded.</p>
    <div class="grid g4">
      <div>${trend(hp("conv"),{color:"var(--s1)",aria:"Conversions across uploads"})}</div>
      <div>${trend(hp("cost"),{color:"var(--s2)",format:fmtMoney,aria:"Cost across uploads"})}</div>
      <div>${trend(hp("clicks"),{color:"var(--s3)",aria:"Clicks across uploads"})}</div>
      <div>${trend(hp("impressions"),{color:"var(--s5)",aria:"Impressions across uploads"})}</div>
    </div></div>`;
  return s + `    ${actionCard("overview")}
  </section>`;
}

function secLocations(){

    { name:`Strong — at or under ${fmtMoney2(S.strongCPL)}`, value:counts[0].n, color:"var(--good)" },
    { name:"On track", value:counts[1].n, color:"var(--warn)" },

        ${hbar(chartRows, { format: v => "$"+v.toFixed(2), labelWidth:132, rowH:23, valueWidth:86, clamp:true,
